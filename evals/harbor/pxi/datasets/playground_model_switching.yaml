dataset_name: playground_model_switching
description: >-
  PXI eval suite for lazy playground model discovery and model switching
  through the playground.model.list / playground.model.set UI operations.
  Covers listing available playground models and resolving ambiguous model
  switch requests by discovering model targets before applying the selected
  target. Every example primes the search_browser_actions discovery step (a
  catalog excerpt produced by the real signature renderer) so the example
  scores the operation-selection step.
evaluators:
  - correct_tools_called
  - tool_call_args_match
  - tool_call_count_within_limit
examples:
  - id: list-available-playground-models
    splits: [regression]
    input:
      contexts:
        - type: playground
          instances:
            - instanceId: 1
              model:
                type: builtin
                provider: OPENAI
                modelName: gpt-5
      messages:
        - role: user
          content: What models are available in this playground?
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: list playground models }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: &catalog |
            // Complete catalog: all 11 UI operations, best query matches first.
            // Further search_browser_actions calls return these same operations re-ranked — reuse
            // this catalog instead of searching again. Only per-operation availability
            // ("available on the current page") changes, after navigation.

            // UIResult<T = unknown> = { ok: true; output: T } | { ok: false; code?: ErrorCode; error: string }
            // ErrorCode = "UNKNOWN_OPERATION" | "NOT_AVAILABLE" | "INVALID_INPUT" | "CAPABILITY_DISABLED"
            //   | "NO_SESSION" | "HANDLER_ERROR" | "NOT_FOUND" | "STALE_REVISION" | "NO_RUN_OUTPUT"
            // Branch on `code` (stable), not on the `error` prose (for humans).

            /**
             * Set the playground-wide repetitions count in the currently mounted playground. Use this before running when the user wants more confidence across repeated LLM calls, is investigating flaky outputs, or wants to validate structured output or tool-call behavior before saving a prompt. `repetitions` must be between 1 and 30; do not stage a count outside that range — tell the user the limit instead.
             * kind: write; available on the current page.
             */
            ui.playground.repetitions.set(input: { repetitions: number }): Promise<UIResult>;

            /**
             * Run the currently mounted playground using the browser UI state. This starts the same run the user would start with the playground Run button, so it uses the current prompt instances, model settings, inputs, dataset selection, tools, and streaming preferences visible in the UI. It runs all current comparison instances together, and resolves only when the whole run ends (every instance finished, or the user stopped it) — await it, then read the results in the same script: `playground.experiment.readResults` for the scored per-example results when the run recorded experiments (its output includes the `experimentIds`), or `playground.run.readOutput` for the raw instance output otherwise.
             * kind: write; available on the current page.
             */
            ui.playground.run(input: {}): Promise<UIResult>;

            /**
             * Read the output from the currently mounted playground's latest run. The result includes each matching instance's raw output, run status, errors, tool calls, and traceId when the run produced a Phoenix trace. Use this after `playground.run` finishes so you can inspect the model response and analyze the trace.
             * kind: read; available on the current page.
             */
            ui.playground.run.readOutput(input: { instanceId?: number; repetitionNumber?: number }): Promise<UIResult<{ status: "not_started" | "running" | "partial" | "finished"; instances: unknown[]; message: string }>>;

            /**
             * Set whether future dataset-backed playground runs in the currently mounted playground are recorded as persistent experiments or created as temporary unrecorded runs, and optionally stage a name, description, and metadata for the experiments the next run produces. Use this before running when the user asks to record, persist, save the run as an experiment, run without recording, or label the next experiment with notes such as a hypothesis. Stage structured notes (a hypothesis, the variable being changed, a baseline experiment id) as keys on `experimentMetadata` rather than as description prose, so later reads can find them programmatically.
             * kind: write; available on the current page.
             */
            ui.playground.experiment.setRecording(input: { recordExperiments: boolean; experimentName?: string; experimentDescription?: string; experimentMetadata?: unknown }): Promise<UIResult>;

            /**
             * Read the current playground prompt for one instance. Use this before editing a playground prompt so you have stable message IDs and the latest revision token. The result includes both the numeric `instanceId` for tool calls and the alphabetic `label` (A, B, C, D) shown to the user; use labels when discussing instances with the user. If there is exactly one playground instance, `instanceId` may be omitted. If there are multiple comparison instances, pass the specific `instanceId`.
             * kind: read; available on the current page.
             */
            ui.playground.prompt.read(input: { instanceId?: number }): Promise<UIResult<{ instanceId: number; index: number; label: string; revision: string; dirty: boolean; prompt: { id?: string; version?: string; tag?: string | unknown } | unknown; messages: { id: number; role: string; content?: string; toolCallId?: string; toolCalls?: unknown }[] }>>;

            /**
             * Propose edits to one playground prompt instance. This tool does not change the prompt immediately: the browser renders an inline diff and the user must accept or reject it. Call `playground.prompt.read` before your first edit and pass its `revision` as `expectedRevision`. Edits are rejected if the prompt changed since that read — but a successful edit returns the new `revision`, which is valid as the next `expectedRevision`, so chained edits need no re-read between them. Use the alphabetic label from `playground.prompt.read` (A, B, C, D) when telling the user which instance is being edited, but pass the numeric `instanceId` when calling this tool. Use message IDs from `playground.prompt.read` for updates, deletes, insertion anchors, and reorders. `operations` must always be an array, even for one edit. Use camelCase field names exactly as shown. Common valid examples: {"type":"update_message","messageId":1,"content":"new text"}; {"type":"insert_message","afterMessageId":1,"role":"user","content":"new text"}; {"type":"delete_message","messageId":1}; {"type":"reorder_messages","messageIds":[1,2,3]}.
             * kind: approval; available on the current page. Stages a change the user must accept; the returned promise resolves with the decision.
             */
            ui.playground.prompt.edit(input: { instanceId: number; expectedRevision: string; operations?: unknown[] }): Promise<UIResult<{ status: "accepted" | "rejected"; instanceId: number; message: string; acceptedBy?: string; revision?: string; summary?: { instanceIndex: number; instanceLabel: string; additions: number; deletions: number } }>>;

            /**
             * Save the active changes for one mounted playground prompt instance. Use this only when the user explicitly asks to save the current playground prompt, or after they explicitly accept that the current prompt should become a saved prompt version. In manual approval mode, the browser asks the user to approve before committing the save; approval is bypassed only when edit_permission is bypass. If the instance is already associated with a prompt, omit `name` and `promptId` to save a new version on that prompt. If the instance is not associated with a prompt and `name` is omitted, the browser derives a valid prompt name from the current prompt content and creates a new prompt. Pass `name` only when the user provided a desired prompt name or explicitly asked to save as a new prompt. Pass `promptId` only when saving a new version on a specific existing prompt. Always pass a clear, short, concise `description` that states the change or intention. Tags work like releases: pass tags only when the user explicitly asks to tag, release, or promote this version.
             * kind: approval; available on the current page. Stages a change the user must accept; the returned promise resolves with the decision.
             */
            ui.playground.prompt.save(input: { instanceId?: number; promptId?: string; name?: string; description: string; tags?: string[] }): Promise<UIResult>;

            /**
             * Switch the selected model for one mounted playground instance. This tool applies immediately, like the playground model menu. If there is exactly one playground instance, `instanceId` may be omitted. If there are multiple comparison instances, pass the numeric `instanceId` from the playground context. Take `target` verbatim from a `playground.model.list` result (`builtinModels[].target` or `customProviderModels[].target`): {type: 'builtin', provider, modelName} for Phoenix built-in providers, {type: 'custom', customProviderId, modelName} for a configured custom provider.
             * kind: write; available on the current page.
             */
            ui.playground.model.set(input: { instanceId?: number; target: unknown }): Promise<UIResult>;

            /**
             * List the model targets currently available in the mounted playground. Use this before suggesting playground model options, building model-choice questions, or resolving exact provider/model/custom-provider target payloads for `playground.model.set` — each entry's `target` is a ready-made `target` input for that operation.
             * kind: read; available on the current page.
             */
            ui.playground.model.list(input: {}): Promise<UIResult<{ builtinModels: { target: { type: string; provider: string; modelName: string } }[]; customProviderModels: { target: { type: string; customProviderId: string; modelName: string }; customProviderName: string; provider: string }[]; message: string }>>;

            /**
             * Set manual input values for template variables in the currently mounted playground. Use this when the user asks to fill, provide, change, or set playground variables before running or comparing prompts. This only updates variable values in browser UI state; it does not edit prompt messages, change dataset mappings, or run the playground.
             * kind: write; available on the current page.
             */
            ui.playground.variables.set(input: { values: { key: string; value: string }[] }): Promise<UIResult>;

            /**
             * Edit an existing experiment's name, description, or metadata. Use this to record observations or notes on an experiment after reviewing its results, or to rename or redescribe it. Provide `experimentId` plus at least one field to change; omitted fields are left untouched. `metadata` replaces the experiment's metadata object as a whole, so read the current metadata first and resubmit the complete object when appending.
             * kind: approval; available on the current page. Stages a change the user must accept; the returned promise resolves with the decision.
             */
            ui.experiment.patch(input: { experimentId: string; name?: string; description?: string | unknown; metadata?: unknown }): Promise<UIResult>;
    expected:
      ui_operations:
        required: [playground.model.list]
        forbidden: [playground.model.set]
      budgets:
        max_tool_calls: 2
    metadata: {}
  - id: generic-sonnet-switch-discovers-targets-first
    # "Sonnet" is ambiguous between the available Anthropic targets, so the
    # switch must be grounded in a playground.model.list result. Under the
    # script surface the agent may legitimately batch list-then-set into one
    # script (picking the target from the list result at runtime), so only
    # the discovery call is required — a guessed switch without listing
    # fails the required check.
    splits: [regression]
    input:
      contexts:
        - type: playground
          instances:
            - instanceId: 1
              model:
                type: builtin
                provider: OPENAI
                modelName: gpt-5
      messages:
        - role: user
          content: Switch this playground to sonnet.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: switch the playground model }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [playground.model.list]
      budgets:
        max_tool_calls: 2
    metadata: {}
  - id: generic-sonnet-switch-applies-discovered-target
    # Primes the discovery script and its list output so the agent enters
    # mid-loop holding the available targets; it must decisively switch the
    # model with playground.model.set. "Newest" pins which of the two
    # discovered Sonnet targets is correct, so asking the user to
    # disambiguate is scored as a failure here (ambiguity-driven discovery
    # is the previous example's territory).
    splits: [regression]
    input:
      contexts:
        - type: playground
          instances:
            - instanceId: 1
              model:
                type: builtin
                provider: OPENAI
                modelName: gpt-5
      messages:
        - role: user
          content: Switch this playground to the newest sonnet.
        - role: assistant
          tool_calls:
            - id: load-playground-skill
              name: load_skill
              args: { skill_name: playground }
        - role: tool
          tool_call_id: load-playground-skill
          name: load_skill
          content: |
            <skill>
              <name>playground</name>
              <description>Author, edit, or iterate on prompts in the Phoenix prompt playground.</description>
            </skill>
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: switch the playground model }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
        - role: assistant
          tool_calls:
            - id: list-targets
              name: execute_browser_action
              args:
                summary: List the models available in this playground.
                script: |
                  const targets = await ui.playground.model.list({});
                  return targets;
        - role: tool
          tool_call_id: list-targets
          name: execute_browser_action
          content: |
            Script completed after 1 ui call.

            Calls:
            1. playground.model.list ok 11ms 428ch

            Return value:
            {
              "ok": true,
              "output": {
                "builtinModels": [
                  { "target": { "type": "builtin", "provider": "OPENAI", "modelName": "gpt-5" } },
                  { "target": { "type": "builtin", "provider": "ANTHROPIC", "modelName": "claude-3-5-sonnet-20240620" } },
                  { "target": { "type": "builtin", "provider": "ANTHROPIC", "modelName": "claude-sonnet-4-6" } }
                ],
                "customProviderModels": [],
                "message": "Use the returned target payloads when calling playground.model.set."
              }
            }
    expected:
      tools:
        forbidden: [ask_user]
      ui_operations:
        required: [playground.model.set]
      ui_operation_args:
        # A well-formed script may inline the discovered target verbatim OR
        # re-read the list in the same script and compute the target
        # dynamically (`target: newest.target`) — both are correct, and the
        # dynamic form leaves no literal model name in the argument source
        # to assert on. What is never correct is pinning a literal target
        # other than the newest Sonnet, so the assertion is: a `target` is
        # passed, and the argument source names no wrong model.
        playground.model.set:
          target:
            any: true
            not_contains: ["claude-3-5-sonnet-20240620", "gpt-5"]
      budgets:
        max_tool_calls: 1
    metadata: {}
