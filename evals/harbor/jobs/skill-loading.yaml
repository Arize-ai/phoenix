# Check which skills Claude Code and Codex load for each request in tasks/skill-loading/.
# Build the base image with scripts/build_skill_loading_image.sh first. The job runs on
# local Docker because the tasks build from that local image.
#
# Each trial stops early: Claude Code after 3 turns, and Codex at the task's 30-second
# agent timeout. The verifier records every skill the agent loaded.
datasets:
  - path: evals/harbor/tasks/skill-loading/phoenix-tracing
agents:
  - name: claude-code
    import_path: evals.harbor.agents.coding_agents:PreinstalledClaudeCode
    model_name: anthropic/claude-sonnet-5-5
    kwargs:
      max_turns: 3
      disallowed_tools: "WebSearch,WebFetch"
    skills: &skills
      - skills/phoenix-cli
      - skills/phoenix-error-analysis
      - skills/phoenix-evals
      - skills/phoenix-harbor
      - skills/phoenix-tracing
  - name: codex
    import_path: evals.harbor.agents.coding_agents:PreinstalledCodex
    model_name: openai/gpt-5.6
    kwargs:
      reasoning_effort: medium
      web_search: disabled
    skills: *skills
environment:
  type: docker
n_attempts: 3
n_concurrent_trials: 6
retry:
  max_retries: 1
