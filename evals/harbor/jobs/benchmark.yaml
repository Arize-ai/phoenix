# Run every agent on every task with `make harbor-run`. Pass options such as
# `-e docker -k 1` through HARBOR_ARGS, or create a reduced job file for a subset.
tasks:
  - path: evals/harbor/tasks/error-analysis
agents:
  - name: phoenix-chat-agent
    import_path: evals.harbor.agents.phoenix_chat_agent:PhoenixChatAgent
    model_name: anthropic/claude-fable-5-1
    # PXI supports both provider APIs, so this condition allows both hosts.
    extra_allowed_hosts: [api.anthropic.com, api.openai.com]
  - name: claude-code-mcp
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeMcpAgent
    model_name: anthropic/claude-fable-5-1
    extra_allowed_hosts: [api.anthropic.com]
    resume_trajectory: true
    kwargs:
      version: "2.1.267"
  - name: claude-code-cli
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeCliAgent
    model_name: anthropic/claude-fable-5-1
    extra_allowed_hosts: [api.anthropic.com]
    resume_trajectory: true
    kwargs:
      version: "2.1.267"
    skills:
      - .agents/skills/phoenix-cli
      - .agents/skills/phoenix-error-analysis
      - .agents/skills/phoenix-evals
      - .agents/skills/phoenix-tracing
environment:
  type: daytona
  extra_allowed_hosts: [downloads.claude.ai, arizeai-433a7140.mintlify.app, arize.com]
  # Delete sandboxes left by interrupted runs so they do not consume the organization quota.
  kwargs:
    auto_stop_interval_mins: 30
    auto_delete_interval_mins: 30
# Gate on the mean of two attempts to tolerate one transient failure.
n_attempts: 2
# Retry infrastructure errors, but do not retry trials that produce a reward.
retry:
  max_retries: 1
