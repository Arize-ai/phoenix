datasets:
  - path: evals/harbor/tasks/eval-workflows
agents:
  - name: claude-code-opus-no-skills
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeCliAgent
    model_name: anthropic/claude-opus-5-5
    extra_allowed_hosts: [api.anthropic.com]
  - name: claude-code-opus-skills
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeCliAgent
    model_name: anthropic/claude-opus-5-5
    extra_allowed_hosts: [api.anthropic.com]
    skills:
      - skills/phoenix-cli
      - skills/phoenix-error-analysis
      - skills/phoenix-evals
      - skills/phoenix-tracing
  - name: codex-sol-no-skills
    import_path: evals.harbor.agents.coding_agents:CodexCliAgent
    model_name: openai/gpt-6.2-sol
    extra_allowed_hosts: [api.openai.com]
    kwargs:
      web_search: disabled
  - name: codex-sol-skills
    import_path: evals.harbor.agents.coding_agents:CodexCliAgent
    model_name: openai/gpt-6.2-sol
    extra_allowed_hosts: [api.openai.com]
    kwargs:
      web_search: disabled
    skills:
      - skills/phoenix-cli
      - skills/phoenix-error-analysis
      - skills/phoenix-evals
      - skills/phoenix-tracing
environment:
  type: daytona
  kwargs:
    auto_stop_interval_mins: 30
    auto_delete_interval_mins: 30
n_attempts: 3
retry:
  max_retries: 1
