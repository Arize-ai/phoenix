# Compare the ways Claude Code can reach Phoenix on the TRAIL tasks: px with the
# phoenix-cli skill, the MCP server in code mode, and the MCP server with one tool per
# /v1 operation.
#   make harbor-run HARBOR_JOB=evals/harbor/jobs/mcp-code-mode.yaml
#
# The agent entries match trail-benchmark-dev.yaml, and the plugin records the results
# in the same trail-benchmark-dev Phoenix dataset.
datasets:
  - path: evals/harbor/tasks/trail-benchmark-dev
agents:
  - name: claude-code-cli
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeCliAgent
    model_name: anthropic/claude-opus-5
    extra_allowed_hosts: [api.anthropic.com]
    kwargs:
      reasoning_effort: high
      disallowed_tools: "WebSearch,WebFetch"
    env:
      NO_COLOR: "1"
    skills:
      - .agents/skills/phoenix-cli
  - name: claude-code-mcp
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeMcpAgent
    model_name: anthropic/claude-opus-5
    extra_allowed_hosts: [api.anthropic.com]
    kwargs:
      reasoning_effort: high
      disallowed_tools: "WebSearch,WebFetch"
  - name: claude-code-mcp-no-code-mode
    import_path: evals.harbor.agents.coding_agents:ClaudeCodeMcpWithoutCodeModeAgent
    model_name: anthropic/claude-opus-5
    extra_allowed_hosts: [api.anthropic.com]
    kwargs:
      reasoning_effort: high
      disallowed_tools: "WebSearch,WebFetch"
environment:
  type: daytona
  extra_allowed_hosts: [arizeai-433a7140.mintlify.app, arize.com]
  # Delete sandboxes left by interrupted runs so they do not consume the organization quota.
  kwargs:
    auto_stop_interval_mins: 30
    auto_delete_interval_mins: 30
# Retry infrastructure errors, but do not retry trials that produce a reward.
retry:
  max_retries: 1
