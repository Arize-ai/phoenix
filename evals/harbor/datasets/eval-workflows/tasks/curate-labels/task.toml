schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/eval-workflows-curate-labels"
description = "Turn human reviews in Phoenix into a labeled dataset for validating a grounding judge"

[metadata]
fixture = "phoenix-seed"

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 1200.0

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 1800.0

[verifier]
# The verifier makes no model calls, so it gets no API key.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 300.0
