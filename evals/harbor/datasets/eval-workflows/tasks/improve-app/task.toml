schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/eval-workflows-improve-app"
description = "Improve a support assistant's Phoenix prompt with experiments, then pass a test on unseen questions"

[metadata]
fixture = "phoenix-seed"

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 1200.0

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 2400.0

[verifier]
# The app and the reply judges call only OpenAI.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 1200.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[solution.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
