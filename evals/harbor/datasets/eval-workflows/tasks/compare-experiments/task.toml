schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/eval-workflows-compare-experiments"
description = "Compare two prompt experiments overall and on the safety slice, and make a ship call"

[metadata]
fixture = "phoenix-seed"

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 1200.0

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 1500.0

[verifier]
# The verifier extracts the reply's claims with an OpenAI model.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 300.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
