schema_version = "1.3"
multi_step_reward_strategy = "mean"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-error-analysis"
description = "PXI open-codes a project's traces into notes, then axial-codes them into per-dimension annotation configs, through the agent session chat route"
keywords = ["pxi", "agent_session_chat", "error_analysis"]

[metadata]
fixture = "error-analysis"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
# The task itself needs nothing from outside: every host is added at a narrower level.
# Each agent entry in the job file (or --allow-agent-host) names its own LLM provider,
# which applies during agent.run() only; the job's environment.extra_allowed_hosts (or
# --allow-environment-host) carries the docs hosts. Keeping hosts out of this file keeps
# the task digest, and so the Phoenix dataset version, stable across providers and
# operators.
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

# Harbor runs this inside the container as root after it starts and before any step, so
# Phoenix serves the fixture the agent user cannot open. Each step's workdir/setup.sh
# calls the same idempotent script and finds it already serving.
[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

# The agent phase runs as an unprivileged user: it can reach the data only through
# Phoenix, never by opening /data/phoenix.db.
[agent]
user = "agent"

# The verifier's LLM judge (error_analysis_checks.judge) calls its provider, and the
# agent-phase hosts do not carry over to verification. Nothing the verifier does needs
# sealing, so it runs with public network access rather than a second allowlist.
[verifier]
network_mode = "public"

[[steps]]
name = "step_01_open_coding"
min_reward = 1.0
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "step_02_axial_coding"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 300.0
