schema_version = "1.3"
multi_step_reward_strategy = "mean"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-error-analysis"
description = "PXI open-codes a project's traces into notes, then axial-codes them into per-dimension annotation configs, through the agent session chat route"
keywords = ["pxi", "agent_session_chat", "error_analysis"]

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
# Trials reach only the LLM provider APIs. Add the results Phoenix host here when
# HARBOR_PHOENIX_COLLECTOR_ENDPOINT is set, or the trace export is silently dropped.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
HARBOR_PHOENIX_COLLECTOR_ENDPOINT = "${HARBOR_PHOENIX_COLLECTOR_ENDPOINT:-}"
HARBOR_PHOENIX_API_KEY = "${HARBOR_PHOENIX_API_KEY:-}"
HARBOR_PHOENIX_PROJECT_NAME = "${HARBOR_PHOENIX_PROJECT_NAME:-}"

[[steps]]
name = "step_01_open_coding"
min_reward = 1.0
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "step_02_axial_coding"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 300.0
