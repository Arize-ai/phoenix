schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "phoenix/dataset-example-external-id"
description = "Example found by its pytest node id and the version that added it"

[metadata]
fixture = "sql-benchmark"
domain = "datasets"

[metadata.arize-phoenix]
reference_output_path = "tests/reference.json"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 600.0

[verifier]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 180.0
