[project]
name = "api-selection-verifiers"
description = "Grading specific to the api-selection task sets: which Phoenix surface the agent should have used"
requires-python = ">=3.11, <3.15"
version = "0.0.0"
dependencies = ["harbor-verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_selection_verifiers"]

[tool.uv.sources]
harbor-verifiers = { workspace = true }
