schema_version = "1.3"

[task]
name = "arize/skill-loading-phoenix-tracing-send-traces-python-openai"
description = "How do I send traces from my Python OpenAI app to Phoenix?"

[metadata]
skill = "phoenix-tracing"
tags = ["explicit"]

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
network_mode = "public"

[agent]
user = "agent"
# Codex has no turn limit, so this timeout ends its trial. Agents load skills in the
# first few seconds, so 30 seconds is enough to see every load.
timeout_sec = 30.0

[verifier]
timeout_sec = 60.0
