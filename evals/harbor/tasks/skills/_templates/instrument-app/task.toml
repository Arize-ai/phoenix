schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log", "/app/support_bot.py"]

[task]
name = "arize/skill-template-instrument-app"
description = "Instrument the support bot so each answer reaches Phoenix as a trace"

[metadata]
fixture = "sample-app"
skill = "phoenix-tracing"
kind = "smoke"
template = "instrument-app"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

# Start Phoenix as root so it can read the fixture before the unprivileged agent runs.
[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

# Prevent the agent from reading /data/phoenix.db directly.
[agent]
user = "agent"
timeout_sec = 600.0

[verifier]
timeout_sec = 300.0
