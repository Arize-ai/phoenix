schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log", "/app/answer.json"]

[task]
name = "arize/skill-template-trace-questions"
description = "Count the support-bot traces that ended in an error and name the error type"

[metadata]
fixture = "sample-app"
skill = "phoenix-cli"
kind = "smoke"
template = "trace-questions"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

# Start Phoenix as root so it can read the fixture before the unprivileged agent runs.
[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

# Prevent the agent from reading /data/phoenix.db directly.
[agent]
user = "agent"
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0
