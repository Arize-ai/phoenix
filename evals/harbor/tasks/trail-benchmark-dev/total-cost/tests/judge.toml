[judge]
judge = "openai/gpt-5-nano"
files = ["/logs/verifier/reply.txt"]
prompt_template = "grading_prompt.md"

[[criterion]]
name = "matches_reference"
description = "The reply's conclusion matches the reference answer: \"$16.00\". Grading notes: The exact value is $16.0022; accept any rounding of it."
type = "binary"

[criterion.annotations]
source = "solution/solve.sh against the seeded fixture, cross-checked against the TRAIL rows; Phoenix project costSummary.total.cost"
