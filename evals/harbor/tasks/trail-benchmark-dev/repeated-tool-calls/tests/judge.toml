[judge]
judge = "openai/gpt-5-nano"
files = ["/logs/verifier/reply.txt"]
prompt_template = "grading_prompt.md"

[[criterion]]
name = "matches_reference"
description = "The reply's conclusion matches the reference answer: \"FinderTool, called 24 times within one trace\". Grading notes: Both the tool and the count must match."
type = "binary"

[criterion.annotations]
source = "solution/solve.sh against the seeded fixture, cross-checked against the TRAIL rows; next is SearchInformationTool at 20 in another trace"
