[judge]
judge = "openai/gpt-5-nano"
files = ["/logs/verifier/reply.txt"]
prompt_template = "grading_prompt.md"

[[criterion]]
name = "matches_reference"
description = "The reply's conclusion matches the reference answer: \"PageDownTool\". Grading notes: page_down and PageDownTool are equivalent answers. Accept either name when identified as the tool with the most failures, whether standalone or embedded in an explanation with counts. Reject a reply that selects another tool or remains undecided between tools."
type = "binary"

[criterion.annotations]
source = "solution/solve.sh against the seeded fixture, cross-checked against the TRAIL rows; 109 ERROR tool spans, next is TextInspectorTool at 29"
