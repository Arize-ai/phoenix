schema_version = "1.3"
multi_step_reward_strategy = "mean"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-prompt-hill-climb"
description = "The agent writes an exact-match evaluator for a text-to-SQL dataset, hill-climbs a prompt from empty until every example passes, then compares the first and last experiments"

[metadata]
fixture = "prompt-hill-climb"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"

[verifier]
network_mode = "public"

[[steps]]
name = "step_01_create_evaluator"
min_reward = 1.0
[steps.agent]
timeout_sec = 1200.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "step_02_hill_climb"
min_reward = 1.0
[steps.agent]
timeout_sec = 3600.0
[steps.verifier]
timeout_sec = 300.0

[[steps]]
name = "step_03_compare"
[steps.agent]
timeout_sec = 1200.0
[steps.verifier]
timeout_sec = 300.0
