schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log", "/app/evals"]

[task]
name = "arize/eval-workflows-improve-judge"
description = "Improve a refund-policy LLM judge so it agrees with human reviews on traces it never saw"

[metadata]
fixture = "phoenix-seed"

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 1200.0

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 2400.0

[verifier]
# The verifier reruns the agent's judge script. A local proxy passes only its
# `gpt-5-nano` calls on to OpenAI.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 1500.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[solution.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
