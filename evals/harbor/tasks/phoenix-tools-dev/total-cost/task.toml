schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-tools-total-cost"
description = "Total cost of the seeded project"
keywords = ["phoenix-tools", "mcp", "cli", "pxi"]

# Everything below [task] is shared by every tool benchmark task; a unit test keeps the
# copies identical. Nothing operator-specific belongs here: Harbor hashes this file into
# the task digest, which the Phoenix plugin uses as the dataset version.
[environment]
os = "linux"
cpus = 2
memory_mb = 4096
# The task allows nothing from outside. The job file grants the docs hosts to the whole
# trial and each agent entry grants its own LLM provider for its run phase.
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

# Harbor runs this inside the container after it starts and before agent setup, on every
# backend. The script is idempotent: it starts Phoenix on the fixture database if it is
# not already serving and waits for it to answer.
[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
timeout_sec = 600.0

# The grader reads the reply from the ATIF trajectory and needs no network of its own.
[verifier]
timeout_sec = 120.0
