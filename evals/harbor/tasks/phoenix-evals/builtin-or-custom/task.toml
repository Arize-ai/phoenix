schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-evals-builtin-or-custom"
description = "Score two dimensions per response, one with a built-in evaluator and one with code"

[metadata]
fixture = "error-analysis"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0
