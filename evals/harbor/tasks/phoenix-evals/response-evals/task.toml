schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log", "/app/evals"]

[task]
name = "arize/phoenix-evals-response-evals"
description = "Build one eval per requirement of a refund-reply spec and run it on production traces"

[metadata]
fixture = "spec"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 2400.0

[verifier]
# The verifier reruns the agent's eval script, which can call either provider.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
timeout_sec = 1500.0
