schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log", "/app/evals"]

[task]
name = "arize/phoenix-evals-improve-judge"
description = "Improve a refund-policy LLM judge so it agrees with human reviews on traces it never saw"

[metadata]
fixture = "spec"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 2400.0

[verifier]
# The verifier reruns the agent's judge script, which can call either provider.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
timeout_sec = 1500.0
