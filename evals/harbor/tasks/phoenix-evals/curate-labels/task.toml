schema_version = "1.3"
artifacts = ["/var/lib/phoenix-eval/server.log"]

[task]
name = "arize/phoenix-evals-curate-labels"
description = "Turn human reviews in Phoenix into a labeled dataset for validating a grounding judge"

[metadata]
fixture = "spec"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
build_timeout_sec = 1200.0

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment.healthcheck]
command = "sh /opt/phoenix-eval/start_phoenix_server.sh"
timeout_sec = 180.0
retries = 2

[agent]
user = "agent"
timeout_sec = 1800.0

[verifier]
# The verifier only reads Phoenix and makes no model calls. The allowlist matches the
# other tasks.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
timeout_sec = 300.0
