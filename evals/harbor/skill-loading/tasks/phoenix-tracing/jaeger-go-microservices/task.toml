schema_version = "1.3"

[task]
name = "arize/skill-loading-phoenix-tracing-jaeger-go-microservices"
description = "Set up distributed tracing with Jaeger for my Go microservices"

[metadata]
skill = "phoenix-tracing"
tags = ["near-miss"]

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
# Agents reach their model provider through hosts in job.yaml. The verifier needs none.
network_mode = "allowlist"

[agent]
user = "agent"
# A fallback. The stop hook and the Codex wrapper end the session before this.
timeout_sec = 30.0

[verifier]
timeout_sec = 60.0
