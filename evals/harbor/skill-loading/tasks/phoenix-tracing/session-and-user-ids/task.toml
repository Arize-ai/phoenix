schema_version = "1.3"

[task]
name = "arize/skill-loading-phoenix-tracing-session-and-user-ids"
description = "Attach a session ID and a user ID to my traces so I can group conversations"

[metadata]
skill = "phoenix-tracing"
tags = ["implicit"]

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
network_mode = "public"

[agent]
user = "agent"
# A fallback. The stop hook and the Codex wrapper end the session before this.
timeout_sec = 30.0

[verifier]
timeout_sec = 60.0
