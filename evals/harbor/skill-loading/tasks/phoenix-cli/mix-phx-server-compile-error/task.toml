schema_version = "1.3"

[task]
name = "arize/skill-loading-phoenix-cli-mix-phx-server-compile-error"
description = "`mix phx.server` fails with \"could not compile dependency :bcrypt_elixir\". How do I fix it?"

[metadata]
skill = "phoenix-cli"
tags = ["near-miss"]

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
# Agents reach their model provider through hosts in job.yaml. The verifier needs none.
network_mode = "allowlist"

[agent]
user = "agent"
# A fallback. The stop hook and the Codex wrapper end the session before this.
timeout_sec = 30.0

[verifier]
timeout_sec = 60.0
