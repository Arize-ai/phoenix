schema_version = "1.3"

[task]
name = "arize/skill-loading-phoenix-cli-instrument-langchain-app"
description = "Add Phoenix tracing to my Python LangChain app so I can see each step of the chain"

[metadata]
skill = "phoenix-cli"
tags = ["sibling"]

[metadata.arize-phoenix]
reference_output_path = "tests/expected.json"

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
# Agents reach their model provider through hosts in job.yaml. The verifier needs none.
network_mode = "allowlist"

[agent]
user = "agent"
# A fallback. The stop hook and the Codex wrapper end the session before this.
timeout_sec = 30.0

[verifier]
timeout_sec = 60.0
