# Python 3.13 environment for Harbor, the Phoenix plugin, and the TRAIL
# downloader. The dependency-free grading library also runs in the
# repository's Python 3.10 tests.
[project]
name = "phoenix-harbor-bench"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "harbor==0.22.0",
  "arize-phoenix-client[harbor]>=3.5.0",
  "datasets>=4.0",
]

[tool.uv]
package = false
