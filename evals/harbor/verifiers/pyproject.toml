[project]
name = "harbor-verifiers"
description = "Shared verifiers and reference-solution helpers for the Phoenix Harbor tasks"
requires-python = ">=3.11, <3.15"
version = "0.0.0"
dependencies = [
  "arize-phoenix",
  "arize-phoenix-client",
  "arize-phoenix-evals",
  "httpx",
  "pydantic",
  "strawberry-graphql",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_verifiers"]

[tool.uv.sources]
arize-phoenix = { workspace = true }
