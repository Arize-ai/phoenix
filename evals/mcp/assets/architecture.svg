<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Phoenix MCP and CLI benchmark architecture</title>
  <desc id="desc">Harbor runs the coding agent and a fresh Phoenix target in separate containers with shared localhost networking and native egress controls. After the agent stops, an offline verifier grades collected artifacts and the host plugin records results in a separate Phoenix service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6544bc"/></marker>
    <marker id="audit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7b9d"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#25222b}
      .title{font-size:35px;font-weight:700;letter-spacing:-1px}
      .subtitle{font-size:18px;fill:#696273}
      .label{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#6544bc}
      .heading{font-size:21px;font-weight:650}
      .body{font-size:17px;fill:#696273}
      .small{font-size:15px;fill:#696273}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px}
      .edge{fill:none;stroke:#6544bc;stroke-width:2;marker-end:url(#arrow)}
      .both{marker-start:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1050" fill="#f8f7fa"/>
  <text x="40" y="42" class="label">PHOENIX · MCP / CLI BENCHMARK</text>
  <text x="40" y="88" class="title">One fresh Phoenix target per attempt.</text>
  <text x="40" y="122" class="subtitle">The same tasks and TRAIL seed. Change the agent, interface, or Phoenix build under test.</text>

  <rect x="40" y="154" width="1320" height="95" rx="14" fill="white" stroke="#ded9e4"/>
  <text x="64" y="186" class="label">1 · PREPARE</text>
  <text x="64" y="219" class="mono">make mcp-prepare</text>
  <text x="306" y="189" class="body">9 static questions + private TRAIL seed</text>
  <text x="306" y="219" class="body">Candidate Phoenix wheel + pinned tool images</text>
  <path d="M 727 201 H 803" class="edge"/>
  <text x="838" y="186" class="label">2 · RUN WITH NATIVE HARBOR</text>
  <text x="838" y="219" class="mono">harbor run --plugin arize-phoenix</text>

  <rect x="40" y="279" width="1010" height="380" rx="16" fill="white" stroke="#ded9e4"/>
  <text x="64" y="311" class="label">FRESH TRIAL · HARBOR MANAGES THE COMPOSE SERVICES</text>
  <text x="64" y="336" class="small">Harbor's native egress sidecar applies the network allowlist.</text>

  <rect x="64" y="369" width="962" height="203" rx="12" fill="#fcfbfe" stroke="#c6bdd4" stroke-dasharray="5 4"/>
  <text x="414" y="397" class="small">Shared localhost network</text>

  <rect x="80" y="385" width="300" height="171" rx="12" fill="white" stroke="#ded9e4"/>
  <text x="98" y="412" class="label">AGENT CONTAINER</text>
  <text x="98" y="446" class="heading">Claude Code or Codex</text>
  <text x="98" y="478" class="body">Harbor's built-in adapter</text>
  <text x="98" y="509" class="body">MCP tools or installed px</text>
  <text x="98" y="538" class="small">Task prompt + local shell</text>

  <path d="M 388 480 H 686" class="edge both"/>
  <text x="450" y="462" class="mono">localhost:6006</text>
  <text x="452" y="507" class="small">Separate filesystems</text>

  <rect x="694" y="385" width="316" height="171" rx="12" fill="#fff1e8" stroke="#efc8b3"/>
  <text x="712" y="412" class="label" style="fill:#ad4e24">PHOENIX CONTAINER</text>
  <text x="712" y="446" class="heading">Fresh Phoenix target</text>
  <text x="712" y="478" class="mono">research-assistant</text>
  <text x="712" y="509" class="body">TRAIL traces + annotations</text>
  <text x="712" y="538" class="body">New writable database</text>

  <path d="M 220 379 V 349 H 1075 V 464 H 1096" class="edge both"/>
  <text x="789" y="338" class="small">Selected provider only</text>
  <rect x="1102" y="399" width="258" height="138" rx="12" fill="white" stroke="#ded9e4"/>
  <text x="1123" y="430" class="label">EXTERNAL SERVICE</text>
  <text x="1123" y="466" class="heading">Model provider</text>
  <text x="1123" y="503" class="body">OpenAI or Anthropic</text>

  <text x="64" y="609" class="small">Only the selected provider host is allowed outside the trial. Agent web tools are disabled.</text>
  <text x="64" y="635" class="small">Seed, database and verifier files stay outside the agent container.</text>

  <path d="M 525 660 V 690 H 300 V 784" fill="none" stroke="#8a7b9d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#audit)"/>
  <text x="554" y="697" class="small">After the agent stops, Harbor collects artifacts.</text>

  <text x="40" y="757" class="label">3 · VERIFY AND RECORD</text>
  <rect x="64" y="788" width="280" height="135" rx="12" fill="white" stroke="#ded9e4"/>
  <text x="82" y="822" class="heading">Collected artifacts</text>
  <text x="82" y="859" class="body">Final answer + ATIF</text>
  <text x="82" y="891" class="body">References + operation logs</text>

  <path d="M 350 851 H 408" class="edge"/>
  <rect x="414" y="788" width="270" height="135" rx="12" fill="#fffbeb" stroke="#e8d69c"/>
  <text x="435" y="822" class="heading">Separate verifier</text>
  <text x="435" y="859" class="body">Reward 0 / 1 + measurements</text>
  <text x="435" y="891" class="small">Offline container · no network</text>

  <path d="M 690 851 H 741" class="edge"/>
  <rect x="747" y="788" width="245" height="135" rx="12" fill="white" stroke="#ded9e4"/>
  <text x="768" y="822" class="heading">Phoenix plugin</text>
  <text x="768" y="859" class="body">Runs on the host</text>
  <text x="768" y="891" class="small">Records scores + linked ATIF</text>

  <path d="M 998 851 H 1049" class="edge"/>
  <rect x="1055" y="788" width="305" height="135" rx="12" fill="#eaf5ef" stroke="#b7d6c8"/>
  <text x="1077" y="822" class="heading">Existing results Phoenix</text>
  <text x="1077" y="859" class="body">Experiments, scores, traces</text>
  <text x="1077" y="891" class="small">Separate from the trial target</text>

  <text x="40" y="970" class="small">Correctness is separate from tool-use and efficiency measurements. CLI use is observed; direct HTTP remains possible.</text>
  <text x="40" y="1002" class="small">Trial databases and artifacts survive teardown. make mcp-check validates source and tests independently.</text>
</svg>
