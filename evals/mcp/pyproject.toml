[project]
name = "phoenix-mcp-benchmark"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "harbor==0.22.0",
  "arize-phoenix-client[harbor]==3.4.0",
  "datasets==4.8.5",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.12.12",
  "mypy==1.15.0",
  "types-toml",
]

[tool.uv]
package = false

# The ATIF plugin is pinned independently of the Phoenix server being evaluated.
[tool.uv.sources]
arize-phoenix-client = { git = "https://github.com/Arize-ai/phoenix", rev = "e2e514329b5b93c912d6d2e8cea478e96211b115", subdirectory = "packages/phoenix-client" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["../.."]
addopts = ["--import-mode=importlib"]
norecursedirs = ["integration"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py313"

[tool.mypy]
python_version = "3.13"
files = ["evals/mcp/scripts", "evals/mcp/scoring", "evals/mcp/environment"]
strict = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["harbor.*", "fastmcp.*", "phoenix.*", "datasets"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evals.mcp.scripts.*", "evals.mcp.environment.*"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "evals.mcp.environment.server"
disallow_subclassing_any = false
