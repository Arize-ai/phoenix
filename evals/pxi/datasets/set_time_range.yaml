dataset_name: set_time_range
description: >-
  PXI eval suite for the timeRange.set UI operation. Covers preset enum
  values, custom bounded and open-ended ranges, ambiguous relative time
  requests, and negative cases where another operation or no operation should
  be used. Positive examples prime the search_browser_actions discovery step
  (a catalog excerpt produced by the real signature renderer) so each example
  scores the operation-selection step; fresh-turn negatives stay unprimed.
evaluators:
  - correct_tools_called
  - tool_call_args_match
  - tool_call_count_within_limit
examples:
  - id: preset-15m
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show me just the last 15 minutes.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: change the time range }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: &catalog |
            // Complete catalog: all 3 UI operations, best query matches first.
            // Further search_browser_actions calls return these same operations re-ranked — reuse
            // this catalog instead of searching again. Only per-operation availability
            // ("available on the current page") changes, after navigation.

            // UIResult<T = unknown> = { ok: true; output: T } | { ok: false; code?: ErrorCode; error: string }
            // ErrorCode = "UNKNOWN_OPERATION" | "NOT_AVAILABLE" | "INVALID_INPUT" | "CAPABILITY_DISABLED"
            //   | "NO_SESSION" | "HANDLER_ERROR" | "NOT_FOUND" | "STALE_REVISION" | "NO_RUN_OUTPUT"
            // Branch on `code` (stable), not on the `error` prose (for humans).

            /**
             * Set the Phoenix app time range selector. Use preset `timeRangeKey` values for standard relative windows (15m, 1h, 12h, 1d, 7d, 30d). Use `custom` with `startTime` and optional `endTime` for specific calendar windows. Call the `get_current_datetime` tool first to read the current date/time in the user's browser timezone; base relative calendar phrases on that value — never on prior knowledge or on the currently selected time range.
             * kind: write; available on the current page.
             */
            ui.timeRange.set(input: { timeRangeKey: "15m" | "1h" | "12h" | "1d" | "7d" | "30d" | "custom"; startTime?: string; endTime?: string }): Promise<UIResult>;

            /**
             * Set the spans table filter. The filter is applied declaratively as a complete state: the freeform `condition` (Phoenix span filter DSL) describes the entire view, and the table is updated to exactly that state. There is no notion of leaving part of the filter unchanged — always send the whole condition. Pass an empty string to clear it.

            ROOT SPANS ARE PART OF THE CONDITION: restrict to root spans -- spans with no parent -- with the predicate `parent_id is None`; omit it to search every span. This is usually the top-level span of each trace, but nothing enforces one root per trace: a fragmented or partially ingested trace can have several, so do not treat the row count as a trace count. Do NOT restrict to root spans when narrowing to a `span_kind` other than CHAIN or AGENT (i.e. LLM, TOOL, RETRIEVER, EMBEDDING, RERANKER, EVALUATOR, GUARDRAIL) — those kinds are almost always nested under a CHAIN/AGENT root, so combining them with a root predicate yields zero results even when matching spans exist. The same applies to anything that targets nested spans (specific tool names, status_code == 'ERROR' on inner calls, annotations attached to leaf spans). Trace annotations apply to every span in the annotated trace: combine a trace-annotation condition with `parent_id is None` to show only root spans from matching traces, or omit the root predicate to inspect every span belonging to those traces. The spans table starts at `parent_id is None`, so dropping that predicate is how you widen the view to every span.

            DSL FIELDS:
              - Root spans: `parent_id is None` matches spans with no parent pointer, and is the table's default. `parent_span is None` is the wider form that also matches orphans -- spans whose parent was never ingested -- and is what to use when the user asks about orphans.
              - String: `span_kind`, `name` (the span name, NOT span_name), `status_code`, `status_message`, `span_id`, `trace_id`, `parent_id`. Compare with `==`, `!=`, or membership via `in`.
              - Numeric: `latency_ms`, `cumulative_token_count.{prompt,completion,total}`, `llm.token_count.{prompt,completion,total}`. Compare with `<`, `<=`, `>`, `>=`.
              - Datetime: `start_time`, `end_time`.
              - Attribute access: `attributes['key.path']`, `input.value`, `output.value`, `metadata['key']`.
              - Annotations: `annotations['Name'].label`, `annotations['Name'].score`.
              - Substring search: `'needle' in input.value` (any string field, ignores case).
              - Combine clauses with `and`, `or`, `not`.

            VALUE CONVENTIONS:
              - `span_kind` values are UPPERCASE string literals: 'LLM', 'TOOL', 'CHAIN', 'AGENT', 'RETRIEVER', 'EMBEDDING', 'RERANKER', 'EVALUATOR', 'GUARDRAIL', 'UNKNOWN'. Lowercase ('llm') will not match.
              - `status_code` values are UPPERCASE: 'OK', 'ERROR', 'UNSET'.
              - Always wrap string literals in single or double quotes.

            EXAMPLES BY INTENT:
              - 'Show me LLM spans' → `span_kind == 'LLM'`
              - 'Tool calls' → `span_kind == 'TOOL'`
              - 'Errored spans' → `status_code == 'ERROR'`
              - 'Slow LLM calls' → `span_kind == 'LLM' and latency_ms >= 5000`
              - 'Top-level traces only' → `parent_id is None`
              - 'Slow traces' → `parent_id is None and latency_ms >= 5000`
              - 'Include orphaned spans as roots' → `parent_span is None`
              - 'Hallucinations' → `annotations['Hallucination'].label == 'hallucinated'`
              - 'Spans mentioning agent in input' → `'agent' in input.value`
              - 'Show everything' → `''`
              - 'Reset to default view' → `parent_id is None`.
             * kind: write; available on the current page.
             */
            ui.spansFilter.set(input: { condition: string }): Promise<UIResult>;

            /**
             * Ask the user to navigate to another Phoenix page. Stages an approval card that names the destination and your reason; on accept the app navigates and the promise resolves after the route change commits, so the destination page's operations can register. `path` must match a route from get_route_info — a path outside the route catalog is rejected. Use this when an operation you need is not available on the current page. This operation is never auto-approved; if the user declines, do not retry — offer a markdown link to the destination instead.
             * kind: approval; available on the current page. Stages a change the user must accept; the returned promise resolves with the decision.
             */
            ui.navigation.goTo(input: { path: string; reason: string }): Promise<UIResult>;
    expected:
      ui_operations:
        required: [timeRange.set]
      ui_operation_args:
        timeRange.set:
          timeRangeKey: "15m"
    metadata: {}
  - id: preset-1h
