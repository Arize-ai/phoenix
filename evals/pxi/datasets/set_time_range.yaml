        required: [timeRange.set]
      ui_operation_args:
        timeRange.set:
          timeRangeKey: "1h"
    metadata: {}
  - id: preset-12h
    splits: [regression]
    input:
      messages:
        - role: user
          content: past 12 hrs only
        - role: assistant
