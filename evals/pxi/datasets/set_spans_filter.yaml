        n_opinions: 3
  - id: input-substring
    # The Phoenix DSL only supports Python's ``in`` operator for substring
    # matching (``'<needle>' in input.value``); the parser maps it to a
    # ``TextContains`` call. There is no ``.contains()`` form. This matcher
    # pins the DSL's ``in input.value`` form while allowing quote/spacing drift.
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show spans where the input mentions refund policy.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition:
            contains_all: ["refund policy", "in input.value"]
            not_contains: [".contains("]
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: annotation-label
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show spans marked hallucinated by the Hallucination annotation.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: annotations['Hallucination'].label == 'hallucinated'
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: reset-filter
    splits: [regression]
    input:
      messages:
        - role: user
          content: Clear the span filter and return to the default root spans view.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: parent_id is None
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: chain-spans
    splits: [regression]
    input:
      messages:
        - role: user
          content: Filter to the chain spans.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: span_kind == 'CHAIN'
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: agent-root-spans
    # Genuinely ambiguous: "top-level agent traces" can resolve to either
    # filtering by AGENT span_kind alongside the root predicate, or just the
    # root predicate on its own. Accept either via variants.
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show me top-level agent traces only.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          - condition:
              contains_all: ["span_kind == 'AGENT'", "parent_id is None"]
          - condition: parent_id is None
    metadata:
      annotation:
        agreement: medium
        n_opinions: 3
  - id: embedding-spans-lowercase
    splits: [regression]
    input:
      messages:
        - role: user
          content: just embeddings pls
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
