          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: status_code == 'ERROR'
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: slow-spans
    # "at least five seconds" pins the 5000ms threshold but the operator
    # form (>=, >) and whitespace are model choices. ``contains_all``
    # checks the substantive content; ``not_contains`` catches a
    # plausible inverted-threshold failure mode (``latency_ms < 5000``).
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show slow spans taking at least five seconds.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition:
            contains_all: ["latency_ms", "5000"]
            not_contains: ["latency_ms < ", "latency_ms <= "]
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: slow-llm-spans
    # Multi-clause AND: ``contains_all`` is order-invariant so the model
    # can emit clauses in either order. Both clauses must appear.
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show slow LLM calls taking at least five seconds.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition:
            contains_all: ["span_kind == 'LLM'", "latency_ms >= 5000"]
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: trace-id
    splits: [regression]
    input:
      messages:
        - role: user
          content: Filter to trace id 8f3c2d1e0a9b4c5d6e7f8091a2b3c4d5.
        - role: assistant
