              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: span_id == '7a3f9c2e1b8d4e5f6a7b8c9d0e1f2a3b'
    metadata:
      annotation:
        agreement: medium
        n_opinions: 3
  - id: children-of-parent
