        agreement: high
        n_opinions: 3
  - id: status-unset-spans
    splits: [regression]
    input:
      messages:
        - role: user
          content: show me spans that have no status set
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: status_code == 'UNSET'
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: high-prompt-tokens
    splits: [regression]
    input:
      messages:
        - role: user
          content: find LLM calls that used more than 10k prompt tokens
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition:
            contains_all: ["span_kind == 'LLM'", "llm.token_count.prompt", "10000"]
            not_contains: ["llm.token_count.prompt < ", "llm.token_count.prompt <= "]
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: cumulative-tokens-roots
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show traces that burned over 50k tokens in total.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition:
            contains_all:
              ["cumulative_token_count.total", "50000", "parent_id is None"]
            not_contains: ["cumulative_token_count.total < ", "cumulative_token_count.total <= "]
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: start-after-timestamp
    # Prompt names a UTC timestamp explicitly, so the model should emit the
    # exact string. Literal expectation pins the canonical form.
    splits: [regression]
    input:
      messages:
        - role: user
          content: Filter to spans that started at or after 2025-01-15T00:00:00Z.
        - role: assistant
          tool_calls:
            - id: search-ops
              name: search_browser_actions
              args: { query: filter the spans table }
        - role: tool
          tool_call_id: search-ops
          name: search_browser_actions
          content: *catalog
    expected:
      ui_operations:
        required: [spansFilter.set]
      ui_operation_args:
        spansFilter.set:
          condition: start_time >= '2025-01-15T00:00:00Z'
    metadata:
      annotation:
        agreement: medium
        n_opinions: 3
  # Original query "Show me span <id>" was unstable: the agent sometimes
  # called bash + phoenix-gql to look up a single span by ID rather than
  # filtering the table. Re-phrased to lock filter intent.
  - id: span-by-id
    splits: [regression]
    input:
      messages:
        - role: user
          content: Filter the spans table to span 7a3f9c2e1b8d4e5f6a7b8c9d0e1f2a3b.
        - role: assistant
