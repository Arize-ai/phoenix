      ui_operation_args:
        spansFilter.set:
          condition: span_kind == 'EMBEDDING'
    metadata:
      annotation:
        agreement: high
        n_opinions: 3
  - id: status-ok-spans
    splits: [regression]
    input:
      messages:
        - role: user
          content: Show only successful spans.
        - role: assistant
          tool_calls:
            - id: search-ops
