dataset_name: evaluator_planning
description: PXI server-side eval suite for the plan-first evaluator workflow. Positive cases check that,
  once the records are read, PXI writes its plan file (/home/user/workspace/evaluator-plans/<name>.md
  with criteria and positive, negative, boundary, and malformed calibration cases) before any draft edit,
  preview, or save, on the code form, the LLM form, the playground, in the background, and on the terminal;
  that manual edit permission waits for plan approval while bypass keeps going; and that the terminal
  previews before saving. Negative cases check that reads write no plan. Report-only (non-gating) until
  baselines exist; see thresholds.yaml.
evaluators:
- correct_tools_called
- tool_call_args_match
- forbidden_tool_call_args_match
