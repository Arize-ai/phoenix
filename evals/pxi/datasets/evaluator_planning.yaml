- id: manual-waits-for-plan-approval
  splits:
  - regression
  input:
    contexts:
    - type: dataset
      datasetNodeId: RGF0YXNldDox
    - type: code_evaluator
    editPermission: manual
    messages:
    - role: user
      content: Write a code evaluator that checks the answer cites at least one of the retrieved document
        ids, like [kb-12].
    - role: assistant
      tool_calls:
      - id: read-draft
        name: execute_browser_action
        args:
          summary: Read the open code evaluator draft.
          script: |
            const result = await ui.evaluators.code.read({});
            return result;
    - role: tool
      tool_call_id: read-draft
      name: execute_browser_action
      content: |
        Script completed after 1 ui call.

        Calls:
        1. evaluators.code.read ok 9ms 660ch

        Return value:
        {
          "ok": true,
          "output": {
            "mode": "create",
            "evaluatorNodeId": null,
            "name": "",
            "description": "",
            "language": "PYTHON",
            "sourceCode": "def evaluate(output):\n    return 1.0\n",
            "sandboxConfigId": "U2FuZGJveENvbmZpZzox",
            "inputMapping": {
              "pathMapping": {},
              "literalMapping": {}
            },
            "testPayload": {
              "input": {},
              "output": {},
              "reference": {},
              "metadata": {}
            },
            "outputConfigs": [],
            "availableSandboxConfigs": [
              {
                "id": "U2FuZGJveENvbmZpZzox",
                "name": "python-wasm",
                "language": "PYTHON",
                "backendType": "WASM"
              }
            ]
          }
        }
    - role: assistant
      tool_calls:
      - id: search-ops
        name: search_browser_actions
        args:
          query: edit and test the code evaluator draft
    - role: tool
      tool_call_id: search-ops
      name: search_browser_actions
      content: |-
        // Complete catalog: all 5 UI operations, best query matches first.
        // Further search_browser_actions calls return these same operations re-ranked — reuse
        // this catalog instead of searching again. Only per-operation availability
        // ("available on the current page") changes, after navigation.

        // UIResult<T = unknown> = { ok: true; output: T } | { ok: false; code?: ErrorCode; error: string }
        // ErrorCode = "UNKNOWN_OPERATION" | "NOT_AVAILABLE" | "INVALID_INPUT" | "CAPABILITY_DISABLED"
        //   | "NO_SESSION" | "HANDLER_ERROR" | "APPROVAL_REQUIRED" | "NOT_FOUND" | "STALE_REVISION"
        //   | "NO_RUN_OUTPUT"
        // Branch on `code` (stable), not on the `error` prose (for humans).

        /**
         * Open the dataset-backed code-evaluator form from the current playground without navigating away. Use this when a dataset is mounted in the playground and the user wants to author a code evaluator. This opens the existing create-code-evaluator form; it does not persist or create an evaluator.
         * kind: write; not on this page — requires the Prompt Playground page with a dataset loaded (load one with playground.dataset.load). Changes state: a script calling it must carry write_description.
         */
        ui.evaluators.code.openForm(input: {}): Promise<UIResult>;

        /**
         * Read the open code-evaluator draft. Returns the draft's name, description, language, sourceCode, sandboxConfigId, inputMapping, outputConfigs, testPayload, form mode (`create` or `edit`), and `availableSandboxConfigs` (id, name, language, backendType) — pick the `sandboxConfigId` for `set_sandbox_config` from that list instead of querying the API. Call this before `evaluators.code.edit` or `evaluators.code.test` to see the current draft.
         * kind: read; available on the current page.
         */
        ui.evaluators.code.read(input: {}): Promise<UIResult>;

        /**
         * Edit the open code-evaluator draft. The edit is a state change covered by the script-level approval (write_description). Call `evaluators.code.read` first to see the current draft before proposing edits. Use camelCase field names exactly as shown. Common valid examples: {"type":"set_source_code","sourceCode":"def evaluate(output):\n    return 1.0"}; {"type":"set_language","language":"PYTHON"}; {"type":"set_sandbox_config","sandboxConfigId":"U2FuZGJveENvbmZpZzox"}; {"type":"set_input_mapping","inputMapping":{"pathMapping":{},"literalMapping":{}}}; {"type":"set_test_payload","testPayload":{"input":{},"output":{"messages":[{"role":"assistant","content":"ok"}]},"reference":{},"metadata":{}}}. Do not emit `set_sandbox_config` when the read draft already has a compatible sandbox and the user did not ask to change it.
         * kind: write; available on the current page. Changes state: a script calling it must carry write_description.
         */
        ui.evaluators.code.edit(input: { operations: { type: "set_source_code"; sourceCode: string } | { type: "set_language"; language: "PYTHON" | "TYPESCRIPT" } | { type: "set_sandbox_config"; sandboxConfigId: unknown } | { type: "set_input_mapping"; inputMapping?: { pathMapping?: unknown; literalMapping?: unknown } } | { type: "set_test_payload"; testPayload?: { input?: unknown; output?: unknown; reference?: unknown; metadata?: unknown } } | { type: "set_description"; description: string } | { type: "set_name"; name: string } | { type: "set_output_configs"; outputConfigs: { kind: "classification"; name: string; optimizationDirection: "MAXIMIZE" | "MINIMIZE" | "NONE"; values: { label: string; score?: unknown }[] } | { kind: "continuous"; name: string; optimizationDirection: "MAXIMIZE" | "MINIMIZE" | "NONE"; lowerBound?: unknown; upperBound?: unknown } | { kind: "freeform"; name: string; optimizationDirection: "MAXIMIZE" | "MINIMIZE" | "NONE"; threshold?: unknown; lowerBound?: unknown; upperBound?: unknown }[] }[] }): Promise<UIResult>;

        /**
         * Run the open code-evaluator draft against its current test payload through the form preview path. This previews the draft only and does not persist, create, or update an evaluator.
         * kind: write; available on the current page. Changes state: a script calling it must carry write_description.
         */
        ui.evaluators.code.test(input: {}): Promise<UIResult>;

        /**
         * Persist the open code-evaluator draft through the form's validated save path — the same create/patch the Create/Update button runs. Terminal save only; it does not modify the draft.
         * kind: write; available on the current page. Changes state: a script calling it must carry write_description.
         */
        ui.evaluators.code.submit(input: {}): Promise<UIResult>;
    - role: assistant
      tool_calls:
      - id: write-plan
        name: bash
        args:
          summary: Write the evaluator plan.
          command: |-
            mkdir -p /home/user/workspace/evaluator-plans && cat > /home/user/workspace/evaluator-plans/cites_document.md <<'EOF'
            # Evaluator plan: cites_document

            ## Construct
            - [x] Measures: the answer cites at least one retrieved document id
            - [x] Runs: offline (experiment runs)

            ## Criteria
            - [x] Success: a [kb-N] citation naming a document in input.documents
            - [x] Failure: no citation, or a citation to a document that was not retrieved
            - [x] Partial credit: none, binary
            - [x] Abstention: an empty or refusing answer fails
            - [x] Edge cases: several citations; citation inside code; no documents retrieved

            ## Evaluator
            - [x] Type: code (a regex over output.answer against input.documents ids)
            - [x] Output: cited=1 / not_cited=0, maximize, explanation names the ids

            ## Calibration cases
            | Case | Kind | Expected | Observed |
            | ---- | ---- | -------- | -------- |
            | cites kb-12 | positive | cited | |
            | no citation | negative | not_cited | |
            | cites kb-99 (not retrieved) | boundary | not_cited | |
            | empty answer | malformed | not_cited | |

            ## Results
            - [ ] Round 1
            - [ ] Decision
            EOF
    - role: tool
      tool_call_id: write-plan
      name: bash
      content:
        command: |-
          mkdir -p /home/user/workspace/evaluator-plans && cat > /home/user/workspace/evaluator-plans/cites_document.md <<'EOF'
