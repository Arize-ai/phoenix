          - [x] Abstention: an empty or refusing answer fails
          - [x] Edge cases: several citations; citation inside code; no documents retrieved

          ## Evaluator
          - [x] Type: code (a regex over output.answer against input.documents ids)
          - [x] Output: cited=1 / not_cited=0, maximize, explanation names the ids

          ## Calibration cases
          | Case | Kind | Expected | Observed |
          | ---- | ---- | -------- | -------- |
          | cites kb-12 | positive | cited | |
          | no citation | negative | not_cited | |
          | cites kb-99 (not retrieved) | boundary | not_cited | |
          | empty answer | malformed | not_cited | |

          ## Results
          - [ ] Round 1
          - [ ] Decision
          EOF
        stdout: ''
        stderr: ''
        exitCode: 0
        durationMs: 1
        startedAt: '2026-10-07T17:00:00Z'
        completedAt: '2026-10-07T17:00:00.001Z'
        stdoutBytes: 0
        stderrBytes: 0
        stdoutTruncated: false
        stderrTruncated: false
  expected:
    ui_operations:
      forbidden: *id002
  metadata:
    category: approval
    difficulty: moderate
    polarity: negative
    annotation:
      agreement: high
      n_opinions: 1
      notes: Under manual edit permission the plan is presented for approval; nothing in the draft changes
        until the user approves it.
