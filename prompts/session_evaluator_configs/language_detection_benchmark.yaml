# Benchmark dataset for the `language_detection` session-level evaluator.
#
# Each example is a full, multi-turn session (the `{{session}}` template var)
# plus the gold answer the evaluator should produce:
#   - languages:        the set of natural languages present (full English names,
#                        order-insensitive; the runner compares as a set).
#   - primary_language: the majority-substance language, or null.
# `case` tags which rubric behavior the example exercises; `notes` explains the
# gold label. Language names use the full English name convention from the
# template. The runner normalizes a few synonyms (Mandarin->Chinese,
# Farsi->Persian, Castilian->Spanish) before scoring.
#
# Coverage: monolingual baselines across many scripts; code-switching;
# translation requests; primary-by-substance-not-turn-count; brief-but-deliberate
# second language; loanword/acronym exclusion; proper-noun/code-identifier
# exclusion; code/JSON ignored while comment-prose counts; no-natural-language
# (empty + null); non-linguistic/uninformative turns; borderline default-exclude;
# language inside tool calls / tool results / retrieved content; and confusable
# language pairs (Spanish/Portuguese, Russian/Ukrainian, Chinese/Japanese).

examples:
  # ---------------------------------------------------------------------------
  # Monolingual baselines — one per script family. primary == the only language.
  # ---------------------------------------------------------------------------
  - id: mono_english_support
    case: monolingual
    session: |-
      User: My deployment keeps failing with an "out of memory" error during the build step. I've tried increasing the timeout but that didn't help. Any idea what's going on?
      Assistant: The build step running out of memory usually means the bundler is trying to hold too much in memory at once. Increasing the timeout won't help because the process is being killed, not timing out. Try lowering the parallelism of the build, or bump the container's memory limit. Which build tool are you using?
      User: We're on webpack, and the container has 2 GB allocated.
      Assistant: 2 GB is on the low side for a large webpack build. Set the Node heap explicitly and give the container more headroom — 4 GB is a safer baseline for production bundles. If that clears it, the leak was just source maps and vendor chunks piling up.
    languages: [English]
    primary_language: English
    notes: Single language throughout, both parties.

  - id: mono_spanish_billing
    case: monolingual
    session: |-
      User: Hola, tengo una duda con mi factura de este mes. Me cobraron dos veces el mismo servicio y no entiendo por qué.
      Assistant: Buenos días. Lamento el inconveniente. Los cobros duplicados suelen deberse a un reintento automático cuando el primer pago queda pendiente. ¿Podría indicarme la fecha exacta de los dos cargos?
      User: Sí, ambos aparecen el día 3 de este mes, con el mismo importe de 49,90 euros.
      Assistant: Gracias. Confirmo que se trata de un cargo repetido por un reintento fallido. Voy a tramitar la devolución del segundo importe; tardará entre tres y cinco días hábiles en reflejarse en su cuenta.
    languages: [Spanish]
    primary_language: Spanish
    notes: Monolingual Spanish. "euros" is not a foreign-language marker.

  - id: mono_japanese_recipe
    case: monolingual
    session: |-
      User: だしの取り方を教えてください。昆布とかつお節を使う基本的な方法が知りたいです。
      Assistant: 基本の一番だしの作り方をご説明します。まず水に昆布を入れて三十分ほど浸してから、弱火にかけます。沸騰する直前に昆布を取り出し、かつお節を加えてひと煮立ちさせてから火を止めます。数分置いてこすと、澄んだだしができます。
      User: ありがとうございます。昆布は取り出したあと、もう一度使えますか。
      Assistant: はい、二番だしに使えます。取り出した昆布とかつお節をもう一度水から煮出すと、煮物などにちょうど良い、やや薄めのだしが取れます。
    languages: [Japanese]
    primary_language: Japanese
    notes: Kana + kanji, monolingual Japanese.

  - id: mono_arabic_travel
    case: monolingual
    session: |-
      User: مرحبًا، أخطط لرحلة إلى المغرب في شهر مايو. هل الطقس يكون مناسبًا للسفر في تلك الفترة؟
      Assistant: أهلًا بك. شهر مايو من أفضل الأوقات لزيارة المغرب؛ الطقس معتدل في المدن الساحلية مثل الرباط والدار البيضاء، ودافئ نسبيًا في مراكش. أنصحك بحمل ملابس خفيفة مع سترة للمساء.
      User: وهل تنصحني بزيارة الصحراء في هذا الوقت؟
      Assistant: نعم، أواخر مايو مناسب لزيارة الصحراء قبل اشتداد حرارة الصيف، لكن يُفضّل تنظيم الرحلة في الصباح الباكر أو قرب الغروب لتجنّب حرارة منتصف النهار.
    languages: [Arabic]
    primary_language: Arabic
    notes: Right-to-left script, monolingual Arabic.

  - id: mono_russian_coding
    case: monolingual
    session: |-
      User: Подскажите, пожалуйста, почему мой запрос к базе данных работает так медленно. Таблица большая, около десяти миллионов строк, и выборка по дате занимает несколько секунд.
      Assistant: Скорее всего, дело в отсутствии индекса по столбцу с датой. Без индекса база вынуждена просматривать все строки целиком. Создайте индекс по этому столбцу, и выборка по диапазону дат станет заметно быстрее.
      User: А если я часто фильтрую сразу по дате и по идентификатору пользователя?
      Assistant: Тогда имеет смысл составной индекс по обоим столбцам, причём сначала тот, по которому вы фильтруете точным значением, а затем столбец с диапазоном дат. Так база сможет использовать индекс целиком.
    languages: [Russian]
    primary_language: Russian
    notes: Cyrillic, monolingual Russian.

  - id: mono_hindi_health
    case: monolingual
    session: |-
      User: मुझे पिछले कुछ दिनों से सिरदर्द हो रहा है और शाम को थकान महसूस होती है। क्या यह पानी की कमी से हो सकता है?
      Assistant: जी हाँ, पर्याप्त पानी न पीने से सिरदर्द और थकान दोनों हो सकते हैं। दिन भर में थोड़ा-थोड़ा करके पानी पीते रहें और स्क्रीन के सामने लंबे समय तक बैठने से बचें। अगर तीन-चार दिन में आराम न मिले तो डॉक्टर से मिलना बेहतर होगा।
      User: ठीक है, धन्यवाद। मैं पानी की मात्रा बढ़ाकर देखता हूँ।
      Assistant: बहुत अच्छा। साथ में नींद पूरी लें, इससे भी काफ़ी फ़र्क पड़ेगा।
    languages: [Hindi]
    primary_language: Hindi
    notes: Devanagari, monolingual Hindi.

  - id: mono_german_contract
    case: monolingual
    session: |-
      User: Ich habe eine Frage zu meinem Arbeitsvertrag. Dort steht eine Probezeit von sechs Monaten. Kann mein Arbeitgeber mich in dieser Zeit ohne Angabe von Gründen kündigen?
      Assistant: Während der Probezeit gelten verkürzte Kündigungsfristen, in der Regel zwei Wochen. Der Arbeitgeber muss grundsätzlich keinen Kündigungsgrund nennen, solange die Kündigung nicht sittenwidrig oder diskriminierend ist.
      User: Und gilt das auch, wenn ich selbst kündigen möchte?
      Assistant: Ja, die verkürzte Frist gilt in der Probezeit für beide Seiten. Sie können also ebenfalls mit der kürzeren Frist kündigen, sofern im Vertrag nichts anderes vereinbart ist.
    languages: [German]
    primary_language: German
    notes: Monolingual German.

  # ---------------------------------------------------------------------------
  # Code-switching within/across turns — multiple genuine languages.
  # ---------------------------------------------------------------------------
  - id: codeswitch_spanglish
    case: code_switching
    session: |-
      User: Oye, necesito ayuda con un problema. I've been trying to set up the project pero me sale un error cuando corro los tests. It says "module not found".
      Assistant: Vale, ese error casi siempre significa que falta instalar las dependencias. Did you run the install step after cloning? Prueba borrar la carpeta de módulos y volver a instalar desde cero.
      User: Ah, tienes razón, se me olvidó. Now it works, muchas gracias!
      Assistant: ¡Perfecto! Me alegro. If it breaks again, revisa que estés usando la versión correcta del runtime.
    languages: [English, Spanish]
    primary_language: Spanish
    notes: Deliberate Spanglish, both languages carry real content; Spanish slightly dominant.

  - id: codeswitch_hinglish
    case: code_switching
    session: |-
      User: Yaar, mujhe ek doubt hai. Main apni website pe dark mode add karna chahta hoon but I'm not sure how to persist the user's choice. Har baar reload karne pe wapas light mode ho jaata hai.
      Assistant: Simple fix hai. User ki choice ko localStorage mein save karo, and read it back on page load. Jab bhi user toggle kare, localStorage update karo, aur load hote waqt wahi value apply kar do. Isse reload ke baad bhi setting bani rahegi.
      User: Perfect, samajh gaya. Thanks bhai, main abhi try karta hoon.
    languages: [English, Hindi]
    primary_language: Hindi
    notes: Hinglish code-switching (Hindi in Latin script). Hindi is the matrix language.

  - id: codeswitch_french_english_error
    case: code_switching
    session: |-
      User: Bonjour, j'ai un souci avec mon script. Quand je le lance, il s'arrête tout de suite et affiche un message que je ne comprends pas.
      Assistant: Bonjour ! Pouvez-vous copier le message d'erreur exact ? Cela m'aiderait à identifier la cause du problème.
      User: Oui, le voici : "The connection was refused because the server is not accepting requests on the specified port. Please verify that the service is running and reachable."
      Assistant: D'accord. Ce message indique que le service auquel votre script essaie de se connecter n'est pas démarré, ou qu'il écoute sur un autre port. Vérifiez que le serveur tourne bien et que le numéro de port correspond à votre configuration.
    languages: [English, French]
    primary_language: French
    notes: Conversation in French; the quoted error is a full English prose sentence (deliberate English), so English counts. French dominant.

  - id: codeswitch_chinese_english_tech
    case: code_switching
    session: |-
      User: 我在部署一个机器学习模型，但是推理速度太慢了。请问有什么办法可以加速吗？The model is a transformer with about 300 million parameters.
      Assistant: 有几个常见的加速方法。首先可以尝试量化，把权重从 32 位浮点数转换成 8 位整数，这样能显著减少计算量。You can also enable batching so multiple requests are processed together, which improves throughput on the GPU. 另外，如果延迟要求很高，可以考虑模型蒸馏，用一个更小的模型来近似原模型。
      User: 明白了，谢谢。量化会不会影响准确率？
      Assistant: 会有一点影响，但通常很小。对大多数应用来说，8 位量化带来的准确率下降可以忽略不计，而速度提升非常明显。
    languages: [Chinese, English]
    primary_language: Chinese
    notes: Chinese matrix with deliberate English sentences. Chinese dominant.

  # ---------------------------------------------------------------------------
  # Translation requests — both source and target language are present.
  # ---------------------------------------------------------------------------
  - id: translate_en_to_french
    case: translation_request
    session: |-
      User: I'm writing to a hotel in Paris and my French is rusty. Could you translate this for me? "Hello, I would like to confirm my reservation for two nights starting the 14th of June. Could you please let me know if early check-in is possible? Thank you very much for your help."
      Assistant: Of course. Here is a polite version you can send: "Bonjour, je souhaiterais confirmer ma réservation pour deux nuits à partir du 14 juin. Pourriez-vous m'indiquer si une arrivée anticipée est possible ? Je vous remercie beaucoup pour votre aide."
      User: That's great, thanks. Is "Bonjour" fine for an email, or should it be more formal?
      Assistant: "Bonjour" is perfectly appropriate for a hotel email — polite and standard. If you wanted to be extra formal you could write "Madame, Monsieur," but that's not necessary here.
    languages: [English, French]
    primary_language: English
    notes: Framing + discussion in English carries most substance; the translated target is French. English primary.

  - id: translate_german_to_italian
    case: translation_request
    session: |-
      User: Kannst du mir bitte den folgenden Absatz ins Italienische übersetzen? Ich brauche ihn für eine Produktbeschreibung. "Unsere Kaffeemaschine vereint modernes Design mit einfacher Bedienung. Dank des integrierten Mahlwerks genießen Sie jederzeit frisch gemahlenen Kaffee, und die automatische Reinigungsfunktion spart Ihnen Zeit im Alltag."
      Assistant: Gern. Hier ist die italienische Übersetzung: "La nostra macchina da caffè unisce un design moderno a una grande facilità d'uso. Grazie al macinacaffè integrato potrete gustare in qualsiasi momento un caffè macinato fresco, e la funzione di pulizia automatica vi farà risparmiare tempo ogni giorno."
      User: Danke! Klingt der letzte Satz natürlich auf Italienisch?
      Assistant: Ja, der Satz klingt natürlich. "Vi farà risparmiare tempo ogni giorno" ist eine gebräuchliche und flüssige Formulierung im Italienischen.
    languages: [German, Italian]
    primary_language: German
    notes: Request + meta-discussion in German; Italian is the translated target. German primary.

  # ---------------------------------------------------------------------------
  # Primary language by SUBSTANCE, not by turn count (rubric rule 3).
  # ---------------------------------------------------------------------------
  - id: substance_over_turncount_portuguese
    case: primary_by_substance
    session: |-
      User: hey
      Assistant: Hi! How can I help you today?
      User: one sec
      Assistant: No problem, take your time.
      User: ok thanks
      Assistant: Sure.
      User: Pronto. Então, deixa eu te explicar a situação com calma. Eu montei uma pequena loja online para vender produtos artesanais, e desde a semana passada os clientes estão reclamando que, na hora de finalizar a compra, o site trava exatamente quando eles clicam no botão de pagamento. Já testei em três navegadores diferentes, limpei o cache, e mesmo assim o problema continua. O mais estranho é que, no meu computador de desenvolvimento, tudo funciona perfeitamente. Desconfio que seja alguma coisa relacionada ao ambiente de produção, talvez uma variável de configuração do gateway de pagamento que não foi definida corretamente no servidor. Você consegue me ajudar a descobrir por onde começar a investigar?
      Assistant: Claro. Pelo que você descreve, o fato de funcionar em desenvolvimento e falhar em produção realmente aponta para uma diferença de configuração. Comece verificando as variáveis de ambiente do gateway no servidor de produção e os registros de erro no momento exato do clique.
    languages: [English, Portuguese]
    primary_language: Portuguese
    notes: Many short English turns, but one long substantive Portuguese turn carries most content. Portuguese primary despite fewer turns.

  - id: substance_over_turncount_english
    case: primary_by_substance
    session: |-
      User: Salut
      Assistant: Salut ! Comment puis-je vous aider ?
      User: merci
      Assistant: Je vous en prie.
      User: d'accord
      Assistant: Very well. Since you asked me earlier to write the full incident summary in English for your international team, here it is. On Tuesday at approximately 14:00 UTC our primary database cluster experienced a cascading failure that began when a routine schema migration acquired a long-running lock on the orders table. Because the migration was executed during peak traffic, incoming write requests queued behind the lock and rapidly exhausted the connection pool. Downstream services interpreted the resulting timeouts as the database being unavailable and began aggressively retrying, which amplified the load and delayed recovery. The immediate fix was to abort the migration and drain the retry backlog; the longer-term remediation is to run migrations only during low-traffic windows and to add a statement timeout so no single migration can hold a lock indefinitely.
      Assistant: That's a clear summary. I'd add one recommendation: gate schema migrations behind a maintenance flag so they can never run automatically during peak hours.
    languages: [English, French]
    primary_language: English
    notes: Short French pleasantries, but the substantive incident write-up is English. English primary.

  # ---------------------------------------------------------------------------
  # Brief but DELIBERATE second language counts (even a single sentence).
  # ---------------------------------------------------------------------------
  - id: brief_italian_signoff
    case: brief_deliberate
    session: |-
      User: I need to prepare a short toast for my colleague's retirement dinner. Can you help me draft something warm but not too long?
      Assistant: Absolutely. Here's a draft: "To Maria — thirty years of steady hands, good judgment, and even better coffee runs. You made the hard days lighter and the good days better. We'll miss you more than these few words can say. Congratulations, and enjoy every well-earned moment."
      User: That's lovely, thank you. I'll add a personal touch at the end.
      Assistant: Perfect — a personal line at the close always lands best. Good luck with the toast!
      User: Grazie mille, sei stato davvero gentile e molto paziente con me. Buona serata!
    languages: [English, Italian]
    primary_language: English
    notes: The final turn is a full, deliberate Italian sentence — counts. English is primary.

  - id: brief_spanish_proverb_in_korean
    case: brief_deliberate
    session: |-
      User: 발표 마무리에 인용할 만한 좋은 문구를 찾고 있어요. 인내와 꾸준함에 관한 것이면 좋겠어요.
      Assistant: 스페인어 속담 중에 이런 말이 있습니다: "Poco a poco se anda lejos." 직역하면 "조금씩 가다 보면 멀리 간다"는 뜻으로, 꾸준함의 힘을 잘 담고 있습니다. 발표 마무리에 잘 어울릴 것 같습니다.
      User: 좋네요. 그 문구를 슬라이드에 넣고 아래에 한국어 해석을 같이 적어야겠어요.
      Assistant: 좋은 생각입니다. 원문과 해석을 함께 보여주면 청중에게 더 인상 깊게 전달될 것입니다.
    languages: [Korean, Spanish]
    primary_language: Korean
    notes: Korean session; a genuine Spanish proverb is quoted and discussed — Spanish counts. Korean primary.

  # ---------------------------------------------------------------------------
  # Loanwords / acronyms do NOT count as a separate language (rubric exclusion).
  # ---------------------------------------------------------------------------
  - id: loanwords_spanish_tech
    case: loanword_exclusion
    session: |-
      User: Buenas, no consigo hacer login en la aplicación. Cada vez que meto mi email y mi password, me da un error y no me deja entrar. ¿Puedes ayudarme?
      Assistant: Claro. Ese error al hacer login suele deberse a que la sesión anterior no se cerró bien. Prueba a borrar la caché del navegador y a reiniciar la app. Si sigue fallando, puede ser un problema del servidor.
      User: Vale, borré la caché y reinicié, pero nada. El software sigue dando el mismo error. La CPU del móvil se pone al cien por cien y luego se cierra.
      Assistant: Entendido. Si la CPU se dispara y la app se cierra, parece un bloqueo interno. Vamos a reinstalar la aplicación desde cero para descartar archivos corruptos. Ok, dime cuando lo tengas hecho.
    languages: [Spanish]
    primary_language: Spanish
    notes: The terms login, email, password, software, CPU, app, Ok are English-origin loanwords/acronyms embedded in Spanish. NOT a second language — Spanish only.

  - id: loanwords_japanese_katakana
    case: loanword_exclusion
    session: |-
      User: 新しいノートパソコンを買ったのですが、インターネットにうまく接続できません。Wi-Fiのアイコンは出ているのに、ブラウザでページが開かないんです。
      Assistant: なるほど。Wi-Fi には接続できていてもページが開かない場合は、ルーターかDNSの設定が原因のことが多いです。まずはルーターを再起動してみてください。それでも直らなければ、DNSサーバーの設定を確認しましょう。OK ですか？
      User: はい、ルーターを再起動したら直りました。ありがとうございます。Google も普通に開けます。
      Assistant: よかったです。今後また同じ症状が出たら、まずルーターの再起動を試すと早く解決できますよ。
    languages: [Japanese]
    primary_language: Japanese
    notes: Katakana loanwords (ノートパソコン, インターネット, ブラウザ, ルーター), acronyms (Wi-Fi, DNS, OK), brand (Google). All embedded in Japanese — Japanese only.

  # ---------------------------------------------------------------------------
  # Proper nouns / brand names / code identifiers excluded; prose is the signal.
  # ---------------------------------------------------------------------------
  - id: identifiers_german_react
    case: identifier_exclusion
    session: |-
      User: Ich baue gerade eine Weboberfläche mit React und komme bei der Zustandsverwaltung nicht weiter. Ich nutze useState für ein Formular, aber bei jedem Tastendruck wird die ganze Komponente neu gerendert und die Eingabe fühlt sich träge an.
      Assistant: Das ist ein bekanntes Muster. Wenn die ganze Komponente bei jeder Eingabe neu rendert, lohnt es sich, das Formular in kleinere Komponenten aufzuteilen oder die Eingabefelder mit useRef unkontrolliert zu lassen. Mit welchem Framework deployst du — Docker, oder direkt über GitHub Actions?
      User: Über GitHub Actions. Aber das Rendern ist das eigentliche Problem, nicht das Deployment.
      Assistant: Verstanden. Dann konzentrieren wir uns auf das Rendern: Lagere die teure Berechnung mit useMemo aus und stelle sicher, dass du nicht bei jedem Tastendruck neue Objekt-Props an Kindkomponenten übergibst.
    languages: [German]
    primary_language: German
    notes: The tokens React, useState, useRef, useMemo, Docker, GitHub Actions are library/tool/API identifiers and brand names, not English prose. German only.

  # ---------------------------------------------------------------------------
  # Code / JSON / markup ignored; natural-language prose in comments counts.
  # ---------------------------------------------------------------------------
  - id: code_with_english_prose
    case: code_and_structured_ignored
    session: |-
      User: Can you review this function? I think it has an off-by-one bug somewhere.
      Assistant: |
        You're right — the loop condition should be `<`, not `<=`, otherwise it reads one element past the end of the array. Here's the corrected version:

        ```python
        def sum_first_n(values, n):
            # Guard against n larger than the list length
            total = 0
            for i in range(n):  # was range(n + 1), which overran the list
                total += values[i]
            return total
        ```

        Config used for the failing run:

        ```json
        {"n": 5, "values": [3, 1, 4, 1, 5], "strict": true}
        ```
      User: Ah, that makes sense. Thanks!
    languages: [English]
    primary_language: English
    notes: Python and JSON blocks are ignored; the English prose (and the English comment) is the only natural language. English only.

  - id: comment_only_french
    case: comment_prose_counts
    session: |-
      Tool call: format_code(language="python")
      Tool result: |
        ```python
        def calculer_moyenne(notes):
            # Retourne la moyenne des notes ; renvoie zéro si la liste est vide
            # afin d'éviter une division par zéro lorsqu'aucune note n'est fournie
            if not notes:
                return 0
            return sum(notes) / len(notes)
        ```
      Assistant: |
        ```python
        def calculer_moyenne(notes):
            # La liste vide est gérée avant la division pour rester robuste
            return sum(notes) / len(notes) if notes else 0
        ```
    languages: [French]
    primary_language: French
    notes: Only natural-language content is the French prose inside the code comments — that counts. French only. (Identifiers like calculer_moyenne are code, not prose.)

  # ---------------------------------------------------------------------------
  # No natural language at all -> empty list + null primary (rubric rule 5).
  # ---------------------------------------------------------------------------
  - id: no_natural_language_code_json
    case: no_natural_language
    session: |-
      User: |
        ```
        GET /api/v2/orders?status=open&limit=50 HTTP/1.1
        Host: api.example.com
        Authorization: Bearer eyJhbGciOiJIUzI1NiJ9
        ```
      Tool result: |
        ```json
        {"orders": [{"id": 1001, "total": 49.9}, {"id": 1002, "total": 12.0}], "count": 2}
        ```
      Assistant: |
        ```
        status=200 duration_ms=37 cache=HIT
        ```
    languages: []
    primary_language: null
    notes: Only an HTTP request, JSON, and a status line — no natural-language prose. Empty list, null primary.

  - id: no_natural_language_symbols
    case: uninformative_only
    session: |-
      User: 👍
      Assistant: 🙂
      User: 42
      Assistant: https://example.com/status/12345
      User: ✅✅✅
    languages: []
    primary_language: null
    notes: Emoji, a bare number, a URL — all non-linguistic/uninformative. Nothing should drive a language. Empty + null.

  # ---------------------------------------------------------------------------
  # Borderline -> default to EXCLUDE (rubric rule 4, confident-only).
  # ---------------------------------------------------------------------------
  - id: borderline_english_only
    case: borderline_default_exclude
    session: |-
      User: I'm putting together the agenda for tomorrow's standup. Can you help me tighten the wording so it fits on one slide?
      Assistant: Sure. Here's a tighter version: "Standup 9:00 — blockers first, then demos, then planning. Two minutes per person, hard stop at 9:20." Short, scannable, and it sets expectations up front.
      User: Great. Add a line that we'll cover the roadmap etc. at the end, and note the venue is the usual room.
      Assistant: Done: "Wrap-up (9:15): roadmap and open items. Same room as always." That keeps it on one slide.
    languages: [English]
    primary_language: English
    notes: The abbreviation etc. (Latin) and the word venue are naturalized English usage, not a deliberate second language. Borderline -> exclude. English only.

  - id: borderline_ambiguous_short_in_german
    case: borderline_default_exclude
    session: |-
      User: Ich möchte mein Fahrrad verkaufen und weiß nicht, welchen Preis ich verlangen soll. Es ist drei Jahre alt und gut gepflegt.
      Assistant: Bei einem drei Jahre alten, gut gepflegten Fahrrad kannst du in der Regel etwa die Hälfte des Neupreises verlangen. Kennst du noch den ursprünglichen Kaufpreis?
      User: No.
      Assistant: Kein Problem. Dann orientiere dich an vergleichbaren Angeboten für dasselbe Modell und denselben Zustand; so bekommst du schnell ein realistisches Gefühl für den Marktpreis.
    languages: [German]
    primary_language: German
    notes: The one-word "No." is ambiguous (English/interjection) and too short to establish a language. Default exclude. German only.

  # ---------------------------------------------------------------------------
  # Language carried inside tool calls / tool results / retrieved content.
  # ---------------------------------------------------------------------------
  - id: tool_result_french_document
    case: language_in_tool_result
    session: |-
      User: Search our knowledge base for the refund policy and tell me how many days customers have to request a refund.
      Assistant: Let me look that up.
      Tool call: search_kb(query="refund policy window")
      Tool result: |
        Document: "Politique de remboursement" — "Le client dispose d'un délai de quatorze jours calendaires à compter de la date de livraison pour demander le remboursement d'un article. Passé ce délai, aucune demande de remboursement ne pourra être acceptée, sauf en cas de produit défectueux."
      Assistant: According to the retrieved policy document, customers have fourteen calendar days from the delivery date to request a refund. After that window, refunds are only granted for defective products.
    languages: [English, French]
    primary_language: English
    notes: Retrieved document shown in the exchange is substantive French prose — counts. Conversation is English; English primary.

  - id: tool_result_spanish_summary_field
    case: language_in_tool_result
    session: |-
      User: Can you pull the latest customer feedback summary and give me the headline takeaway?
      Assistant: Sure, fetching it now.
      Tool call: get_feedback(period="last_week")
      Tool result: |
        ```json
        {
          "period": "2026-07-27/2026-08-02",
          "score": 4.2,
          "summary_es": "Los clientes valoran la rapidez de la entrega, pero varios se quejan de que el proceso de devolución es confuso y de que el servicio de atención tarda demasiado en responder."
        }
        ```
      Assistant: The headline: customers love the fast delivery, but several are frustrated that the returns process is confusing and that support is slow to respond. Overall score is 4.2.
    languages: [English, Spanish]
    primary_language: English
    notes: JSON structure ignored, but the Spanish natural-language value in "summary_es" counts. English conversation primary.

  # ---------------------------------------------------------------------------
  # Confusable language pairs — reliability stress tests.
  # ---------------------------------------------------------------------------
  - id: confusable_portuguese_not_spanish
    case: confusable_pair
    session: |-
      User: Bom dia! Estou com uma dúvida sobre a configuração da minha conta. Não estou conseguindo alterar o endereço de cobrança e aparece uma mensagem dizendo que a informação não pôde ser salva. Você poderia me ajudar, por favor?
      Assistant: Bom dia! Claro que posso ajudar. Essa mensagem geralmente aparece quando algum campo obrigatório está incompleto ou quando o CEP não corresponde à cidade informada. Você poderia conferir se todos os campos estão preenchidos corretamente?
      User: Ah, entendi. Realmente o CEP estava errado. Muito obrigado pela paciência, agora consegui salvar as alterações sem problema nenhum.
      Assistant: Que ótimo! Fico feliz em ajudar. Qualquer outra dúvida, é só chamar. Tenha um excelente dia!
    languages: [Portuguese]
    primary_language: Portuguese
    notes: Distinctly Brazilian Portuguese (você, ção, obrigado, CEP, nasal). Must NOT be mislabeled Spanish. Portuguese only.

  - id: confusable_ukrainian_not_russian
    case: confusable_pair
    session: |-
      User: Доброго дня! Мені потрібно змінити мову інтерфейсу в застосунку, але я ніяк не можу знайти цей пункт у налаштуваннях. Чи не могли б ви підказати, будь ласка, де саме він знаходиться?
      Assistant: Доброго дня! Звичайно. Зазвичай вибір мови розташований у розділі "Налаштування", у підпункті "Загальні" або "Мова та регіон". Спробуйте прогорнути список донизу — інколи цей пункт знаходиться в самому кінці.
      User: Дуже дякую, знайшла! Виявилося, що він був у самому низу, як ви й казали. Гарного вам дня!
      Assistant: Радий був допомогти! Гарного дня і вам.
    languages: [Ukrainian]
    primary_language: Ukrainian
    notes: Distinctly Ukrainian (ї, є, і, дякую, будь ласка, застосунок). Must NOT be mislabeled Russian. Ukrainian only.

  # ---------------------------------------------------------------------------
  # Multilingual user across turns (three genuine languages).
  # ---------------------------------------------------------------------------
  - id: polyglot_three_languages
    case: multilingual_user
    session: |-
      User: Hi, I'm preparing a trilingual welcome message for our conference and I want to check each version reads naturally. Let me paste them one at a time. First, the English: "Welcome to the annual summit. We're delighted to have you with us."
      Assistant: That reads naturally and warmly in English. It's clear and appropriately formal for a summit opening.
      User: Bien. Maintenant la version française : "Bienvenue au sommet annuel. Nous sommes ravis de vous compter parmi nous."
      Assistant: La version française est fluide et naturelle. "Nous sommes ravis de vous compter parmi nous" est une formule d'accueil élégante et courante.
      User: Perfecto. Y por último la versión en español: "Bienvenidos a la cumbre anual. Estamos encantados de contar con su presencia."
      Assistant: La versión en español también suena natural y cordial. "Estamos encantados de contar con su presencia" es una fórmula de bienvenida muy adecuada para un evento formal.
    languages: [English, French, Spanish]
    primary_language: English
    notes: A genuinely trilingual session with substantive content in each; English opens and slightly leads. All three count.

  - id: greek_only_philosophy
    case: monolingual
    session: |-
      User: Θα ήθελα να καταλάβω καλύτερα τη διαφορά ανάμεσα στη γνώση και στην πεποίθηση. Μπορείς να μου εξηγήσεις με απλά λόγια;
      Assistant: Βεβαίως. Με απλά λόγια, πεποίθηση είναι κάτι που θεωρούμε αληθινό, ενώ γνώση είναι μια πεποίθηση που είναι και αληθινή και δικαιολογημένη. Δηλαδή, για να λέμε ότι κάτι το γνωρίζουμε, δεν αρκεί απλώς να το πιστεύουμε· πρέπει να ισχύει και να έχουμε βάσιμους λόγους να το πιστεύουμε.
      User: Κατάλαβα. Άρα κάθε γνώση είναι πεποίθηση, αλλά όχι κάθε πεποίθηση είναι γνώση.
      Assistant: Ακριβώς. Το είπες πολύ καθαρά.
    languages: [Greek]
    primary_language: Greek
    notes: Monolingual Greek — extends script coverage.
