procs:
  api:
    shell: "pnpm run dev:server 2>&1 | tee /tmp/phoenix-${PHOENIX_PORT:-6006}.log"
    stop: { send-keys: ["<C-c>"] }

  frontend:
    cmd: ["pnpm", "run", "dev:ui"]

  # Continuously replays recorded OpenInference traces into the dev server so
  # there is always live traffic. See "Synthetic Trace Traffic" in DEVELOPMENT.md.
  datagen:
    cmd: ["pnpm", "run", "dev:datagen"]
