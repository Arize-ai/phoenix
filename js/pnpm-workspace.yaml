packages:
  - app
  - packages/*
  - examples/apps/*
  - benchmarks/*

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@arizeai/*"
  - oxlint@1.79.0
  - "@oxlint/binding-android-arm-eabi@1.79.0"
  - "@oxlint/binding-android-arm64@1.79.0"
  - "@oxlint/binding-darwin-arm64@1.79.0"
  - "@oxlint/binding-darwin-x64@1.79.0"
  - "@oxlint/binding-freebsd-x64@1.79.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.79.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.79.0"
  - "@oxlint/binding-linux-arm64-gnu@1.79.0"
  - "@oxlint/binding-linux-arm64-musl@1.79.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-musl@1.79.0"
  - "@oxlint/binding-linux-s390x-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-musl@1.79.0"
  - "@oxlint/binding-openharmony-arm64@1.79.0"
  - "@oxlint/binding-win32-arm64-msvc@1.79.0"
  - "@oxlint/binding-win32-ia32-msvc@1.79.0"
  - "@oxlint/binding-win32-x64-msvc@1.79.0"
  # React 19.3.0 and the packages released alongside it were all published
  # together on September 9, 2026.
  - "react@19.3.0"
  - "react-dom@19.3.0"
  - "scheduler@0.28.0"
  - "@types/react@19.3.0"
  - "@types/react-dom@19.3.0"
minimumReleaseAgeExcludePrune: true

# @browser-ai/core imports @ai-sdk/provider at runtime without declaring it,
# so it only resolves when some other package happens to hoist it — declare
# the dependency it forgot so dependency-graph shifts can't break it.
packageExtensions:
  "@browser-ai/core":
    dependencies:
      "@ai-sdk/provider": "*"

allowBuilds:
  "@mongodb-js/zstd": false
  # Prebuilt platform binaries ship as optional deps; the install script is
  # only a node-gyp build-from-source fallback.
  "@parcel/watcher": false
  # Only has a "use pnpm" preinstall guard; no build output needed.
  autoevals: false
  esbuild: true
  msw: false
  node-liblzma: false
  protobufjs: true
  # napi-postinstall binding fixup for jest 30's resolver.
  unrs-resolver: true

overrides:
  # Pre-existing exact pin: forces peer-dep alignment across @mastra/* packages
  # that each declare narrow hono ranges. Pinned to pick up the fixes for the
  # advisories patched in hono 4.13.16 (mount/RegExpRouter middleware bypass,
  # validator('form') bypass, csrf text/ping, css helper injection).
  "hono": "4.13.20"
  # Still load-bearing: @langchain/core and @braintrust/core pin uuid 9.x/10.x.
  "uuid@<11.1.1": ">=11.1.1"
  # oxfmt pins tinypool 2.1.0 exactly (GHSA prototype-pollution RCE, fixed in 2.1.2).
  "tinypool@<2.1.2": "^2.2.0"
  # @yellow-ticket/seed-json-schema (via @mswjs/source) declares faker ^8.4.1
  # (helpers.fake code execution, fixed in 10.5.0).
  "@faker-js/faker@<10.5.0": "^10.5.0"
  # @mastra/deployer pulls @hono/node-ws 1.3.1, which peers on
  # @hono/node-server 1.x (serveStatic double-decode, fixed in 2.1.3).
  "@hono/node-ws@<1.3.2": "^1.3.2"
  # jest 30, test-exclude and storybook's docgen plugin pin glob 10/13 and
  # minimatch 9/10 (AbortSignal traversal bypass, globparts amplification DoS).
  "glob@>=9.0.0 <14.0.2": "^14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  # typedoc calls Minimatch#matchOne, which minimatch 11 removed, and no typedoc
  # release supports 11 yet. typedoc only matches globs from our own config.
  "typedoc>minimatch": "10.2.6"
