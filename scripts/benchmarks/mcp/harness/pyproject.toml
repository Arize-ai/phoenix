[project]
name = "mcpbench"
version = "0.1.0"
description = "Token-cost benchmark for Phoenix's /mcp surfaces, driven by `claude -p`."
requires-python = ">=3.10"
# Results live in SQLite (stdlib) and the report aggregates in the page, so
# pyyaml is the only third-party requirement.
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
mcpbench = "mcpbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpbench"]
