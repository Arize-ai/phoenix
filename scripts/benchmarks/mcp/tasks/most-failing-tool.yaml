# "Which tool" alone is ambiguous: an agent reads it as its own MCP tools and
# answers executeSql. Naming the spans scopes the question to the trace data
# without reintroducing grading scaffolding.
name: most-failing-tool
task_class: multi-call
prompt: >-
  Looking at the tool spans recorded in the trail-gaia project, which tool
  failed the most times?
expect:
  # The span is named PageDownTool; the tool.name attribute on it is
  # page_down. A run that groups by either has found the same tool.
  regex: '(?i)(PageDownTool|page_down)'

# Checked before a run is spent; a matcher that fails these never reaches a matrix.
accept:
- PageDownTool failed 109 of 110 calls.
- '**page_down** is the tool that failed the most, with 109 failures.'
reject:
- SearchInformationTool, 28 failures.
- executeSql
