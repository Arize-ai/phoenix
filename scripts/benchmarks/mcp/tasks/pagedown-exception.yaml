# Requires reading the status_message of ~109 failed spans. The payload is large
# and the answer is one word, which is exactly where in-sandbox filtering should
# beat dragging every message through the context window.
name: pagedown-exception
task_class: large-result
prompt: >-
  In the "trail-gaia" project, the PageDownTool fails on nearly every call.
  Which Python exception type causes those failures?
  Reply with only the exception type name, no other words.
expect:
  contains: TypeError
