# 10% of 117 traces is 11.7, and rounding either way is defensible: the top 11
# carry 43.1% of the bill, the top 12 carry 45.3%. Both are accepted, because the
# question does not say which way to round and neither reading is wrong.
name: spend-concentration
task_class: multi-call
prompt: >-
  What share of the total trail-gaia bill comes from the most expensive 10% of
  traces?
expect:
  regex: '4[3456](\.\d+)?\s*%|0\.4[3456]'
