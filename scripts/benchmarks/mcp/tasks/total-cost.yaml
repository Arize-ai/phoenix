# Still one lookup, but the answer lives in span_costs rather than a count, so it
# exercises a different tool than count-traces.
name: total-cost
task_class: trivial
prompt: >-
  What is the total cost, in US dollars, of all spans in the "trail-gaia" project?
  Reply with only the number rounded to the nearest whole dollar, no other words.
expect:
  regex: '\b16\b'
