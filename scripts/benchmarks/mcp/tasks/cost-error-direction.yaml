# Real analysis: join per-trace cost to per-trace annotation counts across 117
# traces. Asks about error *count*, not quality score -- the score relationship is
# not monotonic and has no stable answer, the error-count one is clean.
#
# Answers a NUMBER, not more/less. A two-value enum is guessable, and it was: a
# control run with no data access at all scored a pass by picking one of two
# options, while runs that did 20+ turns of real work were marked wrong.
#
# No json_schema either. --json-schema holds on short no-tool runs but not on
# multi-turn tool-using ones, so requiring parseable JSON failed correct answers
# that arrived as prose. Grading scans the answer for the value instead.
#
# Ground truth 2026-08-16: >=6 errors avg $0.2507 (n=45), <=2 errors avg $0.0399
# (n=21), ratio 6.3. The band tolerates minor methodological differences
# (median vs mean, traces missing cost rows) while staying unguessable.
name: cost-error-direction
task_class: large-result
prompt: >-
  In the "trail-gaia" project, compare traces by how many "trail_error" annotations
  they carry. Take the average cost of traces with 6 or more such annotations, and
  divide it by the average cost of traces with 2 or fewer. Reply with only that
  ratio, rounded to one decimal place.
expect:
  regex: '\b(?:[56]\.[0-9]|7\.[0-2])(?![0-9])'
