# "PageDownTool" alone reads as one of the agent's own MCP tools, and a model
# that takes it that way answers "no such tool" without querying anything.
# Naming the spans scopes it to the trace data, as most-failing-tool does.
name: pagedown-root-cause
task_class: large-result
prompt: >-
  In the trail-gaia project, the recorded spans named PageDownTool are erroring
  on almost every call. Looking at those spans, what is actually going wrong
  when the agent calls it?
expect:
  contains: unexpected keyword argument
