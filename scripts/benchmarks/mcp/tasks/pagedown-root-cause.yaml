# "PageDownTool" alone reads as one of the agent's own MCP tools, and a model
# that takes it that way answers "no such tool" without querying anything.
# Naming the spans scopes it to the trace data, as most-failing-tool does.
name: pagedown-root-cause
task_class: large-result
prompt: >-
  In the trail-gaia project, the recorded spans named PageDownTool are erroring
  on almost every call. Looking at those spans, what is actually going wrong
  when the agent calls it?
expect:
  # The finding is that the call passes an argument the signature does not
  # take. Pinning the verbatim error text failed a run that paraphrased it
  # and tabulated all five variants -- a better answer than the pinned one.
  regex: '(?i)(keyword argument|kwarg)'

# Checked before a run is spent; a matcher that fails these never reaches a matrix.
accept:
- 'It gets a TypeError: unexpected keyword argument.'
- forward() is receiving keyword arguments its signature does not accept
- Unexpected kwarg '' (empty string) - 77
reject:
- A TypeError.
- I do not see a PageDownTool in the available Phoenix tools.
