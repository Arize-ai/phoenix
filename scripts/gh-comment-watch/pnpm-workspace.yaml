# This tool is a small 2-package pnpm workspace: the API server (root) and the
# React UI (web/). `pnpm install` from here installs both.
packages:
  - web

# better-sqlite3 ships a prebuilt native binary; allow its install script to
# run so `pnpm install` works without manual approval steps.
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAge: 4320

# Vitest 5.0.0 and the @vitest/* packages it version-locks were published
# together on September 3, 2026. Drop these once that date clears the
# minimumReleaseAge window above.
minimumReleaseAgeExclude:
  - "vitest@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
