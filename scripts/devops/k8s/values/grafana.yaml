# Self-instrumentation for the grafana profile (Tempo traces + Loki structured logs)
logging:
  mode: "structured"

instrumentation:
  otlpTraceCollectorHttpEndpoint: "http://otel-collector:4318"

additionalEnv:
  - name: PYTHONDONTWRITEBYTECODE
    value: "1"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: PHOENIX_SERVER_INSTRUMENTATION_OTLP_LOG_COLLECTOR_HTTP_ENDPOINT
    value: "http://otel-collector:4318"
