# LDAP authentication with POSIX groups (memberUid via groupSearchFilter, no memberOf)
auth:
  enableAuth: true
  admins: ""
  disableBasicAuth: false
  oauth2:
    enabled: true
    providers:
      dev:
        client_id: "phoenix-oidc-client-id"
        client_secret: "phoenix-oidc-client-secret-abc-123"
        oidc_config_url: "http://localhost:18273/oidc/.well-known/openid-configuration"
        display_name: "OIDC"
        allow_sign_up: true
        auto_login: false
        scopes: "roles"
        role_attribute_path: "role"
        role_mapping: "admin:ADMIN,editor:MEMBER,viewer:VIEWER"
  ldap:
    enabled: true
    host: "ldap"
    port: "389"
    tlsMode: "none"
    bindDn: "cn=readonly,dc=example,dc=com"
    bindPassword: "readonly_password"
    userSearchBaseDns:
      - "ou=users,dc=example,dc=com"
    userSearchFilter: "(uid=%s)"
    attrEmail: "mail"
    attrDisplayName: "displayName"
    attrMemberOf: ""
    groupSearchBaseDns:
      - "ou=posix-groups,dc=example,dc=com"
    groupSearchFilter: "(&(objectClass=posixGroup)(memberUid=%s))"
    groupSearchFilterUserAttr: "uid"
    groupRoleMappings: '[{"group_dn":"cn=admins,ou=posix-groups,dc=example,dc=com","role":"ADMIN"},{"group_dn":"cn=members,ou=posix-groups,dc=example,dc=com","role":"MEMBER"},{"group_dn":"cn=viewers,ou=posix-groups,dc=example,dc=com","role":"VIEWER"},{"group_dn":"*","role":"VIEWER"}]'
    allowSignUp: true
