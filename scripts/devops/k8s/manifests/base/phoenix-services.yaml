# Alias Services matching the DNS names expected by devops companions
# (`helm/` creates `phoenix-svc`; Traefik, datagen, and ldap-test connect to
# `phoenix`, while Prometheus dns_sd_configs scrapes per-pod A records on
# `phoenix-headless`).
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  labels:
    app: phoenix
spec:
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: 6006
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-headless
  labels:
    app: phoenix
spec:
  clusterIP: None
  selector:
    app: phoenix
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
