              path: /ready
              port: 3100
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yml
              subPath: loki.yml
              readOnly: true
            - name: data
              mountPath: /loki
          resources:
            limits:
              memory: "512Mi"
