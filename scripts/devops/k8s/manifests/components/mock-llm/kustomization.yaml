apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - mock-llm.yaml

patches:
  - target:
      kind: ConfigMap
      name: traefik-dynamic-profiles
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: traefik-dynamic-profiles
      data:
        mock-llm.yml: |
          http:
            middlewares:
              mock-llm-stripprefix:
                stripPrefix:
                  prefixes:
                    - "/mock-llm"
            routers:
              mock-llm:
                rule: "PathPrefix(`/mock-llm`)"
                entryPoints:
                  - web
                middlewares:
                  - mock-llm-stripprefix
                service: mock-llm
            services:
              mock-llm:
                loadBalancer:
                  servers:
                    - url: "http://mock-llm:57593"
