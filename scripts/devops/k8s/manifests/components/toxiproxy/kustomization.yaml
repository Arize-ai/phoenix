apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - toxiproxy.yaml

patches:
  - target:
      kind: ConfigMap
      name: traefik-dynamic-profiles
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: traefik-dynamic-profiles
      data:
        toxiproxy.yml: |
          http:
            middlewares:
              toxiproxy-stripprefix:
                stripPrefix:
                  prefixes:
                    - "/toxiproxy"
            routers:
              toxiproxy:
                rule: "PathPrefix(`/toxiproxy`)"
                entryPoints:
                  - web
                middlewares:
                  - toxiproxy-stripprefix
                service: toxiproxy
            services:
              toxiproxy:
                loadBalancer:
                  servers:
                    - url: "http://toxiproxy-ui:8080"
