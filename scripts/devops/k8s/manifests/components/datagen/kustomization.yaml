apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - datagen.yaml

patches:
  - target:
      kind: ConfigMap
      name: traefik-dynamic-profiles
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: traefik-dynamic-profiles
      data:
        datagen.yml: |
          http:
            middlewares:
              datagen-stripprefix:
                stripPrefix:
                  prefixes:
                    - "/datagen"
            routers:
              datagen:
                rule: "PathPrefix(`/datagen`)"
                entryPoints:
                  - web
                middlewares:
                  - datagen-stripprefix
                service: datagen
            services:
              datagen:
                loadBalancer:
                  servers:
                    - url: "http://datagen:8080"
