# ---------------------------------------------------------------------------
# 4. POSIX OpenLDAP (no memberOf overlay) + seed
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-posix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap-posix
  template:
    metadata:
      labels:
        app: ldap-posix
    spec:
      enableServiceLinks: false
      hostname: ldap-posix
      containers:
        - name: ldap-posix
          image: osixia/openldap:1.5.0
          args: ["--copy-service", "--loglevel", "debug"]
          ports:
            - containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: "Example Corp POSIX"
            - name: LDAP_DOMAIN
              value: "example.com"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin_password"
            - name: LDAP_CONFIG_PASSWORD
              value: "config_password"
            - name: LDAP_READONLY_USER
              value: "true"
            - name: LDAP_READONLY_USER_USERNAME
              value: "readonly"
            - name: LDAP_READONLY_USER_PASSWORD
              value: "readonly_password"
            - name: LDAP_TLS
              value: "false"
            - name: LDAP_LOG_LEVEL
              value: "256"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-posix
spec:
  selector:
    app: ldap-posix
  ports:
    - name: ldap
      port: 389
      targetPort: 389
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ldap-posix-seed
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ldap-posix-seed
          image: osixia/openldap:1.5.0
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 30); do
                ldapsearch -x -H ldap://ldap-posix:389 -b 'dc=example,dc=com' '(objectClass=*)' dn >/dev/null 2>&1 && break
                sleep 2
              done
              ldapmodify -x -H ldap://ldap-posix:389 -D 'cn=admin,cn=config' -w config_password <<'EOFMOD' || true
              dn: olcOverlay={0}memberof,olcDatabase={1}mdb,cn=config
              changetype: delete
              EOFMOD
              ldapadd -x -H ldap://ldap-posix:389 -D 'cn=admin,dc=example,dc=com' -w admin_password -f /seed/ldap-posix-seed.ldif || true
          volumeMounts:
            - name: seeds
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seeds
          configMap:
            name: ldap-seeds

# ---------------------------------------------------------------------------
# 5. Companion Phoenix deployments (STARTTLS, Anonymous LDAPS/STARTTLS, POSIX) + Grafana LDAP
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-starttls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-starttls
  template:
    metadata:
      labels:
        app: phoenix-starttls
    spec:
      containers:
        - name: phoenix
          image: docker.io/library/devops-phoenix:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "phoenix.server.main", "serve"]
          ports:
            - containerPort: 6006
          env:
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_ENABLE_AUTH
              value: "true"
            - name: PHOENIX_DISABLE_BASIC_AUTH
              value: "false"
            - name: PHOENIX_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION
              value: "true"
            - name: PHOENIX_DISABLE_RATE_LIMIT
              value: "true"
            - name: PHOENIX_SECRET
              value: "dev-secret-for-ldap-testing-only-12345678"
            - name: PHOENIX_ADMIN_SECRET
              value: "dev-admin-secret-for-ldap-testing-abc-0123456789"
            - name: PHOENIX_LDAP_HOST
              value: "ldap-mitm-proxy"
            - name: PHOENIX_LDAP_PORT
              value: "3389"
            - name: PHOENIX_LDAP_TLS_MODE
              value: "starttls"
            - name: PHOENIX_LDAP_TLS_VERIFY
              value: "false"
            - name: PHOENIX_LDAP_BIND_DN
              value: "cn=readonly,dc=example,dc=com"
            - name: PHOENIX_LDAP_BIND_PASSWORD
              value: "readonly_password"
            - name: PHOENIX_LDAP_USER_SEARCH_BASE_DNS
              value: '["ou=users,dc=example,dc=com"]'
            - name: PHOENIX_LDAP_USER_SEARCH_FILTER
              value: "(uid=%s)"
            - name: PHOENIX_LDAP_ATTR_EMAIL
              value: "mail"
            - name: PHOENIX_LDAP_ATTR_DISPLAY_NAME
              value: "displayName"
            - name: PHOENIX_LDAP_ATTR_MEMBER_OF
              value: "memberOf"
            - name: PHOENIX_LDAP_ATTR_UNIQUE_ID
              value: "entryUUID"
            - name: PHOENIX_LDAP_GROUP_ROLE_MAPPINGS
              value: '[{"group_dn":"cn=admins,ou=groups,dc=example,dc=com","role":"ADMIN"},{"group_dn":"cn=members,ou=groups,dc=example,dc=com","role":"MEMBER"},{"group_dn":"*","role":"VIEWER"}]'
            - name: PHOENIX_LDAP_ALLOW_SIGN_UP
              value: "true"
            - name: PHOENIX_SQL_DATABASE_URL
              value: "sqlite:///:memory:"
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-starttls
spec:
  selector:
    app: phoenix-starttls
  ports:
    - port: 6006
      targetPort: 6006
