# Adversarial LDAP TLS + POSIX test suite (ported from overrides/ldap-test.yml)
# The main `phoenix` instance (LDAPS + no-email) is deployed via Helm using values/ldap-test.yaml.

# ---------------------------------------------------------------------------
# 1. Standard OpenLDAP (with mail attribute + TLS) + MITM proxy + seed
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  labels:
    app: ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      enableServiceLinks: false
      hostname: ldap
      containers:
        - name: ldap
          image: osixia/openldap:1.5.0
          args: ["--copy-service", "--loglevel", "debug"]
          ports:
            - containerPort: 389
            - containerPort: 636
          env:
            - name: LDAP_ORGANISATION
              value: "Example Corp"
            - name: LDAP_DOMAIN
              value: "example.com"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin_password"
            - name: LDAP_CONFIG_PASSWORD
              value: "config_password"
            - name: LDAP_READONLY_USER
              value: "true"
            - name: LDAP_READONLY_USER_USERNAME
              value: "readonly"
            - name: LDAP_READONLY_USER_PASSWORD
              value: "readonly_password"
            - name: LDAP_TLS
              value: "true"
            - name: LDAP_TLS_VERIFY_CLIENT
              value: "never"
            - name: LDAP_LOG_LEVEL
              value: "256"
---
apiVersion: v1
kind: Service
metadata:
  name: ldap
spec:
  selector:
    app: ldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ldap-seed
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ldap-seed
          image: osixia/openldap:1.5.0
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 30); do
                ldapsearch -x -H ldap://ldap:389 -b 'dc=example,dc=com' '(objectClass=*)' dn >/dev/null 2>&1 && break
                sleep 2
              done
              ldapadd -x -H ldap://ldap:389 -D 'cn=admin,dc=example,dc=com' -w admin_password -f /seed/ldap-seed.ldif || true
          volumeMounts:
            - name: seeds
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seeds
          configMap:
            name: ldap-seeds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-mitm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap-mitm-proxy
  template:
    metadata:
      labels:
        app: ldap-mitm-proxy
    spec:
      containers:
        - name: ldap-mitm-proxy
          image: python:3.13-slim
          command:
            - python3
            - -u
            - /scripts/ldap_mitm_proxy.py
            - --ldap-host
            - ldap
            - --ldap-port
            - "389"
            - --listen-port
            - "3389"
            - --api-host
            - "0.0.0.0"
            - --api-port
            - "8080"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: ldap-proxy
              containerPort: 3389
            - name: api
              containerPort: 8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: ldap-test-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-mitm-proxy
spec:
  selector:
    app: ldap-mitm-proxy
  ports:
    - name: ldap-proxy
      port: 3389
      targetPort: 3389
    - name: api
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap-admin
  template:
    metadata:
      labels:
        app: ldap-admin
    spec:
      enableServiceLinks: false
      containers:
        - name: ldap-admin
          image: osixia/phpldapadmin:0.9.0
          ports:
            - containerPort: 80
          env:
            - name: PHPLDAPADMIN_LDAP_HOSTS
              value: "ldap"
            - name: PHPLDAPADMIN_HTTPS
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-admin
spec:
  type: NodePort
  selector:
    app: ldap-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30643

