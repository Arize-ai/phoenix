            - name: PHOENIX_LDAP_ATTR_EMAIL
              value: "mail"
            - name: PHOENIX_LDAP_ATTR_DISPLAY_NAME
              value: "displayName"
            - name: PHOENIX_LDAP_ATTR_MEMBER_OF
              value: ""
            - name: PHOENIX_LDAP_GROUP_SEARCH_BASE_DNS
              value: '["ou=posix-groups,dc=example,dc=com"]'
            - name: PHOENIX_LDAP_GROUP_SEARCH_FILTER
              value: "(&(objectClass=posixGroup)(memberUid=%s))"
            - name: PHOENIX_LDAP_GROUP_SEARCH_FILTER_USER_ATTR
              value: "uid"
            - name: PHOENIX_LDAP_GROUP_ROLE_MAPPINGS
              value: '[{"group_dn":"cn=admins,ou=posix-groups,dc=example,dc=com","role":"ADMIN"},{"group_dn":"cn=members,ou=posix-groups,dc=example,dc=com","role":"MEMBER"},{"group_dn":"cn=viewers,ou=posix-groups,dc=example,dc=com","role":"VIEWER"},{"group_dn":"*","role":"VIEWER"}]'
            - name: PHOENIX_LDAP_ALLOW_SIGN_UP
              value: "true"
            - name: PHOENIX_SQL_DATABASE_URL
              value: "sqlite:///:memory:"
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-posix
spec:
  selector:
    app: phoenix-posix
  ports:
    - port: 6006
      targetPort: 6006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-ldap
  template:
    metadata:
      labels:
        app: grafana-ldap
    spec:
      containers:
        - name: grafana-ldap
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_LDAP_ENABLED
              value: "true"
            - name: GF_AUTH_LDAP_CONFIG_FILE
              value: "/etc/grafana/ldap.toml"
            - name: GF_AUTH_LDAP_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_SECURITY_SECRET_KEY
              value: "grafana-secret-key-for-testing"
          volumeMounts:
            - name: ldap-toml
              mountPath: /etc/grafana/ldap.toml
              subPath: ldap-grafana.toml
              readOnly: true
      volumes:
        - name: ldap-toml
          configMap:
            name: ldap-seeds
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-ldap
spec:
  selector:
    app: grafana-ldap
  ports:
    - port: 3000
      targetPort: 3000

# ---------------------------------------------------------------------------
# 6. Test runner Deployment (runs integration + TLS verification, keeps pod alive for log inspection)
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-test
  labels:
    app: ldap-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap-test
  template:
    metadata:
      labels:
        app: ldap-test
    spec:
      containers:
        - name: ldap-test
          image: python:3.13-slim
          command:
            - /bin/bash
            - -c
            - |
              echo '⏳ Installing dependencies...'
              apt-get update -qq && apt-get install -y -qq ldap-utils 2>&1 | grep -v 'debconf'
              pip install --quiet requests ldap3
              echo '⏳ Waiting for LDAP seed data to be loaded...'
              for host in ldap ldap-no-email ldap-anonymous ldap-posix; do
                for i in $(seq 1 40); do
                  if ldapsearch -x -H "ldap://${host}:389" -b 'ou=users,dc=example,dc=com' '(uid=admin)' dn 2>/dev/null | grep -q 'uid=admin'; then
                    break
                  fi
                  sleep 2
                done
              done
              for i in $(seq 1 40); do
                if python3 -c "import requests; r = requests.post('http://phoenix:6006/auth/ldap/login', json={'username': 'admin', 'password': 'password123'}, timeout=5); exit(0 if r.status_code == 204 else 1)" 2>/dev/null; then
                  echo '✅ LDAP seed data is ready'
                  break
                fi
                echo "Attempt $i/40: LDAP data not ready, waiting..."
                sleep 3
              done
              echo '🧪 Running LDAP integration tests (includes POSIX mode)...'
              python3 /scripts/test_ldap_integration.py
              EXIT_CODE=$?
              echo '🧪 Running comprehensive LDAP TLS security tests...'
              python3 /scripts/test_ldap_tls.py
              TLS_EXIT_CODE=$?
              if [ $EXIT_CODE -eq 0 ]; then
                echo '✅ All LDAP integration tests passed'
              else
                echo '❌ Some LDAP integration tests failed'
              fi
              if [ $TLS_EXIT_CODE -eq 0 ]; then
                echo '✅ All TLS security tests passed'
              else
                echo '❌ TLS security tests failed - VULNERABILITIES DETECTED'
              fi
              echo 'Keeping container alive for debugging...'
              tail -f /dev/null
          env:
            - name: PHOENIX_URL
              value: "http://phoenix:6006"
            - name: PHOENIX_STARTTLS_URL
              value: "http://phoenix-starttls:6006"
            - name: PHOENIX_LDAPS_URL
              value: "http://phoenix:6006"
            - name: PHOENIX_ANONYMOUS_LDAPS_URL
              value: "http://phoenix-anonymous-ldaps:6006"
            - name: PHOENIX_ANONYMOUS_STARTTLS_URL
              value: "http://phoenix-anonymous-starttls:6006"
            - name: PHOENIX_POSIX_URL
              value: "http://phoenix-posix:6006"
            - name: PHOENIX_ADMIN_SECRET
              value: "dev-admin-secret-for-ldap-testing-abc-0123456789"
            - name: GRAFANA_URL
              value: "http://grafana-ldap:3000"
            - name: LDAP_HOST
              value: "ldap"
            - name: LDAP_PORT
              value: "389"
            - name: MITM_API_URL
              value: "http://ldap-mitm-proxy:8080"
            - name: MITM_ANONYMOUS_API_URL
              value: "http://ldap-anonymous-mitm-proxy:8080"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: ldap-test-scripts
