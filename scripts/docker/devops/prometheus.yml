global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Resolve every phoenix container, so each replica is scraped as its own
  # instance when the service is scaled. A static target would scrape
  # whichever replica DNS returns and mix them into one series.
  - job_name: 'phoenix'
    dns_sd_configs:
      - names: ['phoenix']
        type: 'A'
        port: 9090
        refresh_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # The datagen control server, when the datagen profile is running. The target is
  # down otherwise, which leaves the datagen panels empty.
  - job_name: 'datagen'
    static_configs:
      - targets: ['datagen:8080']
    metrics_path: '/metrics'
