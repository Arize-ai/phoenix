global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'phoenix'
    static_configs:
      - targets: ['phoenix:9090']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # The datagen control server, when the datagen profile is running. The target is
  # down otherwise, which leaves the datagen panels empty.
  - job_name: 'datagen'
    static_configs:
      - targets: ['datagen:8080']
    metrics_path: '/metrics'
