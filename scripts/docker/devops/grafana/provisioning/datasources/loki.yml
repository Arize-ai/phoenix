apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        # Matching OTLP structured metadata `trace_id` via `matcherType: label` requires Grafana >= 10.4.
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: "(.+)"
          name: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
