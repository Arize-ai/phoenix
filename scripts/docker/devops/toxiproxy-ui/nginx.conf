# Serves the Toxiproxy control page and forwards its API calls to the
# Toxiproxy admin API, so that the page and the API share one origin.
server {
    listen 8080;

    # Docker's embedded DNS. Resolving at request time lets nginx start
    # before the toxiproxy container is reachable.
    resolver 127.0.0.11 valid=10s;
    set $toxiproxy http://toxiproxy:8474;

    location = / {
        root /srv/toxiproxy-ui;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # Toxiproxy rejects requests whose User-Agent is a browser's, so that
        # web pages cannot change the toxics. This proxy replaces that check:
        # it requires a custom header, which a page on another origin cannot
        # send without a CORS preflight, and nginx never approves a preflight.
        if ($http_x_requested_with != "toxiproxy-ui") {
            return 403 '{"error":"missing header X-Requested-With: toxiproxy-ui"}';
        }
        proxy_set_header User-Agent "toxiproxy-ui";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $toxiproxy;
    }
}
