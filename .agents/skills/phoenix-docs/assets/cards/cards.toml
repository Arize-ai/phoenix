# Card art for docs <Card img> slots. See references/card-images.md.
#
# [cards.<id>]   lowercase kebab-case; becomes <id>.<fingerprint>.avif in GCS
# template       "logo" (default), "topic" or "frame"
# logo           logo template: a file stem in logos/
# motif          topic template: trace, eval, prompt, dataset, experiment, agent, retrieval
# src            frame template: URL of a product screenshot
# badges         up to two logo stems, drawn bottom-right (languages, capabilities)
# accent         cyan (default), green, violet, amber or rose
# replaces       legacy image URLs that `relink` swaps for this card
# title, href    regexes a legacy <Card> must match before `relink` swaps it;
#                cards with patterns are tried first, in file order

