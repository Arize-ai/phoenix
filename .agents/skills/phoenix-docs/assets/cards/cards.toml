# Card art for docs <Card img> slots. See references/card-images.md and
# references/card-design.md.
#
# Each table is one image, published at docs-cards/<section>/<key>.avif:
#
#   [integrations.<logo>]          a brand mark                integrations/openai.avif
#   [integrations.<logo>-<badge>]  a brand mark and qualifier  integrations/openai-evals.avif
#   [topics.<motif>]               a product drawing           topics/trace.avif
#   [banners.<page>]               a page banner               banners/settings-sandboxes.avif
#
# logo, badge  file stems in logos/. The key must equal <logo> or <logo>-<badge>.
# <page>       a banner's page path under docs/phoenix/ in kebab-case (settings/sandboxes.mdx
#              is settings-sandboxes). A banner takes a title and one of motif, logo or marks.
# replaces     legacy image URLs that `relink` swaps for this card. A plain URL swaps
#              every <Card> (for a banner, every page image) that uses it.
#              { url, title, href } swaps only <Card>s whose attributes match the
#              regexes. At most one entry may match a <Card>; `cards.py status`
#              reports overlaps. Tables stay alphabetical.

# --- Integrations: brand marks, alone or with one qualifier ---------------------

