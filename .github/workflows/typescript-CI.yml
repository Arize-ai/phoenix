name: Typescript CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - version-*
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: test-typescript-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            ts:
              - "js/**"
              - "schemas/**"
              - "src/phoenix/server/generative_ui/**"
              - "tests/unit/server/agents/fixtures/ui_message_stream/**"
              - ".oxlintrc.json"
              - ".oxfmtrc.jsonc"
              - ".nvmrc"

  ci:
    name: CI Typescript
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ts == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./js/pnpm-lock.yaml
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile
      # Builds every workspace package in topological order (the app's
      # workspace dependencies build before the app itself). The diff check
      # catches drift in committed build-time codegen: the packages' OpenAPI
      # types (prebuild generate) and the app's relay artifacts (build:relay).
      - name: Build
        working-directory: ./js
        run: |
          pnpm run build
          git diff --exit-code
      - name: Type Check
        working-directory: ./js
        run: pnpm run typecheck
      - name: Formatting
        working-directory: ./js
        run: |
          pnpm run fmt:check
      - name: Lint
        working-directory: ./js
        run: |
          pnpm run lint
      # Not part of the app's build; regenerated here to catch drift against
      # schemas/openapi.json.
      - name: OpenAPI Codegen
        working-directory: ./js/app
        run: |
          pnpm run generate:openapi
          git diff --exit-code
      - name: Generative UI Schema Codegen
        run: |
          make schema-generative-ui
          git diff --exit-code
      - name: UI Message Stream Fixture Codegen
        run: |
          make ui-message-stream-fixtures
          git diff --exit-code
      - name: Test
        working-directory: ./js
        run: pnpm run test

  ci-required:
    name: TypeScript CI Required
    needs:
      - changes
      - ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
