name: Factory Demo Check

# Labels `factory-demo` a pull request that a core contributor opened, that changes the UI and
# whose description shows nothing of how it looks, which starts Factory Demo. demo.py check
# holds the rules.
on:
  # zizmor: ignore[dangerous-triggers] The job checks out only the base branch, runs demo.py
  # from it and reads the PR through the API; no code from the PR runs here.
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # pull_request_target checks out the base branch by default; keep it that way.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"

      # A label added with GITHUB_TOKEN starts no workflow, so the app adds it.
      - name: Mint factory app token
        id: factory-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Check the pull request
        env:
          FACTORY_GITHUB_LOGIN: ${{ vars.FACTORY_GITHUB_LOGIN }}
          FACTORY_LABEL_TOKEN: ${{ steps.factory-token.outputs.token }}
        run: uv run --script factory/demo.py --repo "$GH_REPO" --pr "$PR_NUMBER" check
