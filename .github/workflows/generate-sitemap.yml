name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "docs.json"
      - "scripts/generate_sitemap.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"

      - name: Generate sitemap
        run: uv run scripts/generate_sitemap.py

      - name: Create or update PR
        id: cpr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          commit-message: "chore: update sitemap.xml"
          branch: update-sitemap
          title: "chore: update sitemap.xml"
          body: "Auto-generated sitemap update"
          add-paths: |
            sitemap.xml
            docs/phoenix/sitemap.xml

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        # Lets a reviewer merge with a single approval; a failure here should
        # not fail the run since the PR itself was opened successfully.
        # Block scalar: in a plain YAML scalar, " #" would start a comment and
        # truncate the command mid-string.
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash || echo "::warning::Could not enable auto-merge on #$PR_NUMBER"
