name: Factory Preview

# Only authorized PRs enter the deployment workflow. The PR checkout is a Docker build context.
on:
  # zizmor: ignore[dangerous-triggers] See above: the PR's checkout is a build context only.
  pull_request_target:
    types: [opened, edited, labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  authorize:
    name: Check preview eligibility
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'factory-preview') ||
       ((contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
         (github.event.action == 'edited' && github.event.changes.body)) &&
        contains(github.event.pull_request.labels.*.name, 'factory-preview')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.author.outputs.allowed }}
    steps:
      - name: Check the PR opener's repository access
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          FACTORY_LOGIN: ${{ vars.FACTORY_GITHUB_LOGIN }}
        run: |
          set -euo pipefail
          # finish.py copies a contributor's body verbatim into a factory-authored PR.
          # Its reserved branches must not gain seed execution through the bot's identity.
          if [[ "$PR_BRANCH" == factory/pr-* ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Previews are disabled for factory-finish copies."
            exit 0
          fi
          if [[ -z "$FACTORY_LOGIN" || "$PR_AUTHOR" != "$FACTORY_LOGIN" ]]; then
            permission=$(gh api "repos/$GH_REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission')
            case "$permission" in
              admin|write|maintain) ;;
              *)
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Previews require a PR opened by the factory or a maintainer."
                exit 0
                ;;
            esac
          fi
          current_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer commit superseded this preview."
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy the preview
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    # The hourly sweep takes the same lock before deleting the project.
    concurrency:
      group: factory-preview-${{ github.event.pull_request.number }}-deploy
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: ./.github/workflows/factory-preview-deploy.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      FACTORY_PREVIEW_RAILWAY_TOKEN: ${{ secrets.FACTORY_PREVIEW_RAILWAY_TOKEN }}
