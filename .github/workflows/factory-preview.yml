name: Factory Preview

# Deploys a seeded preview of a PR labeled `factory-preview`. dispatch.py adds the label
# when a bug or feature lane's PR leaves draft; a maintainer can add it to any same-repo PR.
# The PR's Python source and, when it changed, its frontend build are laid over the published
# image of the main commit the PR's dependencies match, together with the seed script from
# the PR body (factory/preview/Dockerfile, built by docker-bake.hcl). The image goes to
# GHCR under pr-<number> and pr-<number>-<short sha> tags, and deploy.py points a Railway
# service at it. Closing or unlabeling the PR deletes the service and the PR's image tags.
#
# The scripts and the preview Dockerfile run from the base branch, checked out under base/,
# because they run with the Railway token and a write token. The PR's checkout under head/
# is only a Docker build context: nothing from the PR runs on the runner, only inside
# BuildKit. Factory Guard fails a PR that edits these files but does not stop this
# workflow from running on it.
#
# No caches anywhere in the deploy job: it publishes an image, and a restored cache is a
# way to tamper with what gets published.
#
# `pull_request` from a same-repo branch gets the repo secrets and a write token, and a
# fork PR gets neither, so both jobs skip fork PRs.
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, closed, unlabeled]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    # Open PRs only: a closed PR has already had its teardown, and nothing would run it again.
    # Removing some other label is not a reason to redeploy, so `unlabeled` is left out.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'factory-preview') ||
       (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
        contains(github.event.pull_request.labels.*.name, 'factory-preview')))
    # A newer push supersedes the preview an older run is still building.
    concurrency:
      group: factory-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the base branch for the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - name: Check out the PR as the build context
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: base/pyproject.toml
          resolution-strategy: "lowest"
          python-version: "3.12"
          enable-cache: false

      # plan.py picks the published main image whose dependencies match the PR, or none
      # for a full build, says whether the frontend changed since that image was built, and
      # writes the seed script from the PR body to the seed directory (empty when none).
      # The head SHA comes from the event, not a fresh lookup, so a push that lands during
      # this run can't get its SHA on an image built from the previous head.
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/phoenix-preview"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          uv run --script base/factory/preview/plan.py --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --seed-dir "$GITHUB_WORKSPACE/seed" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # docker-bake.hcl builds the PR's frontend stage, and the whole PR when no published
      # image matches its dependencies, as targets the preview takes as contexts, so neither
      # leaves the builder. Only the preview image is pushed. Every context sits under the
      # workspace because bake refuses to read outside its working directory.
      - name: Build and push the preview image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          HEAD_DIR: ${{ github.workspace }}/head
          PREVIEW_DIR: ${{ github.workspace }}/base/factory/preview
          SEED_DIR: ${{ github.workspace }}/seed
          BASE_CONTEXT: ${{ steps.plan.outputs.base-image && format('docker-image://{0}', steps.plan.outputs.base-image) || 'target:base' }}
          FRONTEND_CONTEXT: ${{ steps.plan.outputs.frontend == 'true' && 'target:frontend' || 'docker-image://busybox:stable' }}
          STATIC_SOURCE: ${{ steps.plan.outputs.frontend == 'true' && 'frontend' || 'base' }}
          TAGS: ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }},${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}-${{ steps.plan.outputs.short-sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        with:
          source: .
          files: base/factory/preview/docker-bake.hcl
          targets: preview
          push: true

      - name: Deploy to Railway
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.FACTORY_RAILWAY_TOKEN }}
          IMAGE: ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}-${{ steps.plan.outputs.short-sha }}
          SEED_SUMMARY: ${{ steps.plan.outputs.seed-summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --script base/factory/preview/deploy.py deploy
          --pr "$PR_NUMBER" --image "$IMAGE" --head-sha "$HEAD_SHA"
          --seed "$SEED_SUMMARY" --run-url "$RUN_URL"

  teardown:
    name: Tear down
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'factory-preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'factory-preview'))
    concurrency:
      group: factory-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The base branch, not the PR's merge ref, which a closed or conflicting PR lacks.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"
          enable-cache: false
      - name: Delete the Railway service and the PR's image tags
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.FACTORY_RAILWAY_TOKEN }}
        run: uv run --script factory/preview/deploy.py teardown --pr "$PR_NUMBER" --image "ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/phoenix-preview"
