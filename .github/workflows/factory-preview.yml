name: Factory Preview

# Deploys a seeded preview of a PR labeled `factory-preview`. dispatch.py adds the label
# when a bug or feature lane's PR leaves draft; a maintainer can add it to any same-repo PR.
# The PR's Python source and, when it changed, its frontend build are laid over the published
# image of the main commit the PR's dependencies match, together with the seed script from
# the PR body (factory/preview/Dockerfile). The image goes to GHCR under pr-<number> and
# pr-<number>-<short sha> tags, and deploy.py points a Railway service at it. Closing or
# unlabeling the PR deletes the service and the PR's image tags.
#
# The scripts and the preview Dockerfile run from the base branch, checked out under base/,
# because they run with the Railway token and a write token. The PR's checkout under head/
# is only a Docker build context: nothing from the PR runs on the runner, only inside
# BuildKit. Factory Guard fails a PR that edits these files but does not stop this
# workflow from running on it.
#
# No caches anywhere in the deploy job: it publishes an image, and a restored cache is a
# way to tamper with what gets published.
#
# `pull_request` from a same-repo branch gets the repo secrets and a write token, and a
# fork PR gets neither, so both jobs skip fork PRs.
on:
  pull_request:
    types: [labeled, synchronize, reopened, closed, unlabeled]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'factory-preview') ||
       ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
        contains(github.event.pull_request.labels.*.name, 'factory-preview')))
    # A newer push supersedes the preview an older run is still building.
    concurrency:
      group: factory-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the base branch for the scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - name: Check out the PR as the build context
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: base/pyproject.toml
          resolution-strategy: "lowest"
          python-version: "3.12"
          enable-cache: false

      # plan.py picks the published main image whose dependencies match the PR, or none
      # for a full build, says whether the frontend changed since that image was built, and
      # writes the seed script from the PR body to the seed directory (empty when none).
      # The head SHA comes from the event, not a fresh lookup, so a push that lands during
      # this run can't get its SHA on an image built from the previous head.
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/phoenix-preview"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          uv run --script base/factory/preview/plan.py --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --seed-dir "$RUNNER_TEMP/seed" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A PR whose dependencies match no published image can't borrow one, so it pays for
      # the full build once and overlays on that instead.
      - name: Build the base image when no published one matches
        if: steps.plan.outputs.base-image == ''
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: head
          file: head/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}-base-${{ steps.plan.outputs.short-sha }}

      - name: Build and push the preview image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: head
          file: base/factory/preview/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-contexts: |
            preview=base/factory/preview
            seed=${{ runner.temp }}/seed
          build-args: |
            BASE_IMAGE=${{ steps.plan.outputs.base-image || format('{0}:pr-{1}-base-{2}', steps.plan.outputs.image, github.event.pull_request.number, steps.plan.outputs.short-sha) }}
            STATIC_SOURCE=${{ steps.plan.outputs.frontend == 'true' && 'build' || 'base' }}
          tags: |
            ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}
            ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}-${{ steps.plan.outputs.short-sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: Deploy to Railway
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.FACTORY_RAILWAY_TOKEN }}
          IMAGE: ${{ steps.plan.outputs.image }}:pr-${{ github.event.pull_request.number }}-${{ steps.plan.outputs.short-sha }}
          SEED_SUMMARY: ${{ steps.plan.outputs.seed-summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --script base/factory/preview/deploy.py deploy
          --pr "$PR_NUMBER" --image "$IMAGE" --head-sha "$HEAD_SHA"
          --seed "$SEED_SUMMARY" --run-url "$RUN_URL"

  teardown:
    name: Tear down
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'factory-preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'factory-preview'))
    concurrency:
      group: factory-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The base branch, not the PR's merge ref, which a closed or conflicting PR lacks.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"
          enable-cache: false
      - name: Delete the Railway service and the PR's image tags
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.FACTORY_RAILWAY_TOKEN }}
        run: uv run --script factory/preview/deploy.py teardown --pr "$PR_NUMBER" --image "ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/phoenix-preview"
