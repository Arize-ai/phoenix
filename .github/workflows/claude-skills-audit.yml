name: Weekly Skills Audit

on:
  schedule:
    # Every Wednesday at 17:00 UTC (after docs-gap-audit at 16:00)
    - cron: "0 17 * * 3"
  workflow_dispatch:
    inputs:
      window:
        description: "Audit window (e.g. '7 days ago', '14 days ago')"
        required: false
        default: "7 days ago"

concurrency:
  group: skills-audit
  cancel-in-progress: true

jobs:
  skills-audit:
    outputs:
      pr: ${{ steps.publish.outputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: read is all Claude can reach: the read-only workflow token is
      # passed to the action below (so no write-scoped App token is minted via
      # OIDC), and publishing is done by later steps with a PAT.
      contents: read
      # id-token: write lets the action exchange the GitHub OIDC token for a
      # Claude API token (workload identity federation). It is job-wide, so
      # every step can request OIDC tokens; passing github_token to the action
      # is what stops it from minting a write-scoped Claude App token.
      id-token: write
    env:
      AUDIT_WINDOW: ${{ inputs.window || '7 days ago' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set summary path
        id: summary
        run: echo "path=${RUNNER_TEMP}/skills-audit-summary.md" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create audit branch
        id: branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Suffix with run id so re-runs on the same day don't collide
          BRANCH="skills-audit/${DATE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Find audit pull requests still open
        id: stale
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        run: |
          # Oldest first. Only this repo's branches: a fork may use the same name.
          OPEN=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100&direction=asc" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" \
              '.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith("skills-audit/"))) | "\(.number) \(.created_at[:10])"')
          NUMBERS=$(awk '{print $1}' <<< "$OPEN" | paste -s -d ' ' -)
          OLDEST=$(awk 'NR == 1 {print $2}' <<< "$OPEN")
          echo "numbers=$NUMBERS" >> "$GITHUB_OUTPUT"
          echo "oldest=$OLDEST" >> "$GITHUB_OUTPUT"
          echo "Open audit pull requests: ${NUMBERS:-none}"

      - name: Choose the audit window
        id: window
        env:
          OLDEST_STALE: ${{ steps.stale.outputs.oldest }}
        run: |
          SINCE="$AUDIT_WINDOW"
          if [[ -n "$OLDEST_STALE" ]]; then
            # The open audits are about to be closed as superseded, so this run
            # must cover their windows too: start where the oldest one's started.
            REQUESTED_START=$(date -u -d "$AUDIT_WINDOW" +%F)
            STALE_START=$(date -u -d "$OLDEST_STALE $AUDIT_WINDOW" +%F)
            if [[ "$STALE_START" < "$REQUESTED_START" ]]; then
              SINCE="$STALE_START"
            fi
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "Auditing commits since: $SINCE"

      - name: Install subprocess isolation deps
        # Required by CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1. The Claude CLI sandbox
        # needs both bubblewrap AND socat, and Ubuntu 24.04+ blocks the unprivileged
        # user namespaces it relies on by default. Mirrors the upstream action's
        # install step (which only runs when allowed_non_write_users is set).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_federation_rule_id: fdrl_01FaSPpJwwwTkYQNr3nndkCN
          anthropic_organization_id: 8a57e064-47c7-4a95-ac37-2283e8cf46d5
          anthropic_service_account_id: svac_01Hn6a4CZgGZyobSwenfUf5b
          anthropic_workspace_id: wrkspc_019uQCzw86YfY8Li79ZLtsom

          # Hand the action the read-only workflow token instead of letting it
          # mint a write-scoped Claude App token via OIDC. Claude never writes
          # to GitHub here (a later step publishes with a PAT), so the GH_TOKEN
          # in its environment stays read-only.
          github_token: ${{ github.token }}

          # Surface the full Claude SDK message stream in the step log instead of
          # the sanitized summary (denied-tool detail, tool calls, reasoning). Inputs
          # are public repo/PR/issue content, and GitHub masks registered secrets.
          # Note: logs are public.
          show_full_output: 'true'
          prompt: |
            /phoenix-skills-audit

            Audit commits since "${{ steps.window.outputs.since }}" on origin/main for changes to the
            Python clients, TypeScript clients, CLI, and REST/GraphQL APIs that should be
            reflected in the three external-facing skills:

              - skills/phoenix-tracing/
              - skills/phoenix-cli/
              - skills/phoenix-evals/

            Follow the skill's guidance strictly — fetch origin/main first, breadth-first
            triage, ground every edit in real code, and only patch files inside those three
            skill directories.

            Apply the patches directly to the working tree. Do not commit, do not push, do
            not open a PR — the workflow handles that.

            After all edits are applied, write the run summary (the markdown the skill's
            "Phase 6" describes) to this exact path using the Write tool:

              ${{ steps.summary.outputs.path }}

            That file is what the workflow uses to populate the PR body, so it must exist
            even if there are no changes to apply. If there are no user-facing changes
            (only deps, refactors, frontend, feature flags), still write the summary file
            and have its first line be exactly: NO_CHANGES
          claude_args: '--allowedTools Skill,Read,Glob,Grep,Edit,Write,Agent,"Bash(git fetch:*)","Bash(git log:*)","Bash(git diff:*)","Bash(git show:*)","Bash(date:*)","Bash(ls:*)"'

      - name: Rebuild skill copies
        run: make skills

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet -- skills src/phoenix/server/mcp/skills src/phoenix/server/agents/prompts/public_skills; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- skills src/phoenix/server/mcp/skills src/phoenix/server/agents/prompts/public_skills
          elif [[ -n "$(git ls-files --others --exclude-standard skills src/phoenix/server/mcp/skills src/phoenix/server/agents/prompts/public_skills)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git ls-files --others --exclude-standard skills src/phoenix/server/mcp/skills src/phoenix/server/agents/prompts/public_skills
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No skill changes — exiting cleanly."
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          # Separate publishing token; the claude-code-action app token has
          # already been revoked by this point.
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          AUDIT_DATE: ${{ steps.branch.outputs.date }}
          AUDIT_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh auth setup-git
          # The Claude step rewrites origin to embed its app token in the URL
          # and revokes that token when the step ends. URL-embedded credentials
          # take precedence over gh's credential helper, so reset the remote to
          # a clean URL to push with the PAT configured above.
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git add skills src/phoenix/server/mcp/skills src/phoenix/server/agents/prompts/public_skills
          git commit -m "docs(skills): weekly audit — $AUDIT_DATE"
          git push origin "$AUDIT_BRANCH"

      - name: Open pull request
        id: publish
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          AUDIT_DATE: ${{ steps.branch.outputs.date }}
          AUDIT_BRANCH: ${{ steps.branch.outputs.branch }}
          SUMMARY_FILE: ${{ steps.summary.outputs.path }}
        run: |
          if [[ -s "$SUMMARY_FILE" ]]; then
            BODY_FILE="$SUMMARY_FILE"
          else
            BODY_FILE=$(mktemp)
            echo "Automated weekly audit of the three external-facing skills against recent changes on \`origin/main\`. (Run summary file was missing — see commit diff for details.)" > "$BODY_FILE"
          fi

          PR_URL=$(gh pr create \
            --base main \
            --head "$AUDIT_BRANCH" \
            --title "docs(skills): weekly audit — $AUDIT_DATE" \
            --body-file "$BODY_FILE" \
            --label "documentation")
          # Auto-merge once a reviewer approves and checks pass.
          gh pr merge "$AUDIT_BRANCH" --auto --squash || echo "::warning::Could not enable auto-merge on $AUDIT_BRANCH"
          echo "pr=$AUDIT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Close superseded pull requests
        if: steps.stale.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          STALE: ${{ steps.stale.outputs.numbers }}
          NEW_PR_URL: ${{ steps.publish.outputs.url }}
          SINCE: ${{ steps.window.outputs.since }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$NEW_PR_URL" ]]; then
            REASON="Superseded by $NEW_PR_URL, which audited every commit since $SINCE and so covers the changes proposed here."
          else
            REASON="Closed by [this audit run]($RUN_URL): auditing every commit since $SINCE found nothing left to change in the skills, so the changes proposed here are already on \`main\` or no longer apply."
          fi
          for NUMBER in $STALE; do
            gh pr close "$NUMBER" --delete-branch --comment "$REASON"
          done

  approve:
    needs: skills-audit
    if: needs.skills-audit.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted approval action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Approve pull request
        uses: ./.github/actions/approve-automation-pr
        with:
          pr: ${{ needs.skills-audit.outputs.pr }}
          token: ${{ secrets.AUTOMATION_APPROVER_TOKEN }}
