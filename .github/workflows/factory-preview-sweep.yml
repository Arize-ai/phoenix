name: Factory Preview Sweep

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-preview-sweep
  cancel-in-progress: false

jobs:
  discover:
    name: Find unused preview projects
    if: github.ref_name == github.event.repository.default_branch && vars.FACTORY_PREVIEW_RAILWAY_WORKSPACE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prs: ${{ steps.discover.outputs.prs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          python-version: "3.12"
          enable-cache: false
      - name: Discover closed and unlabeled previews
        id: discover
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.FACTORY_PREVIEW_RAILWAY_TOKEN }}
          RAILWAY_WORKSPACE_ID: ${{ vars.FACTORY_PREVIEW_RAILWAY_WORKSPACE_ID }}
        run: |
          prs=$(uv run --script factory/preview/deploy.py discover-cleanup)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Remove preview for PR ${{ matrix.pr }}
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    concurrency:
      group: factory-preview-${{ matrix.pr }}-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          python-version: "3.12"
          enable-cache: false
      - name: Recheck the PR and delete its project
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          RAILWAY_API_TOKEN: ${{ secrets.FACTORY_PREVIEW_RAILWAY_TOKEN }}
          RAILWAY_WORKSPACE_ID: ${{ vars.FACTORY_PREVIEW_RAILWAY_WORKSPACE_ID }}
        run: uv run --script factory/preview/deploy.py cleanup --pr "$PR_NUMBER"
