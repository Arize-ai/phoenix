name: Factory Preview Sweep


on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-preview-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            factory/preview
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"
          enable-cache: false
      - name: Delete the previews of closed and unlabeled PRs
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.FACTORY_RAILWAY_TOKEN }}
        run: uv run --script factory/preview/deploy.py sweep --image "ghcr.io/$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)/phoenix-preview"
