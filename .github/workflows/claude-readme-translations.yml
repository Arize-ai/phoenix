name: Sync README Translations

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to diff README.md from (default: the last commit that touched a docs/i18n/README.<lang>.md)"
        required: false
        type: string

permissions: {}

concurrency:
  # Each run syncs every README.md change since the translations were last
  # updated, so a newer run fully supersedes an older one.
  group: readme-translations-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: read is all Claude can reach: the read-only workflow token is
      # passed to the action below, and publishing is done by a later step with
      # a PAT.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history (without blobs) so the last translation update can be
          # found with git log.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Find README.md changes to sync
        id: diff
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          # The translations were last synced by the most recent commit that
          # touched any of them; everything README.md gained since then is new.
          BASE="${INPUT_BASE:-$(git log -1 --format=%H -- ':(top,glob)docs/i18n/README.*.md')}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
            echo "::error::Could not resolve a base commit to diff from."
            exit 1
          fi
          if git diff --quiet "$BASE" HEAD -- README.md; then
            echo "README.md has not changed since $BASE; translations are in sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .scratch
          git diff "$BASE" HEAD -- README.md > .scratch/readme.diff
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "BRANCH=claude/sync-readme-translations" >> "$GITHUB_ENV"

      - name: Install subprocess isolation deps
        if: steps.diff.outputs.changed == 'true'
        # Required by CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1. The Claude CLI sandbox
        # needs both bubblewrap AND socat, and Ubuntu 24.04+ blocks the unprivileged
        # user namespaces it relies on by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code
        id: claude
        if: steps.diff.outputs.changed == 'true'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only workflow token: Claude never writes to GitHub here.
          github_token: ${{ github.token }}
          show_full_output: 'true'
          prompt: |
            Keep the translated READMEs in sync with README.md.

            `.scratch/readme.diff` holds every change made to README.md since commit
            ${{ steps.diff.outputs.base }}, when the translations were last updated.
            Each `docs/i18n/README.<lang>.md` is a translation (the suffix
            is the language, e.g. `README.pt-BR.md` is Brazilian Portuguese, `README.zh-TW.md`
            Traditional Chinese, `README.no.md` Norwegian Bokmål) that mirrors README.md
            line for line: line N of a translation corresponds to line N of README.md.

            Apply the same changes to every translation:
            - Added or changed lines: translate them into that file's language, matching
              the terminology, tone, and formality already used in that file. Keep URLs,
              link targets, image and badge markup, inline code, HTML tags, commands, and
              product/package names exactly as in README.md, except that relative links
              (e.g. `./MIGRATION.md`) are rewritten relative to `docs/i18n/` (e.g.
              `../../MIGRATION.md`). Lines without prose (HTML,
              code, badge-only table rows) are copied verbatim.
            - Removed lines: remove the corresponding line.
            - Leave every other line untouched. Do not retranslate or polish unchanged text.
            - In-page anchor links (`#...`) point to the translated heading in that file.
            - The language bar line keeps that file's own language in bold and links the rest.
            - The Scarf pixel's `page=` value stays that file's own file name.
            - A translator's note after the end of the mirrored content stays as it is.

            There are many translations: use the Agent tool to split them across parallel
            subagents (a few languages each), passing them these rules and the diff.

            Then run `python3 scripts/check_readme_translations.py` and fix every problem
            it reports until it reports 0 problems.

            Only edit `docs/i18n/README.<lang>.md` files. Do not commit, push, or open a PR; the
            workflow handles publishing. When done, write a short PR body to
            `.scratch/pr-body.md` summarizing which README.md changes were synced.
          claude_args: '--allowedTools Read,Write,Edit,Glob,Grep,Agent,"Bash(git diff:*)","Bash(git log:*)","Bash(git show:*)","Bash(git status:*)","Bash(python3 scripts/check_readme_translations.py:*)","Bash(ls:*)","Bash(wc:*)"'

      - name: Commit and open pull request
        if: steps.diff.outputs.changed == 'true' && steps.claude.outcome == 'success'
        env:
          # Separate publishing token; the claude-code-action app token has
          # already been revoked by this point.
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          BASE: ${{ steps.diff.outputs.base }}
        run: |
          # Publish only translation files, whatever else the run touched.
          git restore --source=HEAD --worktree --staged -- README.md
          git add -- ':(top,glob)docs/i18n/README.*.md'
          if git diff --cached --quiet; then
            echo "No translation changes — exiting cleanly."
            exit 0
          fi
          python3 scripts/check_readme_translations.py
          gh auth setup-git
          # The Claude step rewrites origin to embed its app token in the URL and
          # revokes that token when the step ends; reset to a clean URL so the
          # PAT configured above is used.
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "docs: sync README translations with README.md"
          # The branch is owned by this workflow and always rebuilt from main.
          git push --force -u origin "$BRANCH"
          if [ -s .scratch/pr-body.md ]; then
            BODY_FILE=.scratch/pr-body.md
          else
            BODY_FILE=$(mktemp)
            echo "Automated sync of README translations with README.md changes since $BASE." > "$BODY_FILE"
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$BODY_FILE"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: sync README translations" \
              --body-file "$BODY_FILE"
          fi
          # Auto-merge once a reviewer approves and checks pass.
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Could not enable auto-merge on $BRANCH"
