#  https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
name: Clean Up Caches of Closed Pull Requests
permissions:
  contents: read
  actions: write  # required to delete Actions caches
on:
  schedule:
    - cron: "0 6 * * *"  # Daily 06:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches whose pull request is closed
        run: |
          refs=$(gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[].ref' | grep -E '^refs/pull/[0-9]+/merge$' | sort -u)

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          for ref in $refs
          do
              number=$(echo "$ref" | cut -d/ -f3)
              state=$(gh api "repos/$REPO/pulls/$number" --jq .state)
              if [ "$state" = "closed" ]; then
                  echo "Deleting caches for $ref"
                  for id in $(gh api --paginate "repos/$REPO/actions/caches?ref=$ref&per_page=100" --jq '.actions_caches[].id'); do
                      gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
                  done
              fi
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
