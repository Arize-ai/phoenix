name: Claude RCA (dev Phoenix)

# Point headless Claude at the dev Phoenix instance over MCP, run root-cause analysis on the spans
# streaming in, and — ONLY when a real, confidently-fixable Phoenix bug is
# found AND the proposed fix passes a deterministic verification gate — open a
# PR with the fix. No triggers exist yet, so this runs on a schedule. If there
# is no issue, there is no code change and therefore no PR; if the fix does not
# verify, it is suppressed (no PR) and its logs are uploaded as an artifact.

on:
  schedule:
    - cron: "0 13 * * *" # Daily at 13:00 UTC
  workflow_dispatch:
    inputs:
      project:
        description: Phoenix project to analyze
        required: true
        default: pxi_dev
        type: string
      lookback_hours:
        description: How many hours of recent spans to analyze
        required: true
        default: "24"
        type: string
      dry_run:
        description: Run RCA but never open a PR (manual runs default to dry)
        required: true
        default: true
        type: boolean

# One RCA run at a time. cancel-in-progress is false so an in-flight run that
# may already be committing/pushing is never killed mid-work.
concurrency:
  group: claude-rca
  cancel-in-progress: false

jobs:
  rca:
    name: Root-cause analysis of dev Phoenix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # contents: read is all Claude can reach: the read-only workflow token is
      # passed to the action below, and publishing is done by a later step with a PAT. 
      # Phoenix is reached only over MCP, whose SQL surface is read-only.
      contents: read
    env:
      CI: "true"
      PHOENIX_PROJECT: ${{ inputs.project || 'pxi_dev' }}
      LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
      # Scheduled runs open PRs; manual runs default to dry.
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"

      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*

      - name: Create branch
        # creates a branch named claude/rca-<date>
        id: branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="claude/rca-$DATE"
          git checkout -b "$BRANCH"
          mkdir -p .scratch
          {
            echo "BRANCH=$BRANCH"
            echo "DATE=$DATE"
          } >> "$GITHUB_ENV"
          {
            echo "branch=$BRANCH"
            echo "date=$DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Write Phoenix MCP config
        # Build the MCP client config from secrets in a shell step so the API
        # key is materialized from env into a file and never appears in the
        # logged `claude_args`. `--strict-mcp-config` (below) makes Claude use
        # ONLY this file. The bearer token authenticates against the same check
        # as /v1, so an API key is accepted with no OAuth flow.
        env:
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
        run: |
          if [ -z "$PHOENIX_COLLECTOR_ENDPOINT" ] || [ -z "$PHOENIX_API_KEY" ]; then
            echo "::error::PHOENIX_COLLECTOR_ENDPOINT and PHOENIX_API_KEY must be configured as repository secrets."
            exit 1
          fi
          BASE="${PHOENIX_COLLECTOR_ENDPOINT%/}"
          jq -n \
            --arg url "${BASE}/mcp" \
            --arg auth "Bearer ${PHOENIX_API_KEY}" \
            '{mcpServers: {phoenix: {type: "http", url: $url, headers: {Authorization: $auth}}}}' \
            > .scratch/mcp.json
          # Sanity-check shape without printing the token.
          jq -e '.mcpServers.phoenix.url' .scratch/mcp.json > /dev/null

      - name: Install subprocess isolation deps
        # Required by CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1. The Claude CLI sandbox
        # needs both bubblewrap AND socat, and Ubuntu 24.04+ blocks the unprivileged
        # user namespaces it relies on by default. Mirrors the upstream action's
        # install step (which only runs when allowed_non_write_users is set).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude RCA
        id: claude
        # this action installs the Claude Code CLI on the runner, and runs the RCA prompt
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          github_token: ${{ github.token }}

          show_full_output: 'true'
          # This line is what claude code recieves as the user message. It is a command to the Claude Code CLI to run the RCA prompt.
          prompt: "/rca-dev-phoenix ${{ inputs.project || 'pxi_dev' }} ${{ inputs.lookback_hours || '24' }}"
          claude_args: '--model opus --mcp-config .scratch/mcp.json --strict-mcp-config --allowedTools mcp__phoenix,Read,Write,Edit,Glob,Grep,Agent,Skill,"Bash(git status:*)","Bash(git diff:*)","Bash(git log:*)","Bash(make:*)","Bash(uv:*)","Bash(pnpm:*)","Bash(mkdir:*)","Bash(cat:*)","Bash(ls:*)","Bash(find:*)","Bash(grep:*)"'

      - name: Detect fix changes
        # `.scratch` is gitignored. phoenix-error-analysis writes CWD-relative
        # sidecars under `.px/coding/` which are NOT ignored at repo root — they
        # are report-only (uploaded as an artifact) and must not count as a fix.
        id: changes
        if: steps.claude.outcome == 'success'
        run: |
          untracked=$(git ls-files --others --exclude-standard | grep -v '^\.px/' || true)
          if git diff --quiet && [ -z "$untracked" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fix produced; skipping verification."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify RCA fix
        # Deterministic gate: do NOT trust the model's self-report that it ran
        # the checks. Re-run them here; a fix only becomes a PR if this is green.
        # Full test suites are deferred to the PR's own CI.
        id: verify
        if: steps.claude.outcome == 'success' && steps.changes.outputs.changed == 'true'
        continue-on-error: true # if this step fails, the job keeps going. in gh actions a step's outcome is: success, failure, skipped, cancelled.
        run: |
          # install deps
          uv sync
          ( cd js && pnpm install --frozen-lockfile )

          # create a directory to store the verify logs
          mkdir -p .scratch/verify
          failed=0
          # Each check: run, capture stdout+stderr to a per-check log, record exit
          # code. Do NOT short-circuit on first failure — capture everything.
          run() {
            local name="$1"; shift
            local log=".scratch/verify/${name}.log"
            echo "::group::${name}"
            if "$@" > "$log" 2>&1; then
              echo "✓ ${name}" | tee -a "$log"
            else
              echo "✗ ${name} (see $log)" | tee -a "$log"
              failed=1
            fi
            cat "$log"
            echo "::endgroup::"
          }
          # run <log-name> <command>
          run gen-graphql         make graphql
          run gen-openapi         make openapi
          run gen-generative-ui   make schema-generative-ui
          run gen-ui-reducer      make ui-message-stream-fixtures
          # Formatters run in write mode: style churn rides along in the commit.
          run python-format       make format-python
          run python-lint         make lint-python
          run python-typecheck    make typecheck-python
          run js-fmt              make format-ts
          run js-lint             make lint-ts
          # Build before typecheck/test: workspace packages resolve each other via
          # dist/, so checks against unbuilt packages fail on module resolution.
          run js-build            make build-ts
          run js-typecheck        make typecheck-ts
          run js-test             make test-ts

          # create a summary: one PASS/FAIL line per check, using whether the log contains a ✗ line.
          {
            echo "# Verify summary ($(date -u +%FT%TZ))"
            for log in .scratch/verify/*.log; do
              name=$(basename "$log" .log)
              if grep -q "^✗ " "$log"; then
                echo "FAIL  $name  ($log)"
              else
                echo "PASS  $name"
              fi
            done
          } > .scratch/verify/SUMMARY.md
          cat .scratch/verify/SUMMARY.md
          exit "$failed"

      - name: Report suppressed fix
        # A fix existed but failed deterministic verification: open no PR, but make
        # the suppression loud. The verify logs ship in the report artifact below.
        if: steps.claude.outcome == 'success' && steps.changes.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        run: |
          echo "::warning::RCA produced a fix but deterministic verification failed; no PR opened. See the claude-rca-report artifact (.scratch/verify/) for logs."

      - name: Commit and open PR
        # Only when a real fix was produced AND it passed verification. No issue ->
        # no code change -> no PR. Bad fix -> verify fails -> no PR.
        if: steps.claude.outcome == 'success' && env.DRY_RUN != 'true' && steps.changes.outputs.changed == 'true' && steps.verify.outcome == 'success'
        env:
          # Separate publishing token; the claude-code-action app token has
          # already been revoked by this point.
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        run: |
          gh auth setup-git
          # The Claude step rewrites origin to embed its app token in the URL and
          # revokes that token when the step ends. URL-embedded credentials take
          # precedence over gh's credential helper, so reset the remote to a clean
          # URL to push with the PAT configured above.
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git ls-files --others lists untracked files.
          # --exclude-standard hides gitignored paths (.scratch).
          # `.px/` is not gitignored at repo root but is not a code fix: skip it.
          untracked=$(git ls-files --others --exclude-standard | grep -v '^\.px/' || true)
          if git diff --quiet && [ -z "$untracked" ]; then
            echo "No fixable issue found (working tree clean aside from .px sidecars); opening no PR."
            exit 0
          fi

          # Never let an RCA fix touch automation or agent-instruction files.
          # Cover both tracked modifications (git diff) AND newly created files
          # (git ls-files --others): Claude has Write, so a brand-new file under
          # a blocked dir would otherwise slip past `git diff` and ride along in
          # the `git add` below. `.px/` is omitted here so restore/rm does not
          # wipe the coding sidecars before the artifact step.
          blocked_files=$({ git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.px/' | sort -u | awk '
            /^\.github\// ||
            /^\.cursor\// ||
            /^\.claude\// ||
            /^\.agents\// ||
            /(^|\/)AGENTS\.md$/ ||
            /(^|\/)CLAUDE\.md$/
          ')
          if [ -n "$blocked_files" ]; then
            echo "::warning::RCA fix changed automation or agent-instruction files; restoring them from origin/main."
            printf '%s\n' "$blocked_files"
            while IFS= read -r file; do
              if git cat-file -e "origin/main:$file" 2>/dev/null; then
                git restore --source=origin/main --worktree --staged -- "$file"
              else
                git restore --staged -- "$file" 2>/dev/null || true
                rm -f -- "$file"
              fi
            done <<< "$blocked_files"
          fi

          untracked=$(git ls-files --others --exclude-standard | grep -v '^\.px/' || true)
          if git diff --quiet && [ -z "$untracked" ]; then
            echo "Only blocked files changed; restored them and opening no PR."
            exit 0
          fi

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "A PR already exists for $BRANCH; skipping."
            exit 0
          fi

          DEFAULT_TITLE="fix(rca): resolve issue found in dev Phoenix (${DATE})"
          PR_TITLE="$DEFAULT_TITLE"
          if [ -s .scratch/pr-title.txt ]; then
            CANDIDATE=$(head -n 1 .scratch/pr-title.txt | tr -d '\r')
            if printf '%s' "$CANDIDATE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf|style|build)(\([^)]+\))?!?: .+'; then
              PR_TITLE="$CANDIDATE"
            else
              echo "::warning::.scratch/pr-title.txt did not match conventional-commit format; falling back to '$DEFAULT_TITLE'."
            fi
          else
            echo "::warning::Claude did not write .scratch/pr-title.txt; falling back to '$DEFAULT_TITLE'."
          fi

          {
            echo "> :robot: Automated root-cause analysis of dev Phoenix (project \`${PHOENIX_PROJECT}\`, last ${LOOKBACK_HOURS}h)."
            echo "> The analysis and fix below were produced by Claude from trace data. Review the diff and evidence carefully before merging."
            echo ""
            if [ -s .scratch/pr-body.md ]; then
              cat .scratch/pr-body.md
            else
              echo "Claude did not write \`.scratch/pr-body.md\`; see the workflow logs for the RCA narrative."
            fi
          } > .scratch/pr-body-full.md

          # Stage tracked edits and untracked files except `.px/` sidecars
          git add -A -- . ':!.px' ':!.px/**'
          git commit -m "$PR_TITLE"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file .scratch/pr-body-full.md
        
        # Scratch report plus phoenix-error-analysis coding sidecars.
      - name: Upload RCA report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: claude-rca-report
          path: |
            .scratch/rca-findings.md
            .scratch/pr-body.md
            .scratch/verify/SUMMARY.md
            .scratch/verify/*.log
            .px/coding/*.jsonl
          if-no-files-found: ignore
          retention-days: 14
