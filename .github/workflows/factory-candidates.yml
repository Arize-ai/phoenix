name: Factory Candidates

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Claude Issue Triage Sweep, Claude Issue Triage on Open]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-candidates
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
      issues: write # mark a dispatched candidate with the factory label
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # Each run can spend up to dispatch.py's --budget-cents, so cap the runs per triage.
      MAX_DISPATCHES: 3
    steps:
      - name: Dispatch candidates written by someone with write access
        run: |
          DISPATCHED=0
          for ISSUE in $(gh issue list --search 'label:factory-candidate -label:factory sort:created-asc' \
            --state open --limit 100 --json number --jq '.[].number'); do
            if [ "$DISPATCHED" -ge "$MAX_DISPATCHES" ]; then
              echo "Dispatched $MAX_DISPATCHES; the other candidates wait for the next triage run."
              break
            fi
            # Every factory comment starts with "The factory", so one means the factory already
            # had a go at it. Running it again is a maintainer's call: re-add the `factory` label.
            # The search index lags, so re-read the label live before trusting the listing.
            read -r AUTHOR PAST_RUNS LABELED < <(gh issue view "$ISSUE" --json author,comments,labels \
              --jq '[.author.login, ([.comments[] | select(.body | startswith("The factory"))] | length), (any(.labels[]; .name == "factory"))] | @tsv')
            if [ "$PAST_RUNS" -gt 0 ]; then
              echo "#$ISSUE: skipped, the factory already ran on it"
              continue
            fi
            if [ "$LABELED" = true ]; then
              echo "#$ISSUE: skipped, already dispatched"
              continue
            fi
            PERMISSION=$(gh api "repos/$GH_REPO/collaborators/$AUTHOR/permission" --jq .permission 2> /dev/null || echo none)
            if [ "$PERMISSION" != admin ] && [ "$PERMISSION" != write ]; then
              echo "#$ISSUE: skipped, $AUTHOR has $PERMISSION access; a maintainer can add the factory label"
              continue
            fi
            # A label added with GITHUB_TOKEN starts no workflow; it only keeps the next run of
            # this loop from dispatching the issue again before dispatch.py has commented on it.
            gh issue edit "$ISSUE" --add-label factory
            gh workflow run factory-dispatch.yml -f issue="$ISSUE" || { gh issue edit "$ISSUE" --remove-label factory; exit 1; }
            echo "#$ISSUE: dispatched, written by $AUTHOR"
            DISPATCHED=$((DISPATCHED + 1))
          done
