name: Factory Demo

# Captures before and after screenshots of a pull request labeled `factory-demo`, or
# dispatched by number, in the factory sandbox, and adds them to its description. Factory Demo
# Check adds the label to core contributors' UI PRs whose description shows nothing.

on:
  # zizmor: ignore[dangerous-triggers] The job checks out only the base branch and runs
  # demo.py from it. The PR's code runs in the Managed Agents sandbox, which holds no repo
  # secret.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to demo
        required: true

permissions:
  contents: read

jobs:
  demo:
    # Triage access is enough to label a PR, so demo.py also checks for write access.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'factory-demo'
    # A second trigger for the same PR waits for this one. Set on the job, not the workflow,
    # so runs for other labels skip the group.
    concurrency:
      group: factory-demo-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write # report a failed start; the app posts every other comment
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # pull_request_target checks out the base branch by default; keep it that way.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"

      # Factory Sync keeps the agent, environment and vault IDs on the factory-state branch.
      - name: Pull claude-lock.json
        run: |
          git fetch --quiet --depth=1 origin factory-state
          git show FETCH_HEAD:claude-lock.json > factory/claude-lock.json

      - name: Install admission scanner
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/factory-scan-bin
        run: uv tool install --python 3.12 --with pydantic==2.11.9 semgrep==1.144.0

      - name: Cache admission decisions
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/factory-admission-cache
          key: ${{ runner.os }}-factory-admission-v2-${{ hashFiles('factory/security*', 'factory/security_scan_prompt.md') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-factory-admission-v2-${{ hashFiles('factory/security*', 'factory/security_scan_prompt.md') }}-

      - name: Start session
        id: start
        env:
          FACTORY_SEMGREP: ${{ runner.temp }}/factory-scan-bin/semgrep
          FACTORY_SCAN_CACHE_DIR: ${{ runner.temp }}/factory-admission-cache
          ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
          # Used to mint the session's GitHub token.
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          FACTORY_GITHUB_LOGIN: ${{ vars.FACTORY_GITHUB_LOGIN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_BY: ${{ github.event.sender.login }}
        run: uv run --script factory/demo.py --repo "$GH_REPO" --pr "$PR_NUMBER" start --head-sha "$PR_HEAD_SHA" --requested-by "$REQUESTED_BY"

      - name: Watch session
        if: steps.start.outputs.started == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
          # Re-mints the session's token before it expires.
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          SESSION_ID: ${{ steps.start.outputs.session_id }}
          HEAD_SHA: ${{ steps.start.outputs.head_sha }}
          STATUS_COMMENT_ID: ${{ steps.start.outputs.status_comment_id }}
        run: uv run --script factory/demo.py --repo "$GH_REPO" --pr "$PR_NUMBER" watch --session-id "$SESSION_ID" --head-sha "$HEAD_SHA" --status-comment-id "$STATUS_COMMENT_ID"

      # The watch step reports its own failures. This uses GITHUB_TOKEN, so it lands even when
      # the app's credentials are what failed.
      - name: Report a failed start
        if: failure() && steps.start.outcome != 'success'
        run: |
          gh pr comment "$PR_NUMBER" --body "The factory hit an error before it could report; see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
