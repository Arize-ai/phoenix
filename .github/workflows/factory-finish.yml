name: Factory Finish

# Takes a pull request labeled `factory-finish`, or dispatched by number, the rest of the way
# to mergeable in the factory sandbox: a linked issue, every review finding fixed, CI green.
# A fork PR is first copied to a branch here, since the factory cannot push to a fork.
on:
  # zizmor: ignore[dangerous-triggers] The job checks out only the base branch and runs
  # finish.py from it, which fetches and pushes a fork PR's commits as objects without running
  # them. The PR's code runs only in the Managed Agents sandbox, which holds no repo secret.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to finish
        required: true

permissions:
  contents: read

jobs:
  finish:
    # Triage access is enough to label a PR, so finish.py also checks for write access.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'factory-finish'
    # A second trigger for the same PR waits for this one. Set on the job, not the workflow,
    # so runs for other labels skip the group.
    concurrency:
      group: factory-finish-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: write # report a failed start; the app posts every other comment
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # pull_request_target checks out the base branch by default; keep it that way.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          python-version: "3.12"

      # Factory Sync keeps the agent, environment and vault IDs on the factory-state branch.
      - name: Pull claude-lock.json
        run: |
          git fetch --quiet --depth=1 origin factory-state
          git show FETCH_HEAD:claude-lock.json > factory/claude-lock.json

      - name: Start session
        id: start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
          # Used to mint the session's GitHub token.
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          FACTORY_GITHUB_LOGIN: ${{ vars.FACTORY_GITHUB_LOGIN }}
          REQUESTED_BY: ${{ github.event.sender.login }}
        run: uv run --script factory/finish.py --repo "$GH_REPO" --pr "$PR_NUMBER" start --requested-by "$REQUESTED_BY"

      - name: Watch session
        if: steps.start.outputs.started == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
          # Re-mints the session's token before it expires, and marks the PR ready for review as
          # the app: a GITHUB_TOKEN event would not start the review workflow.
          FACTORY_APP_CLIENT_ID: ${{ vars.FACTORY_APP_CLIENT_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          FACTORY_GITHUB_LOGIN: ${{ vars.FACTORY_GITHUB_LOGIN }}
          FINISHED_PR: ${{ steps.start.outputs.pr }}
          SESSION_ID: ${{ steps.start.outputs.session_id }}
          STATUS_COMMENT_ID: ${{ steps.start.outputs.status_comment_id }}
        # A fork PR is finished on its copy, so the watch step follows the PR the start step names.
        run: uv run --script factory/finish.py --repo "$GH_REPO" --pr "$FINISHED_PR" watch --session-id "$SESSION_ID" --status-comment-id "$STATUS_COMMENT_ID"

      # The watch step reports its own failures. This uses GITHUB_TOKEN, so it lands even when
      # the app's credentials are what failed.
      - name: Report a failed start
        if: failure() && steps.start.outcome != 'success'
        run: |
          gh pr comment "$PR_NUMBER" --body "The factory hit an error before it could report; see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
