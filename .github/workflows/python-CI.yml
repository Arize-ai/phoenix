# EXPERIMENT BRANCH ONLY. Python CI is trimmed to the Windows integration leg
# of the nightly platform matrix, so every push to the PR costs only the jobs
# under investigation. The other head-triggered workflow files are removed on
# this branch for the same reason; the CLA check still runs from the base.
name: Python CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - version-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-python-${{ github.head_ref }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: "sk-fake-openai-key"

jobs:
  integration-tests:
    name: Integration Tests (${{ matrix.scenario }}, windows-latest, sqlite, ${{ matrix.py }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, as on the nightly's other platforms.
        # The nightly runs Windows on 3.13 instead of 3.14 citing missing
        # sqlean.py wheels; that predates the vendored arize-phoenix-sqlean,
        # which publishes cp314 win_amd64 and win_arm64 wheels.
        py: ["3.10", "3.14"]
        scenario: [full, mcp-only, no-mcp]
        include:
          # Test paths are given from the repository root: tox rewrites a
          # posarg that exists relative to its own working directory into a
          # path relative to changedir, so "." would become the repository
          # root and pytest would collect every package's tests. --ignore is
          # an option value, which tox leaves alone, so it is relative to
          # tests/integration.
          # The nightly's invocation plus a per-test kill (pytest-timeout,
          # thread method on Windows) and a non-fatal all-threads dump 60s
          # before it, so the first hung test names itself and shows where it
          # is blocked.
          - scenario: full
            args: "tests/integration -ra --reruns 5 -n 4 -v --durations=20 --timeout 180 -o faulthandler_timeout=120"
            tee: "0"
          # The MCP tests alone, in file order, on one worker: every client
          # session lands on the same server process, which is the shape of the
          # upstream Windows deadlock (PrefectHQ/fastmcp#4192). Server output is
          # teed to the job log so the last request before a stall is visible.
          - scenario: mcp-only
            args: "tests/integration/auth/test_mcp.py -ra -n 1 -p no:randomly -v --timeout 180 -o faulthandler_timeout=120"
            tee: "1"
          # Everything except the MCP tests: passes iff the hang lives there.
          - scenario: no-mcp
            args: "tests/integration -ra --reruns 5 -n 4 -v --durations=20 --timeout 180 -o faulthandler_timeout=120 --ignore=auth/test_mcp.py"
            tee: "0"
    env:
      CI_TEST_DB_BACKEND: sqlite
      PHOENIX_TEST_SERVER_LOG_TO_STDERR: ${{ matrix.tee }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            requirements/
            src/phoenix/
            packages/phoenix-client/
            packages/phoenix-evals/
            tests/integration/
            tests/__generated__/
            tests/__init__.py
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
      - name: Run integration tests
        timeout-minutes: 45
        run: uvx tox run -e integration_tests -- ${{ matrix.args }}
