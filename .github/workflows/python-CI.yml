name: Python CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - version-*
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: test-python-${{ github.head_ref }}
  cancel-in-progress: true

env:
  pip-version: 24.2
  OPENAI_API_KEY: "sk-fake-openai-key" # fake openai key so that llama_index doesn't download huggingface embeddings

jobs:
  changes:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      ipynb: ${{ steps.filter.outputs.ipynb }}
      ipynb_files: ${{ steps.filter.outputs.ipynb_files }}
      proto: ${{ steps.filter.outputs.proto }}
      prompts: ${{ steps.filter.outputs.prompts }}
      phoenix: ${{ steps.filter.outputs.phoenix }}
      phoenix_client: ${{ steps.filter.outputs.phoenix_client }}
      phoenix_evals: ${{ steps.filter.outputs.phoenix_evals }}
      phoenix_otel: ${{ steps.filter.outputs.phoenix_otel }}
      migrations: ${{ steps.filter.outputs.migrations }}
      ddl: ${{ steps.filter.outputs.ddl }}
      uv_lock: ${{ steps.filter.outputs.uv_lock }}
      json_canonicalization_schema: ${{ steps.filter.outputs.json_canonicalization_schema }}
      filter_dsl: ${{ steps.filter.outputs.filter_dsl }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          list-files: shell
          filters: |
            ipynb:
              - "**/*.ipynb"
            prompts:
              - "prompts/**"
              - "scripts/prompts/compile_python_prompts.py"
            phoenix:
              - "evals/**"
              - "src/**"
              - "tests/**"
              - "tutorials/**"
              - "pyproject.toml"
              - "tox.ini"
            phoenix_client:
              - "packages/phoenix-client/**"
              - "tox.ini"
            phoenix_evals:
              - "packages/phoenix-evals/**"
              - "tox.ini"
            phoenix_otel:
              - "packages/phoenix-otel/**"
              - "tox.ini"
            migrations:
              - "src/phoenix/db/migrations/versions/**"
            ddl:
              - "src/phoenix/db/migrations/**"
              - "src/phoenix/db/ddl/*.sql"
              - "scripts/ddl/**"
            json_canonicalization_schema:
              - "src/phoenix/vendor/json_canonicalization_scheme/**/*.py"
            uv_lock:
              - "**/pyproject.toml"
              - "uv.lock"
            filter_dsl:
              - "js/app/src/pages/project/traceFilterDSL.ts"
              - "js/app/src/pages/project/sessionFilterDSL.ts"
              - "src/phoenix/trace/dsl/**"
              - "scripts/ci/check_filter_dsl_snippets.py"
      - name: Print Filters
        env:
          IPYNB: ${{ steps.filter.outputs.ipynb }}
          IPYNB_FILES: ${{ steps.filter.outputs.ipynb_files }}
          PROMPTS: ${{ steps.filter.outputs.prompts }}
          PHOENIX: ${{ steps.filter.outputs.phoenix }}
          PHOENIX_CLIENT: ${{ steps.filter.outputs.phoenix_client }}
          PHOENIX_EVALS: ${{ steps.filter.outputs.phoenix_evals }}
          PHOENIX_OTEL: ${{ steps.filter.outputs.phoenix_otel }}
          MIGRATIONS: ${{ steps.filter.outputs.migrations }}
          DDL: ${{ steps.filter.outputs.ddl }}
          UV_LOCK: ${{ steps.filter.outputs.uv_lock }}
          JSON_CANONICALIZATION_SCHEMA: ${{ steps.filter.outputs.json_canonicalization_schema }}
          FILTER_DSL: ${{ steps.filter.outputs.filter_dsl }}
        run: |
          echo "ipynb: $IPYNB"
          echo "ipynb_files: $IPYNB_FILES"
          echo "prompts: $PROMPTS"
          echo "phoenix: $PHOENIX"
          echo "phoenix_client: $PHOENIX_CLIENT"
          echo "phoenix_evals: $PHOENIX_EVALS"
          echo "phoenix_otel: $PHOENIX_OTEL"
          echo "migrations: $MIGRATIONS"
          echo "ddl: $DDL"
          echo "uv_lock: $UV_LOCK"
          echo "json_canonicalization_schema: $JSON_CANONICALIZATION_SCHEMA"
          echo "filter_dsl: $FILTER_DSL"

  unit-tests:
    name: Unit Tests (${{ matrix.db }}, ${{ matrix.py }})
    runs-on: oss-4-core-runner
    needs: changes
    if: ${{ (needs.changes.outputs.phoenix == 'true' || needs.changes.outputs.uv_lock == 'true') && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10"]
        db: [sqlite, postgresql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            requirements/
            src/phoenix/
            evals/
            packages/phoenix-evals/
            tests/unit/
            tests/conftest.py
            tests/__generated__/
            tests/__init__.py
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
      - name: Install PostgreSQL (product floor)
        if: matrix.db == 'postgresql'
        # The floor version from the PGDG repository, not whatever the
        # runner's Ubuntu ships: the DSL suites assert cross-dialect
        # guarantees that must hold on the oldest supported PostgreSQL, so
        # they run against it. Keep in sync with the documented floor in
        # docs/phoenix/self-hosting/architecture.mdx.
        run: |
          sudo apt-get -yqq install postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -yqq install postgresql-14
      - name: Run SQLite tests
        if: matrix.db == 'sqlite'
        timeout-minutes: 60
        run: uvx tox run -e unit_tests -- -ra --durations=20 --timeout 360 -n 8 --dist loadscope
      - name: Run PostgreSQL tests
        if: matrix.db == 'postgresql'
        timeout-minutes: 60
        run: uvx tox run -e unit_tests -- -ra --durations=20 --timeout 360 --db postgresql -n 8 --dist loadscope --postgresql-exec /usr/lib/postgresql/14/bin/pg_ctl

