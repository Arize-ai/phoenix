name: Validate datagen asset

run-name: Validate datagen asset ${{ inputs.archive_name }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the scenario archive
        required: true
        type: string
      archive_artifact:
        description: Name of the workflow artifact containing one scenario archive
        required: true
        type: string
      archive_name:
        description: Canonical scenario archive name, including .tar.gz
        required: true
        type: string
      asset_schema_version:
        description: Scenario manifest schema version
        required: true
        default: "2"
        type: choice
        options:
          - "2"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validation revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Download the scenario archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.archive_artifact }}
          path: incoming
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the archive
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
          ASSET_SCHEMA_VERSION: ${{ inputs.asset_schema_version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]

          mapfile -t downloaded_files < <(find incoming -type f -print)
          [[ "${#downloaded_files[@]}" -eq 1 ]]
          [[ "${downloaded_files[0]}" == "incoming/$ARCHIVE_NAME" ]]

          uv run --frozen python -m scripts.datagen.publish validate \
            --archive "incoming/$ARCHIVE_NAME" \
            --asset-schema-version "$ASSET_SCHEMA_VERSION"
