name: Publish datagen assets

run-name: Publish datagen assets ${{ inputs.pass_id }}

on:
  workflow_dispatch:
    inputs:
      pass_id:
        description: Unique lowercase identifier appended to the datagen-assets release tag
        required: true
        type: string
      source_run_id:
        description: Workflow run containing the validated bank archive artifact
        required: true
        type: string
      archive_artifact:
        description: Name of the workflow artifact containing one canonical bank archive
        required: true
        type: string
      archive_name:
        description: Canonical release asset name, including .tar.gz
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: datagen-assets-${{ inputs.pass_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Download the canonical bank archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.archive_artifact }}
          path: incoming
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the archive and stage release metadata
        id: validate
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
          PASS_ID: ${{ inputs.pass_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$PASS_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARCHIVE_NAME" =~ ^[a-z0-9][a-z0-9_-]*\.tar\.gz$ ]]

          mapfile -t downloaded_files < <(find incoming -type f -print)
          [[ "${#downloaded_files[@]}" -eq 1 ]]
          [[ "${downloaded_files[0]}" == "incoming/$ARCHIVE_NAME" ]]

          uv run --frozen python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from hashlib import sha256
          from pathlib import Path

          from scripts.datagen.bank import read_v2_bank
          from phoenix.datagen.fetcher import load_asset_index

          archive_name = os.environ["ARCHIVE_NAME"]
          pass_id = os.environ["PASS_ID"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          archive = Path("incoming") / archive_name
          bank = read_v2_bank(archive)
          scenario = bank.manifest["scenario_name"]
          if archive_name != f"{scenario}.tar.gz":
              raise SystemExit(
                  f"archive name {archive_name!r} does not match scenario {scenario!r}"
              )

          archive_bytes = archive.read_bytes()
          archive_digest = sha256(archive_bytes).hexdigest()
          archive_size = len(archive_bytes)
          release_tag = f"datagen-assets-{pass_id}"
          release_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{release_tag}/{archive_name}"
          )
          archetypes = sorted({fragment.archetype for fragment in bank.fragments})
          index_path = Path("src/phoenix/datagen/assets/index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          if index.get("schema_version") != 2 or not isinstance(index.get("scenarios"), dict):
              raise SystemExit(f"invalid datagen asset index: {index_path}")
          index["scenarios"][scenario] = {
              "url": release_url,
              "sha256": archive_digest,
              "size_bytes": archive_size,
              "asset_schema_version": 2,
              "fragment_count": bank.manifest["fragment_count"],
              "archetypes": archetypes,
          }

          publication = Path("publication")
          staged_index = publication / index_path
          staged_index.parent.mkdir(parents=True, exist_ok=True)
          staged_index.write_text(json.dumps(index, indent=2, sort_keys=True) + "\n")

          entry = load_asset_index(staged_index)[scenario]
          if (
              entry.sha256 != archive_digest
              or entry.size_bytes != archive_size
              or entry.fragment_count != bank.manifest["fragment_count"]
              or entry.archetypes != tuple(archetypes)
          ):
              raise SystemExit("staged asset index does not describe the validated archive")

          quality = bank.manifest["quality_gate_summary"]
          summary_lines = [
              f"# Datagen asset generation summary: {scenario}",
              "",
              f"- Release: `{release_tag}`",
              f"- Asset: `{archive_name}`",
              f"- Source workflow run: `{source_run_id}`",
              f"- Generation revision: `{bank.manifest['generation_revision']}`",
              f"- Matrix SHA-256: `{bank.manifest['matrix_sha256']}`",
              f"- Archive SHA-256: `{archive_digest}`",
              f"- Archive bytes: `{archive_size}`",
              f"- Accepted fragments: `{quality['accepted']}`",
              f"- Rejected fragments: `{quality['rejected']}`",
              f"- Traces: `{bank.manifest['trace_count']}`",
              f"- Spans: `{bank.manifest['span_count']}`",
              f"- Archetypes: `{', '.join(archetypes)}`",
              "",
          ]
          summary_path = publication / "generation-summary.md"
          summary_path.write_text("\n".join(summary_lines), encoding="utf-8")
          (publication / "release-metadata.json").write_text(
              json.dumps(
                  {
                      "release_tag": release_tag,
                      "release_name": release_tag,
                      "asset_name": archive_name,
                      "archive_sha256": archive_digest,
                      "archive_size_bytes": archive_size,
                      "scenario_name": scenario,
                      "source_run_id": source_run_id,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"archive_path={archive}\n")
              output.write(f"index_artifact={release_tag}-index-update\n")
              output.write(f"release_tag={release_tag}\n")
              output.write(f"summary_path={summary_path}\n")
          PY

          set +e
          git diff --no-index --src-prefix=a/ --dst-prefix=b/ -- \
            src/phoenix/datagen/assets/index.json \
            publication/src/phoenix/datagen/assets/index.json \
            > publication/asset-index.patch
          diff_status=$?
          set -e
          [[ "$diff_status" -eq 1 ]]
          sed -i 's#b/publication/src/#b/src/#g' publication/asset-index.patch
          [[ -s publication/asset-index.patch ]]
          cat publication/generation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reviewable asset index update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.validate.outputs.index_artifact }}
          path: publication
          if-no-files-found: error
          retention-days: 30

      - name: Confirm the release tag is unused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          set +e
          http_status=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/datagen-release-probe.json" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 ]]; then
            echo "Unable to check release tag $RELEASE_TAG" >&2
            exit "$curl_status"
          fi
          case "$http_status" in
            200)
              echo "Release $RELEASE_TAG already exists" >&2
              exit 1
              ;;
            404)
              ;;
            *)
              echo "Release tag check returned HTTP $http_status" >&2
              cat "$RUNNER_TEMP/datagen-release-probe.json" >&2
              exit 1
              ;;
          esac

      - name: Create one plain release and upload the validated archive
        env:
          ARCHIVE_PATH: ${{ steps.validate.outputs.archive_path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          SUMMARY_PATH: ${{ steps.validate.outputs.summary_path }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$SUMMARY_PATH" \
            --latest=false
