name: Publish experimental Docker image
permissions:
  contents: read
on:
  push:
    branches:
      - version-online-evals

# One push supersedes the previous one on the same branch: the older run is
# only racing to publish a tag that the newer run will overwrite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: phoenix

jobs:
  prepare-tags:
    name: Prepare image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Compute shared tags
        id: tags
        run: |
          set -euo pipefail
          tags=$(jq -cn '{debug: ["dangerously-experimental-debug"]}')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    # linux/arm64 builds on a native ARM runner rather than under QEMU
    # emulation on x86, which is both far slower and a source of flakes.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      # One job per platform, not per variant/platform pair: the variants share
      # every stage but the final FROM, so building them together reuses the
      # frontend, backend and WASM stages from the local builder instead of
      # repeating them on a cold one. OCI artifacts let each registry publish
      # independently without rebuilding the application.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        uses: ./.github/actions/docker-build-image
        with:
          variants: debug
          platform: ${{ matrix.platform }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

  publish-dockerhub:
    name: Publish ${{ matrix.variant }} to Docker Hub
    needs: [build, prepare-tags]
    if: ${{ !cancelled() && needs.prepare-tags.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug]
    env:
      REGISTRY: arizephoenix
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Add registry namespace to shared tags
        id: tags
        env:
          TAGS: ${{ toJSON(fromJSON(needs.prepare-tags.outputs.tags)[matrix.variant]) }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<TAGS'
            jq -r --arg image "${REGISTRY}/${IMAGE_NAME}" '.[] | "\($image):\(.)"' <<< "$TAGS"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Upload images and publish Docker Hub tags
        uses: ./.github/actions/docker-publish-image
        with:
          variant: ${{ matrix.variant }}
          tags: ${{ steps.tags.outputs.tags }}
          expected-digests: 2
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

  publish-ghcr:
    name: Publish ${{ matrix.variant }} to GHCR
    permissions:
      contents: read
      packages: write
    needs: [build, prepare-tags]
    if: ${{ !cancelled() && needs.prepare-tags.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug]
    env:
      REGISTRY: ghcr.io/arize-ai
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Add registry namespace to shared tags
        id: tags
        env:
          TAGS: ${{ toJSON(fromJSON(needs.prepare-tags.outputs.tags)[matrix.variant]) }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<TAGS'
            jq -r --arg image "${REGISTRY}/${IMAGE_NAME}" '.[] | "\($image):\(.)"' <<< "$TAGS"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Upload images and publish GHCR tags
        uses: ./.github/actions/docker-publish-image
        with:
          variant: ${{ matrix.variant }}
          tags: ${{ steps.tags.outputs.tags }}
          expected-digests: 2
