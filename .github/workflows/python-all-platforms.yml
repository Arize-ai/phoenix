name: Python All Platforms
permissions:
  contents: read

on:
  schedule:
    - cron: "0 19 * * 1-5" # Weekdays at 2/3 PM EST / 7 PM UTC
  workflow_dispatch:

env:
  OPENAI_API_KEY: "sk-fake-openai-key"
  ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  discover-branches:
    name: Discover Branches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Discover main and version-* branches with open non-draft PRs
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_NAME" != "main" ]; then
            branches=$(jq -cn --arg b "$REF_NAME" '[$b]')
          else
            # A version-* branch is in the matrix only while it heads an open
            # non-draft PR. associatedPullRequests is head-only, and the names
            # come from this repository's own refs, so forks cannot enter the
            # matrix. `query` matches substrings, hence the startswith filter.
            # workflow_dispatch runs any branch on demand.
            #
            # Assign before filtering; a pipe into jq would mask a failed request.
            refs=$(gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
              query($owner: String!, $name: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  refs(refPrefix: "refs/heads/", query: "version-", first: 100, after: $endCursor) {
                    nodes { name associatedPullRequests(states: OPEN, first: 10) { nodes { isDraft } } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }')
            version_branches=$(printf '%s' "$refs" | jq -c -s '[.[].data.repository.refs.nodes[] | select(.name | startswith("version-")) | select(any(.associatedPullRequests.nodes[]; .isDraft | not)) | .name]')
            branches=$(jq -cn --argjson v "$version_branches" '["main"] + $v')
          fi
          echo "branches=$branches" >> $GITHUB_OUTPUT

  unit-tests:
    name: Unit Tests (${{ matrix.branch }}, ${{ matrix.os }}, ${{ matrix.db }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: discover-branches
    if: ${{ needs.discover-branches.outputs.branches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        db: [sqlite, postgresql]
        py: ["3.11", "3.15"]
        os: [windows-latest, macos-latest, ubuntu-latest]
        exclude:
          - os: windows-latest
            db: postgresql
          - os: macos-latest
            db: postgresql
          - os: ubuntu-latest
            py: "3.11"
            db: sqlite
          - os: ubuntu-latest
            py: "3.11"
            db: postgresql
    env:
      PHOENIX_MASK_INTERNAL_SERVER_ERRORS: "false"
      # uv installs without bytecode by default, which leaves every xdist worker to
      # compile each module it imports on first use.
      UV_COMPILE_BYTECODE: "1"
      # pytest's stdout is a block-buffered pipe on CI; unbuffered output gives each
      # line its own timestamp in the job log.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
          sparse-checkout: |
            src/phoenix/
            packages/
            evals/
            tests/unit/
            tests/conftest.py
            tests/__generated__/
            tests/__init__.py
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
      - name: Install PostgreSQL (product floor)
        if: matrix.db == 'postgresql' && runner.os == 'Linux'
        # Floor version from PGDG; see the note in python-CI.yml. The macOS
        # leg keeps the runner's Homebrew PostgreSQL, which adds incidental
        # newer-version coverage.
        run: |
          sudo apt-get -yqq install postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -yqq install postgresql-14
      - name: Sync dependencies
        run: uv sync --frozen --all-packages
      - name: Run SQLite tests
        if: matrix.db == 'sqlite'
        timeout-minutes: 90
        working-directory: tests
        run: uv run --no-sync pytest -ra --durations=20 --timeout 360 -n 4 --dist loadscope unit/
      - name: Run PostgreSQL tests
        if: matrix.db == 'postgresql'
        timeout-minutes: 90
        working-directory: tests
        run: uv run --no-sync pytest -ra --durations=20 --timeout 360 --db postgresql -n 4 --dist loadscope ${{ runner.os == 'Linux' && '--postgresql-exec /usr/lib/postgresql/14/bin/pg_ctl' || '' }} unit/

  integration-tests:
    name: Integration Tests (${{ matrix.branch }}, ${{ matrix.os }}, ${{ matrix.db }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: discover-branches
    if: ${{ needs.discover-branches.outputs.branches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        db: [sqlite, postgresql]
        py: ["3.11", "3.15"]
        os: [windows-latest, ubuntu-latest]
        exclude:
          - os: windows-latest
            db: postgresql
          - os: ubuntu-latest
            py: "3.11"
            db: sqlite
          - os: ubuntu-latest
            py: "3.11"
            db: postgresql
    env:
      CI_TEST_DB_BACKEND: ${{ matrix.db }}
      PHOENIX_MASK_INTERNAL_SERVER_ERRORS: "false"
    services:
      postgres:
        # Applying this workaround: https://github.com/actions/runner/issues/822
        image: ${{ (matrix.db == 'postgresql') && 'postgres:14' || '' }}
        env:
          POSTGRES_PASSWORD: phoenix
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
          sparse-checkout: |
            src/phoenix/
            packages/
            evals/harbor/verifiers/
            tests/integration/
            tests/__generated__/
            tests/__init__.py
      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Set up `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
      - name: Sync dependencies
        run: uv sync --frozen
      # Return the next major version in response headers so all client methods
      # work; otherwise, some may be version-gated. Avoids importing phoenix
      # (which triggers heavy deps like pandas/numpy).
      - name: Report the next major server version
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import re, pathlib
          vf = pathlib.Path("src/phoenix/version.py")
          major = int(re.search(r'"(\d+)\.', vf.read_text()).group(1))
          vf.write_text(f'__version__ = "{major + 1}.0.0"\n')
          PY
      - name: Run integration tests
        timeout-minutes: 30
        working-directory: tests/integration
        run: uv run --no-sync pytest -ra --durations=20 --reruns 5 --timeout 360 -n 4 .

  phoenix-client-non-linux:
    name: Phoenix Client (${{ matrix.branch }}, ${{ matrix.os }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: discover-branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        py: ["3.11", "3.14", "3.15"]
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
          sparse-checkout: |
            packages/
            evals/harbor/verifiers/
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
      - run: uv sync --frozen --no-editable --package arize-phoenix-client --extra pytest --extra evals --extra harbor
      - run: uv run --no-sync pyright .
        working-directory: packages/phoenix-client
      - run: uv run --no-sync mypy --strict .
        working-directory: packages/phoenix-client
      - run: uv run --no-sync pytest -ra -x tests/client
        working-directory: packages/phoenix-client

  phoenix-evals-non-linux:
    name: Phoenix Evals (${{ matrix.branch }}, ${{ matrix.os }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: discover-branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        py: ["3.11", "3.15"]
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
          sparse-checkout: |
            packages/
            evals/harbor/verifiers/
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
      - run: uv sync --frozen --no-editable --package arize-phoenix-evals --extra test
      - run: uv run --no-sync mypy .
        working-directory: packages/phoenix-evals
      - run: uv run --no-sync pytest -ra -x .
        working-directory: packages/phoenix-evals

  phoenix-otel-non-linux:
    name: Phoenix OTel (${{ matrix.branch }}, ${{ matrix.os }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    needs: discover-branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        py: ["3.11", "3.15"]
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
          sparse-checkout: |
            packages/
            evals/harbor/verifiers/
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.py }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
      - run: uv sync --frozen --no-editable --package arize-phoenix-otel --extra test
      - run: uv run --no-sync mypy .
        working-directory: packages/phoenix-otel
      - run: uv run --no-sync pytest -ra -x .
        working-directory: packages/phoenix-otel

  slack-notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [discover-branches, unit-tests, integration-tests, phoenix-client-non-linux, phoenix-evals-non-linux, phoenix-otel-non-linux]
    if: always()
    steps:
      - name: Notify success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Python tests passed\n${{ env.ACTIONS_RUN_URL }}"
            }
      - name: Notify failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨🚨🚨 PYTHON TESTS FAILED 🚨🚨🚨\n${{ env.ACTIONS_RUN_URL }}"
            }
