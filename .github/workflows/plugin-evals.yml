name: Plugin Evals

# Runs the claude plugin eval suite for the arize-phoenix Claude Code plugin
# whenever the plugin or the skill it tests changes. See
# plugins/claude/arize-phoenix/evals/README.md for the suite and its flags.

on:
  pull_request:
    paths:
      # The plugin ships these three skills as symlinks into .agents/skills/.
      - ".agents/skills/phoenix-cli/**"
      - ".agents/skills/phoenix-evals/**"
      - ".agents/skills/phoenix-tracing/**"
      - "plugins/claude/arize-phoenix/**"
      - "src/phoenix/server/mcp/skills/**"
      - "src/phoenix/server/mcp_server.py"
      - "schemas/openapi.json"
      - "evals/skill_coverage.yaml"
      - "evals/skill_regression.py"
      - "evals/report_plugin_experiment.py"
      - "evals/harbor/pxi/**"
      - "tests/unit/harbor/**"
      - "src/phoenix/server/agents/prompts/skills/**"
      - "js/app/schema.graphql"
      - ".github/workflows/plugin-evals.yml"
  workflow_dispatch:

concurrency:
  group: plugin-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Skill coverage and grader contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No model credentials: contributors and forks can validate the harness.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
      - name: Install test dependencies
        run: |
          uv sync --frozen --python 3.13
          uv pip install --override evals/harbor/environments/overrides.txt 'harbor==0.21.0' 'harbor-rewardkit==0.2.1'
      - name: Validate inventory, graders, and regression policy
        env:
          # Preserve the supplemental Harbor test tools without changing uv.lock.
          UV_NO_SYNC: "true"
        run: make skill-evals-test

  evals:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cli
            cases: "0*"
          - suite: evals
            cases: "evals-*"
          - suite: tracing
            cases: "tracing-*"
          - suite: mcp
            cases: "mcp-*"
    # Secrets are not available to forks; skip rather than fail.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"

      - name: Install subprocess isolation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Claude Code
        # Pinned so scores stay comparable; bump deliberately.
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Run eval suite
        working-directory: plugins/claude/arize-phoenix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKSPACE: ${{ github.workspace }}
        # --threshold gates the with-plugin score; Δ is gated in the next step.
        # --allow-tools: Write lets the script case create its file; the Read
        # grants let the skill open its references/ from inside the sandbox.
        run: |
          mkdir -p evals/results
          claude plugin eval . \
            --case '${{ matrix.cases }}' \
            --runs 3 \
            --trust-plugin \
            --ablation with-without \
            --json evals/results/ci-results.json \
            --threshold 0.8 \
            --model claude-sonnet-5 \
            --judge-model claude-sonnet-5 \
            --allow-tools Write \
              "Read(//${WORKSPACE}/plugins/claude/arize-phoenix/**)" \
              "Read(//${WORKSPACE}/.agents/skills/**)" \
            --no-publish \
            --max-cost-usd 25 \
            -j 3

      - name: Gate repeated grader results and calibrated uplift
        if: ${{ !cancelled() && hashFiles('plugins/claude/arize-phoenix/evals/results/ci-results.json') != '' }}
        run: >-
          uv run --no-project --with pyyaml python -m evals.skill_regression plugin
          plugins/claude/arize-phoenix/evals/results/ci-results.json
          --suite '${{ matrix.suite }}' --model claude-sonnet-5

      - name: Record Phoenix experiments
        if: ${{ !cancelled() && hashFiles('plugins/claude/arize-phoenix/evals/results/ci-results.json') != '' }}
        env:
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
        run: |
          if [ -n "$PHOENIX_COLLECTOR_ENDPOINT" ]; then
            uv run --no-project --with ./packages/phoenix-client --with pyyaml \
              python -m evals.report_plugin_experiment \
              plugins/claude/arize-phoenix/evals/results/ci-results.json \
              --suite '${{ matrix.suite }}' --model claude-sonnet-5
          else
            echo "Phoenix reporting is not configured; JSON and HTML remain CI artifacts."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-eval-results-${{ matrix.suite }}
          if-no-files-found: ignore
          path: |
            plugins/claude/arize-phoenix/evals/results/
