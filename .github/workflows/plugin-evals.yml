name: Plugin Evals

# Runs the claude plugin eval suite for the arize-phoenix Claude Code plugin
# whenever the plugin or any of the three skills it ships changes, and on
# workflow_dispatch. See plugins/claude/arize-phoenix/evals/README.md for the
# suite and its flags.
#
# One matrix leg per skill, selected with `--tag <skill>`, so a regression is
# reported per skill (and each skill gets its own cost ceiling, timeout and
# uplift gate instead of sharing one). On a PR a leg only runs when the change
# touches its skill, its cases, or shared plugin/harness files
# (evals/leg_is_affected.sh), so a phoenix-cli edit does not pay for the Opus
# phoenix-evals leg. REQUIREMENT: every case must carry its skill's tag in
# prompt.md front matter (`tags: [phoenix-evals]`, etc.). A leg whose tag matches
# no cases skips cleanly, so skills whose cases are not tagged yet are simply not
# evaluated here until they are.

on:
  pull_request:
    paths:
      # The plugin ships these three skills as symlinks into .agents/skills/.
      - ".agents/skills/phoenix-cli/**"
      - ".agents/skills/phoenix-evals/**"
      - ".agents/skills/phoenix-tracing/**"
      - "plugins/claude/arize-phoenix/**"
      - ".github/workflows/plugin-evals.yml"
  workflow_dispatch:

concurrency:
  group: plugin-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    # Secrets are not available to forks; skip rather than fail.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        # Per-skill Δ gate. `min_delta` is the minimum mean uplift over fire
        # cases; `gate: block` reds the matrix on a miss, `gate: warn` only
        # warns (use while a skill's Δ is still uncalibrated). Calibrate from a
        # 3-run `--ablation with-without` pass and record it in that skill's
        # evals README before switching a leg to `block`. `model` is the
        # agent-under-test model for that leg (the judge stays fixed); keep it
        # pinned so scores stay comparable, and bump deliberately.
        # `max_cost_usd` and `timeout_minutes` are the leg's budget: roughly 1.5x
        # a measured full run, so a slow or pricey run still finishes instead of
        # failing on a partial result. Re-measure when cases, runs or the model
        # change.
        include:
          # phoenix-cli: 0.15 headroom under its measured +0.25 baseline.
          - skill: phoenix-cli
            model: claude-sonnet-5
            min_delta: "0.15"
            gate: block
            # Measured: ~$17 per full run.
            max_cost_usd: "25"
            timeout_minutes: 40
          # phoenix-evals: held to Opus on purpose. Eval authoring (LLM-judge
          # code, pytest CI gates) is a harder task class where sonnet-5 is both
          # noisy and unreliable at a 0.8-per-case bar; Opus is stable. min_delta
          # is ~0.14 headroom under the measured +0.44 Opus baseline (one 3-run
          # pass, so wider than usual; see evals/phoenix-evals/README.md).
          - skill: phoenix-evals
            model: claude-opus-4-8
            min_delta: "0.30"
            gate: block
            # Measured: $18.93 and 27 minutes per full run.
            max_cost_usd: "30"
            timeout_minutes: 45
          # phoenix-tracing: no cases yet, so the leg skips before setup.
          # `warn` until its Δ is calibrated.
          - skill: phoenix-tracing
            model: claude-sonnet-5
            min_delta: "0.15"
            gate: warn
            max_cost_usd: "25"
            timeout_minutes: 40
    name: evals (${{ matrix.skill }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull_request checkout is the merge commit; depth 2 brings its
          # base-side parent so the next step can diff against it.
          fetch-depth: 2

      - name: Detect tagged cases
        id: detect
        env:
          SKILL: ${{ matrix.skill }}
          EVENT_NAME: ${{ github.event_name }}
        # A leg only runs if at least one case carries this skill's tag in its
        # prompt.md front matter (inline list form, e.g. `tags: [phoenix-evals]`)
        # and, on a PR, the change affects this skill. Skills whose cases are not
        # tagged yet — or not built yet — are skipped rather than failing the run
        # on a zero-match tag. workflow_dispatch runs every leg that has cases.
        # The output keeps the name `has_cases` so later steps gate on one flag.
        run: |
          if ! grep -rqsE "^tags:.*\b${SKILL}\b" plugins/claude/arize-phoenix/evals --include=prompt.md; then
            echo "has_cases=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::no cases tagged '${SKILL}' found under evals/; skipping this leg"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "$(git diff --name-only HEAD^1 HEAD \
              | plugins/claude/arize-phoenix/evals/leg_is_affected.sh "${SKILL}")" = "false" ]; then
            echo "has_cases=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::this change does not touch '${SKILL}' or shared plugin files; skipping this leg"
            exit 0
          fi
          echo "has_cases=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node
        if: steps.detect.outputs.has_cases == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install subprocess isolation deps
        if: steps.detect.outputs.has_cases == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Claude Code
        if: steps.detect.outputs.has_cases == 'true'
        # Pinned so scores stay comparable; bump deliberately.
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Run eval suite
        if: steps.detect.outputs.has_cases == 'true'
        working-directory: plugins/claude/arize-phoenix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKSPACE: ${{ github.workspace }}
          SKILL: ${{ matrix.skill }}
          MODEL: ${{ matrix.model }}
          MAX_COST_USD: ${{ matrix.max_cost_usd }}
        # --tag selects this skill's cases. --threshold gates each with-plugin
        # score; Δ is gated in the next step. --allow-tools: Write lets a
        # file-writing case create its file; the Read grants let the skill open
        # its references/ from inside the sandbox. --max-cost-usd comes from the
        # leg's matrix entry so one suite can't starve another's budget.
        run: |
          mkdir -p evals/results
          claude plugin eval . \
            --tag "${SKILL}" \
            --trust-plugin \
            --ablation with-without \
            --json evals/results/ci-results.json \
            --threshold 0.8 \
            --model "${MODEL}" \
            --judge-model claude-sonnet-5 \
            --allow-tools Write \
              "Read(//${WORKSPACE}/plugins/claude/arize-phoenix/**)" \
              "Read(//${WORKSPACE}/.agents/skills/**)" \
            --no-publish \
            --max-cost-usd "${MAX_COST_USD}" \
            -j 3

      - name: Gate on uplift (Δ)
        if: steps.detect.outputs.has_cases == 'true'
        working-directory: plugins/claude/arize-phoenix
        # Δ = with-plugin score minus without-plugin score. Should-not-fire
        # cases (neg-*) score 1.0 in both arms by design, so they are left out
        # of the mean. MIN_DELTA is per skill (set in the matrix) and leaves
        # room for run-to-run noise while catching a real drop; GATE_MODE is
        # `block` (red the matrix on a miss) or `warn` (print a warning only,
        # for an uncalibrated skill). A tag that matched no (fire) cases skips
        # the gate so an untagged or not-yet-built skill does not red the matrix.
        env:
          MIN_DELTA: ${{ matrix.min_delta }}
          GATE_MODE: ${{ matrix.gate }}
        run: |
          if [ ! -s evals/results/ci-results.json ]; then
            echo "no results for tag '${{ matrix.skill }}' (no cases matched); skipping Δ gate"
            exit 0
          fi
          fire_count=$(jq '[.cases[] | select(.name | test("-neg-") | not)] | length' \
            evals/results/ci-results.json)
          if [ "${fire_count}" -eq 0 ]; then
            echo "no fire cases for tag '${{ matrix.skill }}'; skipping Δ gate"
            exit 0
          fi
          printf 'case\twith\twithout\tdelta\n' > /tmp/delta-table.tsv
          jq -r '.cases[] | "\(.name)\t\(.aggregates.score)\t\(.aggregates.scoreWithout)\t\(.aggregates.delta)"' \
            evals/results/ci-results.json >> /tmp/delta-table.tsv
          column -t -s $'\t' /tmp/delta-table.tsv
          delta=$(jq -r '[.cases[] | select(.name | test("-neg-") | not) | .aggregates.delta] | add / length' \
            evals/results/ci-results.json)
          echo "mean Δ over fire cases for '${{ matrix.skill }}': ${delta} (minimum ${MIN_DELTA}, gate ${GATE_MODE})"
          if awk -v d="${delta}" -v m="${MIN_DELTA}" 'BEGIN { exit !(d+0 >= m+0) }'; then
            echo "Δ gate passed for ${{ matrix.skill }}"
          elif [ "${GATE_MODE}" = "warn" ]; then
            echo "::warning::mean Δ ${delta} for ${{ matrix.skill }} is below ${MIN_DELTA}; gate is 'warn' (uncalibrated), not failing"
          else
            echo "::error::mean Δ ${delta} for ${{ matrix.skill }} is below ${MIN_DELTA}; the plugin adds less uplift than it used to"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-eval-results-${{ matrix.skill }}
          if-no-files-found: ignore
          path: |
            plugins/claude/arize-phoenix/evals/results/ci-results.json
            plugins/claude/arize-phoenix/evals/results/**/report.html
