name: Storybook CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - version-*
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: test-storybook-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            storybook:
              - "js/app/stories/**"
              - "js/app/.storybook/**"
              - "js/app/src/components/**"
              - "js/app/scripts/lint-storybook.ts"

  lint:
    name: Lint Storybook
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.storybook == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache-dependency-path: ./js/pnpm-lock.yaml
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile
      - name: Lint Storybook
        working-directory: ./js/app
        run: pnpm run lint:storybook
