name: Build arize-phoenix-sqlean wheels

# Called by build-sqlean in publish.yaml and wheels in phoenix-sqlean-ci.yml, so
# a PR runs the build a release runs, from source preparation on.
# cibuildwheel.toml carries the settings; the runners and layout they depend on
# live here.

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build. Empty builds the caller's commit.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Once, on Ubuntu: the Makefile needs make, curl and unzip, which the
  # Windows runners lack. The build legs get the result as an artifact.
  sources:
    name: Prepare sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Download SQLite and sqlean extension sources
        working-directory: packages/phoenix-sqlean
        run: make prepare-src download-sqlite download-sqlean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arize-phoenix-sqlean-sources
          path: packages/phoenix-sqlean
          retention-days: 7

  build:
    name: ${{ matrix.os }}
    needs: sources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One runner per Linux and Windows arch; see archs in cibuildwheel.toml.
        # PLATFORMS in scripts/check-wheelhouse.py must match.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      # Workspace root: cibuildwheel resolves test-sources against its cwd, not
      # package-dir.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arize-phoenix-sqlean-sources
      - name: Build wheels
        # Must be >= v3.4.0: earlier releases reference actions/setup-python@v6
        # inside their own action.yml, and this org rejects unpinned actions
        # transitively, so the job fails while preparing actions.
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          config-file: cibuildwheel.toml
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
      # One runner only: identical sdists from several would collide when the
      # artifacts merge.
      - name: Build sdist
        if: matrix.os == 'ubuntu-latest'
        run: pipx run build==1.5.0 --sdist --outdir wheelhouse .
      # Short retention: both callers consume these within the same run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arize-phoenix-sqlean-dist-${{ matrix.os }}
          path: wheelhouse/
          retention-days: 7

  check:
    name: Check wheelhouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The script comes from the caller's commit, like the runners PLATFORMS
      # must match; python_requires comes from the sources being built, which
      # for publish is a release tag that may predate the script.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: packages/phoenix-sqlean/scripts/check-wheelhouse.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arize-phoenix-sqlean-sources
          path: sources
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: arize-phoenix-sqlean-dist-*
          path: dist
          merge-multiple: true
      - name: Check the distribution set against python_requires
        run: python3 packages/phoenix-sqlean/scripts/check-wheelhouse.py sources/setup.py dist
