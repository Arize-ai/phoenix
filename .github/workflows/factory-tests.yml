name: Factory Tests

# dispatch.py has no coverage from the Python CI workflow, which runs pytest under tests/
# and packages/ only, so its regression tests run here on every change under factory/.
on:
  pull_request:
    paths: [factory/**, .github/workflows/factory-tests.yml]
  push:
    branches: [main]
    paths: [factory/**, .github/workflows/factory-tests.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      # The same pins as factory-dispatch.yml, which is what runs dispatch.py.
      - name: Install the Anthropic SDK and PyJWT
        run: pip install --quiet "anthropic==1.12.1" "PyJWT[crypto]==2.15.1"
      - name: Run the factory tests
        run: python -m unittest discover -s factory -v
