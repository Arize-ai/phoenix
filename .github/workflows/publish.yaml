on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: >-
          Publish a SHA-based dev preview from this branch instead of running
          the release flow. Leave empty to run the normal production release.
        required: false
        type: string
        default: ""

name: Publish Python packages

# This workflow has two modes, both dispatched manually:
#   - Release (feature_branch empty): the production flow — build from
#     release-please tags and publish final versions to PyPI.
#   - Preview (feature_branch set): publish PEP 440 development (dev) pre-releases
#     for the packages changed on that branch (relative to main). Dev builds are
#     stamped from the branch head commit SHA (<version>.dev<int(sha[:7], 16)>), so
#     each commit maps to one deterministic version and pip ignores them unless
#     explicitly requested (--pre or an exact pinned version).
#
# Both modes publish through the SAME PyPI Trusted Publishers — this workflow
# file plus the `pypi` (arize-phoenix) and `pypi/<package>` environments — so
# previews need no extra PyPI or GitHub environment configuration.

concurrency:
  group: ${{ github.workflow }}-${{ inputs.feature_branch || github.run_id }}
  cancel-in-progress: ${{ inputs.feature_branch != '' }}

permissions:
  contents: read

jobs:
  list-python-packages:
    name: List Python packages from manifest
    if: ${{ inputs.feature_branch == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phoenix_path: ${{ steps.paths.outputs.phoenix_path }}
      package_paths: ${{ steps.paths.outputs.package_paths }}
      expected: ${{ steps.paths.outputs.expected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .release-please-manifest.json
            release-please-config.json
          sparse-checkout-cone-mode: false
      - name: Get paths not yet on PyPI
        id: paths
        run: |
          NEED_PHOENIX=''
          NEED_PACKAGES='[]'
          EXPECTED='[]'
          for path in $(jq -r 'keys[]' .release-please-manifest.json); do
            [ -z "$path" ] && continue
            NAME=$(jq -r --arg p "$path" '.packages[$p]["package-name"] // empty' release-please-config.json)
            VERSION=$(jq -r --arg p "$path" '.[$p]' .release-please-manifest.json)
            if [ -z "$NAME" ] || [ "$VERSION" = "null" ] || [ -z "$VERSION" ]; then
              echo "Including $path (name or version missing)"
              [ "$VERSION" = "null" ] && VERSION=''
              if [ "$path" = "." ]; then NEED_PHOENIX='.'; else NEED_PACKAGES=$(jq -c --arg p "$path" '. + [$p]' <<< "$NEED_PACKAGES"); fi
              EXPECTED=$(jq -c --arg p "$path" --arg n "$NAME" --arg v "$VERSION" '. + [{path: $p, name: $n, version: $v}]' <<< "$EXPECTED")
              continue
            fi
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${NAME}/${VERSION}/json")
            if [ "$HTTP" != "200" ]; then
              echo "${NAME}==${VERSION} not on PyPI (HTTP ${HTTP}), will publish"
              if [ "$path" = "." ]; then
                NEED_PHOENIX='.'
              else
                NEED_PACKAGES=$(jq -c --arg p "$path" '. + [$p]' <<< "$NEED_PACKAGES")
              fi
              EXPECTED=$(jq -c --arg p "$path" --arg n "$NAME" --arg v "$VERSION" '. + [{path: $p, name: $n, version: $v}]' <<< "$EXPECTED")
            else
              echo "${NAME}==${VERSION} already on PyPI, skipping"
            fi
          done
          {
            echo "phoenix_path=$NEED_PHOENIX"
            echo "package_paths=$NEED_PACKAGES"
            echo "expected=$EXPECTED"
          } >> "$GITHUB_OUTPUT"
          echo "Phoenix path: $NEED_PHOENIX"
          echo "Package paths: $NEED_PACKAGES"
          echo "Expected: $EXPECTED"

  build-phoenix:
    name: Build Phoenix (main package)
    runs-on: ubuntu-latest
    needs: list-python-packages
    if: needs.list-python-packages.outputs.phoenix_path == '.'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read version from manifest
        id: version
        run: |
          v=$(jq -r '.["."] // empty' .release-please-manifest.json)
          if [ -z "$v" ]; then echo "::error::No version for root (.) in manifest"; exit 1; fi
          echo "version=$v" >> $GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/tags/arize-phoenix-v${{ steps.version.outputs.version }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - name: Build frontend
        working-directory: ./js
        run: pnpm install --frozen-lockfile && pnpm --filter 'phoenix-ui...' run build
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.10"
          version: "0.12.1"
      - name: Build distribution
        run: rm -rf dist && uv build
      - name: Verify bundled UI assets in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              print("No wheel found in dist/")
              sys.exit(1)
          wheel = wheels[0]
          with ZipFile(wheel) as zf:
              names = set(zf.namelist())

          has_manifest = "phoenix/server/static/.vite/manifest.json" in names
          has_js_asset = any(
              name.startswith("phoenix/server/static/assets/") and name.endswith(".js")
              for name in names
          )
          if not has_manifest or not has_js_asset:
              print(f"Wheel missing required frontend bundle files: {wheel}")
              print(f"  has manifest: {has_manifest}")
              print(f"  has js asset: {has_js_asset}")
              sys.exit(1)
          print(f"Verified bundled UI assets in {wheel.name}")
          PY
      - name: Check wheel contents
        run: uv run --with check-wheel-contents check-wheel-contents --ignore W004 dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phoenix-dist
          path: dist/

  publish-phoenix:
    name: Publish Phoenix (main package)
    runs-on: ubuntu-latest
    needs: [build-phoenix, publish-packages]
    # `!cancelled()` suppresses the success() that GitHub otherwise prepends to a
    # job `if:`, so the build gate has to be spelled out. `!= 'failure'` rather
    # than `== 'success'` because publish-packages is skipped on a release that
    # ships only the root package, and succeeds when every matrix leg skips.
    if: ${{ !cancelled() && needs.build-phoenix.result == 'success' && needs.publish-packages.result != 'failure' }}
    environment:
      name: pypi
      url: https://pypi.org/p/arize-phoenix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phoenix-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build-packages:
    name: Build Python packages
    runs-on: ubuntu-latest
    needs: list-python-packages
    if: needs.list-python-packages.outputs.package_paths != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: packages/phoenix-client
            package_name: arize-phoenix-client
          - path: packages/phoenix-evals
            package_name: arize-phoenix-evals
          - path: packages/phoenix-otel
            package_name: arize-phoenix-otel
    steps:
      - name: Check if package needs building
        id: check
        env:
          PACKAGE_PATHS: ${{ needs.list-python-packages.outputs.package_paths }}
          MATRIX_PATH: ${{ matrix.path }}
        run: |
          if echo "$PACKAGE_PATHS" | jq -e --arg p "$MATRIX_PATH" 'index($p)' > /dev/null 2>&1; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping $MATRIX_PATH — already on PyPI"
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.needed == 'true'
        with:
          persist-credentials: false
      - name: Resolve ref from manifest
        if: steps.check.outputs.needed == 'true'
        id: ref
        run: |
          VERSION=$(jq -r --arg p "${{ matrix.path }}" '.[$p] // empty' .release-please-manifest.json)
          NAME=$(jq -r --arg p "${{ matrix.path }}" '.packages[$p]["package-name"] // empty' release-please-config.json)
          if [ -z "$VERSION" ] || [ -z "$NAME" ]; then
            echo "::error::Missing version or package-name for path ${{ matrix.path }}"
            exit 1
          fi
          echo "ref=refs/tags/${NAME}-v${VERSION}" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.needed == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.10"
          version: "0.12.1"
      - run: uv build
        if: steps.check.outputs.needed == 'true'
        working-directory: ${{ matrix.path }}
      - run: uv run --with check-wheel-contents check-wheel-contents dist/*.whl
        if: steps.check.outputs.needed == 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check.outputs.needed == 'true'
        with:
          name: ${{ matrix.package_name }}-dist
          path: dist/

  publish-packages:
    name: Publish Python packages
    runs-on: ubuntu-latest
    needs: [list-python-packages, build-packages]
    if: needs.build-packages.result == 'success'
    environment:
      name: ${{ matrix.environment_name }}
      url: https://pypi.org/p/${{ matrix.package_name }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: packages/phoenix-client
            package_name: arize-phoenix-client
            environment_name: pypi/arize-phoenix-client
          - path: packages/phoenix-evals
            package_name: arize-phoenix-evals
            environment_name: pypi/arize-phoenix-evals
          - path: packages/phoenix-otel
            package_name: arize-phoenix-otel
            environment_name: pypi/arize-phoenix-otel
    steps:
      - name: Check if package needs publishing
        id: check
        env:
          PACKAGE_PATHS: ${{ needs.list-python-packages.outputs.package_paths }}
          MATRIX_PATH: ${{ matrix.path }}
        run: |
          if echo "$PACKAGE_PATHS" | jq -e --arg p "$MATRIX_PATH" 'index($p)' > /dev/null 2>&1; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.check.outputs.needed == 'true'
        with:
          name: ${{ matrix.package_name }}-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.check.outputs.needed == 'true'

  # arize-phoenix-sqlean is a vendored C extension (fork of nalgeon/sqlean.py),
  # so it cannot go through the pure-Python `uv build` matrix above: wheels are
  # compiled per platform and interpreter with cibuildwheel. Source preparation
  # (downloading the SQLite amalgamation and sqlean extension sources that the
  # sdist bundles) runs once on Ubuntu and is handed to the build legs as an
  # artifact, because the Makefile needs make/curl/unzip, which the Windows
  # runner does not provide.
  sqlean-sources:
    name: Prepare arize-phoenix-sqlean sources
    runs-on: ubuntu-latest
    needs: list-python-packages
    if: contains(fromJSON(needs.list-python-packages.outputs.package_paths), 'packages/phoenix-sqlean')
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.ref.outputs.needed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve ref from manifest
        id: ref
        run: |
          VERSION=$(jq -r '.["packages/phoenix-sqlean"] // empty' .release-please-manifest.json)
          if [ -z "$VERSION" ]; then
            echo "::error::Missing version for packages/phoenix-sqlean in manifest"
            exit 1
          fi
          TAG="arize-phoenix-sqlean-v${VERSION}"
          # Until release-please creates the first release of this package, the
          # manifest version has no tag — skip instead of failing the run.
          if git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "ref=refs/tags/${TAG}" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} does not exist yet; skipping arize-phoenix-sqlean"
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.ref.outputs.needed == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}
      - name: Download SQLite and sqlean extension sources
        if: steps.ref.outputs.needed == 'true'
        working-directory: packages/phoenix-sqlean
        run: make prepare-src download-sqlite download-sqlean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.ref.outputs.needed == 'true'
        with:
          name: arize-phoenix-sqlean-sources
          path: packages/phoenix-sqlean

  # phoenix-sqlean-ci.yml calls the same workflow, so a PR runs this build. No
  # cibw-* overrides here: the shipped matrix is cibuildwheel.toml's business.
  build-sqlean:
    name: Build arize-phoenix-sqlean
    needs: sqlean-sources
    if: needs.sqlean-sources.result == 'success' && needs.sqlean-sources.outputs.needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/phoenix-sqlean-build.yml
    with:
      sources-artifact: arize-phoenix-sqlean-sources
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]'
      dist-artifact-prefix: arize-phoenix-sqlean-dist

  publish-sqlean:
    name: Publish arize-phoenix-sqlean
    runs-on: ubuntu-latest
    needs: build-sqlean
    if: needs.build-sqlean.result == 'success'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: arize-phoenix-sqlean-dist-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  trigger-version-updates:
    name: Trigger dependency updates
    runs-on: ubuntu-latest
    needs: [list-python-packages, publish-packages]
    if: needs.publish-packages.result == 'success'
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: packages/phoenix-client
            package_name: arize-phoenix-client
          - path: packages/phoenix-evals
            package_name: arize-phoenix-evals
          - path: packages/phoenix-otel
            package_name: arize-phoenix-otel
    steps:
      - name: Check if package was published
        id: check
        env:
          PACKAGE_PATHS: ${{ needs.list-python-packages.outputs.package_paths }}
          MATRIX_PATH: ${{ matrix.path }}
        run: |
          if echo "$PACKAGE_PATHS" | jq -e --arg p "$MATRIX_PATH" 'index($p)' > /dev/null 2>&1; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.needed == 'true'
        with:
          persist-credentials: false
          sparse-checkout: .release-please-manifest.json
          sparse-checkout-cone-mode: false
      - name: Trigger dependency update workflow
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_PATH: ${{ matrix.path }}
          PACKAGE_NAME: ${{ matrix.package_name }}
        run: |
          VERSION=$(jq -r --arg p "$MATRIX_PATH" '.[$p] // empty' .release-please-manifest.json)
          if [ -z "$VERSION" ]; then
            echo "::error::No version for $MATRIX_PATH in .release-please-manifest.json"
            exit 1
          fi
          gh workflow run update-phoenix-package-versions.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field package="$PACKAGE_NAME" \
            --field version="$VERSION"

  slack:
    name: Publication report
    # A publish job concluding `success` never means its packages shipped: every
    # leg of the matrix can skip via `needed=false` and still aggregate to
    # success, and a publish job gated on its build is left *skipped* rather
    # than failed when that build breaks. The report therefore asks PyPI which
    # exact versions are actually there, and uses job conclusions only to say
    # where an unpublished package got stuck.
    needs:
      - list-python-packages
      - build-phoenix
      - publish-phoenix
      - build-packages
      - publish-packages
      - sqlean-sources
      - build-sqlean
      - publish-sqlean
      - trigger-version-updates
    if: ${{ always() && inputs.feature_branch == '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm expected versions on PyPI
        id: notify
        env:
          EXPECTED: ${{ needs.list-python-packages.outputs.expected }}
          LIST_RESULT: ${{ needs.list-python-packages.result }}
          SQLEAN_SOURCES_RESULT: ${{ needs.sqlean-sources.result }}
          SQLEAN_NEEDED: ${{ needs.sqlean-sources.outputs.needed }}
          PHOENIX_RESULT: ${{ needs.publish-phoenix.result }}
          PACKAGES_RESULT: ${{ needs.publish-packages.result }}
          SQLEAN_RESULT: ${{ needs.publish-sqlean.result }}
          ANY_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE=indeterminate
          DETAIL=''
          CONFIRMED=''
          UNCONFIRMED=''
          if [ "$LIST_RESULT" != "success" ]; then
            DETAIL="list-python-packages did not complete (result: ${LIST_RESULT})"
          elif ! jq -e 'type == "array"' > /dev/null 2>&1 <<< "$EXPECTED"; then
            DETAIL="the expected-package list is missing or unparseable"
          else
            # arize-phoenix-sqlean has no release tag until release-please cuts its
            # first release, and skipping it then is not a partial train. Keep it
            # expected when the job that answers that question did not succeed.
            EXPECTED=$(jq -c --arg needed "$SQLEAN_NEEDED" --arg sources "$SQLEAN_SOURCES_RESULT" \
              '[.[] | select(.path != "packages/phoenix-sqlean" or $needed == "true" or $sources != "success")]' <<< "$EXPECTED")
            if [ "$(jq -r 'length' <<< "$EXPECTED")" -eq 0 ]; then
              STATE=nothing-expected
            else
              for i in $(jq -r 'to_entries[].key' <<< "$EXPECTED"); do
                PKG_PATH=$(jq -r --argjson i "$i" '.[$i].path' <<< "$EXPECTED")
                NAME=$(jq -r --argjson i "$i" '.[$i].name' <<< "$EXPECTED")
                VERSION=$(jq -r --argjson i "$i" '.[$i].version' <<< "$EXPECTED")
                case "$PKG_PATH" in
                  .) WHERE="publish-phoenix: ${PHOENIX_RESULT}" ;;
                  packages/phoenix-sqlean) WHERE="publish-sqlean: ${SQLEAN_RESULT}" ;;
                  *) WHERE="publish-packages: ${PACKAGES_RESULT}" ;;
                esac
                if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
                  UNCONFIRMED="${UNCONFIRMED}- ${PKG_PATH}: no package name or version in the release manifest (${WHERE})"$'\n'
                  continue
                fi
                HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${NAME}/${VERSION}/json")
                if [ "$HTTP" = "200" ]; then
                  CONFIRMED="${CONFIRMED}- ${NAME}==${VERSION}"$'\n'
                else
                  UNCONFIRMED="${UNCONFIRMED}- ${NAME}==${VERSION}: not on PyPI (HTTP ${HTTP}) (${WHERE})"$'\n'
                fi
              done
              if [ -z "$UNCONFIRMED" ]; then STATE=success; else STATE=partial; fi
            fi
          fi

          case "$STATE" in
            success) HEADLINE="PYPI Publication Succeeded" ;;
            partial)
              if [ "$ANY_FAILURE" = "true" ]; then
                HEADLINE="🚨🚨🚨 PYPI Publication Failed 🚨🚨🚨"
              else
                HEADLINE="🚨🚨🚨 PYPI Publication Incomplete 🚨🚨🚨"
              fi
              ;;
            indeterminate) HEADLINE="🚨🚨🚨 PYPI Publication Report Unavailable 🚨🚨🚨" ;;
            nothing-expected) HEADLINE="No packages were expected to publish" ;;
          esac

          NOTE=''
          if [ "$STATE" = "success" ] && [ "$ANY_FAILURE" = "true" ]; then
            NOTE="Every expected version published, but a job in this run failed."
          fi
          if [ "$STATE" = "indeterminate" ]; then
            NOTE="${DETAIL}. Job conclusions — publish-phoenix: ${PHOENIX_RESULT}, publish-packages: ${PACKAGES_RESULT}, publish-sqlean: ${SQLEAN_RESULT}."
          fi

          {
            echo "## ${HEADLINE}"
            echo ""
            if [ -n "$NOTE" ]; then
              echo "$NOTE"
              echo ""
            fi
            if [ -n "$CONFIRMED" ]; then
              echo "Confirmed on PyPI:"
              echo ""
              printf '%s\n' "$CONFIRMED"
            fi
            if [ -n "$UNCONFIRMED" ]; then
              echo "Not confirmed on PyPI:"
              echo ""
              printf '%s\n' "$UNCONFIRMED"
            fi
            echo "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATE" != "nothing-expected" ]; then
            {
              echo "text<<EOF"
              echo "$HEADLINE"
              if [ -n "$NOTE" ]; then
                echo "$NOTE"
              fi
              if [ -n "$UNCONFIRMED" ]; then
                printf 'Not confirmed on PyPI:\n%s' "$UNCONFIRMED"
              fi
              echo "$RUN_URL"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Send message to Slack
        if: steps.notify.outputs.text != ''
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "type": "mrkdwn",
              "text": ${{ toJSON(steps.notify.outputs.text) }}
            }

  # ---------------------------------------------------------------------------
  # Feature-branch preview flow — runs only when `feature_branch` is set. Builds
  # dev pre-releases for the packages changed on that branch (vs main), stamped
  # from the branch head SHA, and publishes via the same Trusted Publishers.
  # ---------------------------------------------------------------------------

  preview-changes:
    name: Detect changed packages (preview)
    if: ${{ inputs.feature_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      main: ${{ steps.filter.outputs.main }}
      phoenix-client: ${{ steps.filter.outputs.phoenix-client }}
      phoenix-evals: ${{ steps.filter.outputs.phoenix-evals }}
      phoenix-otel: ${{ steps.filter.outputs.phoenix-otel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.feature_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve branch head SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: main
          # Diff against the dispatched feature branch, not the branch the
          # workflow file was dispatched from (which is what paths-filter uses
          # by default when `ref` is omitted).
          ref: ${{ inputs.feature_branch }}
          filters: |
            main:
              - 'src/phoenix/**'
              - 'js/app/src/**'
              - 'pyproject.toml'
              - 'packages/**'
            phoenix-client:
              - 'packages/phoenix-client/**'
            phoenix-evals:
              - 'packages/phoenix-evals/**'
            phoenix-otel:
              - 'packages/phoenix-otel/**'

  preview-phoenix:
    name: Preview publish arize-phoenix (PyPI dev)
    needs: preview-changes
    if: ${{ needs.preview-changes.outputs.main == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arize-phoenix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pin to the exact commit detected by preview-changes so the build and
          # the version suffix always refer to the same SHA, even if the branch
          # advances mid-run.
          ref: ${{ needs.preview-changes.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22
      - name: Build frontend
        working-directory: ./js
        run: pnpm install --frozen-lockfile && pnpm --filter 'phoenix-ui...' run build
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.10"
          version: "0.12.1"
          enable-cache: false
      - name: Stamp dev version
        env:
          HEAD_SHA: ${{ needs.preview-changes.outputs.sha }}
          PYPROJECT_PATH: pyproject.toml
          SELF_NAME: arize-phoenix
          CLIENT_CHANGED: ${{ needs.preview-changes.outputs['phoenix-client'] }}
          EVALS_CHANGED: ${{ needs.preview-changes.outputs['phoenix-evals'] }}
          OTEL_CHANGED: ${{ needs.preview-changes.outputs['phoenix-otel'] }}
        run: |
          python - <<'PY'
          import os, re, sys

          SIBLINGS = {
              "arize-phoenix-client": ("packages/phoenix-client/pyproject.toml", "CLIENT_CHANGED"),
              "arize-phoenix-evals": ("packages/phoenix-evals/pyproject.toml", "EVALS_CHANGED"),
              "arize-phoenix-otel": ("packages/phoenix-otel/pyproject.toml", "OTEL_CHANGED"),
          }

          def canon(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          suffix = int(os.environ["HEAD_SHA"][:7], 16)
          me = canon(os.environ["SELF_NAME"])

          path = "src/phoenix/version.py"
          content = open(path).read()
          new = re.sub(
              r'(__version__ = ")([^"]+)(")',
              lambda m: f'{m.group(1)}{m.group(2)}.dev{suffix}{m.group(3)}',
              content,
          )
          open(path, "w").write(new)

          # Every preview job stamps from the same head SHA, so each one can derive
          # its siblings' dev versions itself. Pinning them is what makes the wheel
          # installable as a set: [tool.uv.sources] workspace linkage is uv-local
          # and never reaches wheel metadata, so an unpinned floor is satisfied by
          # the stable release and the dev sibling is simply never selected.
          version_re = re.compile(r'(?m)^version = "([^"]+)"')
          dev = {}
          for name, (manifest, changed) in SIBLINGS.items():
              if os.environ.get(changed) != "true" or canon(name) == me:
                  continue
              found = version_re.search(open(manifest).read())
              if not found:
                  sys.exit(f"::error::No version key in {manifest}")
              dev[canon(name)] = f"{found.group(1)}.dev{suffix}"

          path = os.environ["PYPROJECT_PATH"]
          lines = open(path).read().split("\n")
          string_re = re.compile(r"\"[^\"]*\"|'[^']*'")
          req_re = re.compile(
              r"\"([A-Za-z0-9][A-Za-z0-9._-]*)(\[[^\]\"]*\])?([^\"]*)\""
              r"|'([A-Za-z0-9][A-Za-z0-9._-]*)(\[[^\]']*\])?([^']*)'"
          )
          rewrites = {c: 0 for c in dev}

          def pin(match):
              double = match.group(1) is not None
              quote = '"' if double else "'"
              name = match.group(1) if double else match.group(4)
              extras = (match.group(2) if double else match.group(5)) or ""
              rest = (match.group(3) if double else match.group(6)) or ""
              target = dev.get(canon(name))
              if target is None:
                  return match.group(0)
              rewrites[canon(name)] += 1
              marker = ";" + rest.split(";", 1)[1] if ";" in rest else ""
              return f"{quote}{name}{extras}=={target}{marker}{quote}"

          # Only PEP 621 requirement lists are rewritten; [tool.uv] names these
          # packages too and its entries are not dependency specifiers.
          table, key, depth, scanned = "", None, 0, []
          for i, line in enumerate(lines):
              header = re.match(r"\s*\[([^\]]+)\]\s*$", line)
              if header:
                  table, key, depth = header.group(1), None, 0
                  continue
              bare = string_re.sub("", line)
              if depth == 0:
                  assign = re.match(r"\s*([A-Za-z0-9_.\"'-]+)\s*=", line)
                  key = assign.group(1) if assign else key
              if table.startswith("project"):
                  scanned.append(line)
                  requirements = table == "project.optional-dependencies" or (
                      table == "project" and key == "dependencies"
                  )
                  if requirements and (depth > 0 or "[" in bare):
                      lines[i] = req_re.sub(pin, line)
              depth = max(0, depth + bare.count("[") - bare.count("]"))

          quoted = string_re.findall("\n".join(scanned))
          for name in SIBLINGS:
              if canon(name) not in dev:
                  continue
              boundary = rf"(?<![A-Za-z0-9._-]){re.escape(name)}(?![A-Za-z0-9._-])"
              declared = sum(1 for q in quoted if re.search(boundary, q))
              if declared != rewrites[canon(name)]:
                  sys.exit(
                      f"::error::{path} declares {name} in a form this step cannot "
                      f"rewrite ({declared} declared, {rewrites[canon(name)]} rewritten)"
                  )
              if rewrites[canon(name)]:
                  print(f"Pinned {name} to {dev[canon(name)]} in {path}")

          open(path, "w").write("\n".join(lines))
          PY
      - name: Build distribution
        run: rm -rf dist && uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  preview-packages:
    name: Preview publish ${{ matrix.package_name }} (PyPI dev)
    needs: preview-changes
    if: ${{ needs.preview-changes.outputs['phoenix-client'] == 'true' || needs.preview-changes.outputs['phoenix-evals'] == 'true' || needs.preview-changes.outputs['phoenix-otel'] == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment_name }}
      url: https://pypi.org/p/${{ matrix.package_name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: packages/phoenix-client
            package_name: arize-phoenix-client
            environment_name: pypi/arize-phoenix-client
            changed_output: phoenix-client
          - path: packages/phoenix-evals
            package_name: arize-phoenix-evals
            environment_name: pypi/arize-phoenix-evals
            changed_output: phoenix-evals
          - path: packages/phoenix-otel
            package_name: arize-phoenix-otel
            environment_name: pypi/arize-phoenix-otel
            changed_output: phoenix-otel
    steps:
      - name: Check if package changed
        id: check
        env:
          CHANGED: ${{ needs.preview-changes.outputs[matrix.changed_output] }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.needed == 'true'
        with:
          # Pin to the exact commit detected by preview-changes (see preview-phoenix).
          ref: ${{ needs.preview-changes.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.10"
          version: "0.12.1"
          enable-cache: false
      - name: Stamp dev version
        if: steps.check.outputs.needed == 'true'
        env:
          PYPROJECT_PATH: ${{ matrix.path }}/pyproject.toml
          HEAD_SHA: ${{ needs.preview-changes.outputs.sha }}
          SELF_NAME: ${{ matrix.package_name }}
          CLIENT_CHANGED: ${{ needs.preview-changes.outputs['phoenix-client'] }}
          EVALS_CHANGED: ${{ needs.preview-changes.outputs['phoenix-evals'] }}
          OTEL_CHANGED: ${{ needs.preview-changes.outputs['phoenix-otel'] }}
        run: |
          python - <<'PY'
          import os, re, sys

          SIBLINGS = {
              "arize-phoenix-client": ("packages/phoenix-client/pyproject.toml", "CLIENT_CHANGED"),
              "arize-phoenix-evals": ("packages/phoenix-evals/pyproject.toml", "EVALS_CHANGED"),
              "arize-phoenix-otel": ("packages/phoenix-otel/pyproject.toml", "OTEL_CHANGED"),
          }

          def canon(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          suffix = int(os.environ["HEAD_SHA"][:7], 16)
          me = canon(os.environ["SELF_NAME"])

          # Sibling base versions are read before this package's own manifest is
          # stamped, and never include this package, so no version is suffixed twice.
          version_re = re.compile(r'(?m)^version = "([^"]+)"')
          dev = {}
          for name, (manifest, changed) in SIBLINGS.items():
              if os.environ.get(changed) != "true" or canon(name) == me:
                  continue
              found = version_re.search(open(manifest).read())
              if not found:
                  sys.exit(f"::error::No version key in {manifest}")
              dev[canon(name)] = f"{found.group(1)}.dev{suffix}"

          path = os.environ["PYPROJECT_PATH"]
          content = open(path).read()
          new = re.sub(
              r'(?m)^(version = ")([^"]+)(")',
              lambda m: f'{m.group(1)}{m.group(2)}.dev{suffix}{m.group(3)}',
              content,
          )
          open(path, "w").write(new)

          # Every preview job stamps from the same head SHA, so each one can derive
          # its siblings' dev versions itself. Pinning them is what makes the wheel
          # installable as a set: [tool.uv.sources] workspace linkage is uv-local
          # and never reaches wheel metadata, so an unpinned floor is satisfied by
          # the stable release and the dev sibling is simply never selected.
          lines = open(path).read().split("\n")
          string_re = re.compile(r"\"[^\"]*\"|'[^']*'")
          req_re = re.compile(
              r"\"([A-Za-z0-9][A-Za-z0-9._-]*)(\[[^\]\"]*\])?([^\"]*)\""
              r"|'([A-Za-z0-9][A-Za-z0-9._-]*)(\[[^\]']*\])?([^']*)'"
          )
          rewrites = {c: 0 for c in dev}

          def pin(match):
              double = match.group(1) is not None
              quote = '"' if double else "'"
              name = match.group(1) if double else match.group(4)
              extras = (match.group(2) if double else match.group(5)) or ""
              rest = (match.group(3) if double else match.group(6)) or ""
              target = dev.get(canon(name))
              if target is None:
                  return match.group(0)
              rewrites[canon(name)] += 1
              marker = ";" + rest.split(";", 1)[1] if ";" in rest else ""
              return f"{quote}{name}{extras}=={target}{marker}{quote}"

          # Only PEP 621 requirement lists are rewritten; [tool.uv] names these
          # packages too and its entries are not dependency specifiers.
          table, key, depth, scanned = "", None, 0, []
          for i, line in enumerate(lines):
              header = re.match(r"\s*\[([^\]]+)\]\s*$", line)
              if header:
                  table, key, depth = header.group(1), None, 0
                  continue
              bare = string_re.sub("", line)
              if depth == 0:
                  assign = re.match(r"\s*([A-Za-z0-9_.\"'-]+)\s*=", line)
                  key = assign.group(1) if assign else key
              if table.startswith("project"):
                  scanned.append(line)
                  requirements = table == "project.optional-dependencies" or (
                      table == "project" and key == "dependencies"
                  )
                  if requirements and (depth > 0 or "[" in bare):
                      lines[i] = req_re.sub(pin, line)
              depth = max(0, depth + bare.count("[") - bare.count("]"))

          quoted = string_re.findall("\n".join(scanned))
          for name in SIBLINGS:
              if canon(name) not in dev:
                  continue
              boundary = rf"(?<![A-Za-z0-9._-]){re.escape(name)}(?![A-Za-z0-9._-])"
              declared = sum(1 for q in quoted if re.search(boundary, q))
              if declared != rewrites[canon(name)]:
                  sys.exit(
                      f"::error::{path} declares {name} in a form this step cannot "
                      f"rewrite ({declared} declared, {rewrites[canon(name)]} rewritten)"
                  )
              if rewrites[canon(name)]:
                  print(f"Pinned {name} to {dev[canon(name)]} in {path}")

          open(path, "w").write("\n".join(lines))
          PY
      - name: Build distribution
        if: steps.check.outputs.needed == 'true'
        working-directory: ${{ matrix.path }}
        run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.check.outputs.needed == 'true'
        with:
          skip-existing: true
