name: PXI Evals

permissions:
  contents: read

# Runs the PXI eval datasets under Harbor on Daytona: one task per dataset, one step per
# regression example. See evals/harbor/README.md, "The PXI eval datasets".
on:
  pull_request:
    paths:
      - "evals/pxi/**"
      - "evals/harbor/**"
      - "src/phoenix/server/agents/**"
  workflow_dispatch:
    inputs:
      splits:
        description: >-
          Dataset splits to run. The default matches PR CI; leave empty to run every
          example in every dataset.
        type: string
        default: regression

concurrency:
  group: pxi-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PXI Regression Evals (Daytona)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
      PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"

      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      # The job has no CLI agent, so the px archive is not built. Pull requests run the
      # regression split; a manual run with an empty splits input runs every example.
      - name: Build the Phoenix wheel and stage the PXI tasks
        env:
          SPLITS: ${{ github.event_name == 'pull_request' && 'regression' || inputs.splits }}
        run: |
          args=""
          if [ -n "$SPLITS" ]; then
            args="--splits $SPLITS"
          fi
          HARBOR_PXI_ARGS="$args" HARBOR_CLI=0 make harbor-stage

      # The agent is nondeterministic and the regression split tolerates about one miss
      # per dataset (see evals/pxi/thresholds.yaml). The bar is the mean step reward
      # across tasks; tighten it once there is a pass-rate history for this runner.
      - name: Run the PXI datasets
        run: |
          make harbor-run HARBOR_JOB=evals/harbor/jobs/pxi.yaml
          python3 evals/harbor/scripts/check_job_reward.py --min-reward 0.9

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pxi-harbor-jobs
          path: jobs/
          retention-days: 30
