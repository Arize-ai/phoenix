name: PXI Evals
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pxi-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      pxi: ${{ steps.filter.outputs.pxi }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            pxi:
              - ".github/workflows/pxi-evals.yml"
              - "evals/harbor/**"
              - "src/phoenix/server/agents/**"

  regression:
    name: PXI Regression Evals (Daytona)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.pxi == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 90
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
      PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"

      - name: Install PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: js/package.json

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      # The job has no CLI agent, so the px archive is not built.
      - name: Build the Phoenix wheel and stage the PXI tasks
        run: HARBOR_PXI_ARGS="--splits regression" HARBOR_CLI=0 make harbor-prepare

      # The agent is nondeterministic and the regression split tolerates about one miss
      # per dataset. The bar is the mean step reward across tasks; tighten it once there
      # is a pass-rate history for this runner. The label lets the cleanup step below find
      # this run's sandboxes.
      - name: Run the PXI datasets
        env:
          CI_RUN: ${{ github.run_id }}
        run: |
          make harbor-run HARBOR_JOB=evals/harbor/jobs/pxi.yaml \
            HARBOR_ARGS="--ek labels='{\"ci_run\": \"$CI_RUN\"}'"
          python3 evals/harbor/scripts/check_job_reward.py --min-reward 0.9

      # A cancelled run, for example when a newer commit arrives, kills `harbor run`
      # before it deletes its sandboxes. Delete whatever this run left on Daytona.
      - name: Delete the run's Daytona sandboxes
        if: always()
        env:
          CI_RUN: ${{ github.run_id }}
        run: |
          uv run --script evals/harbor/scripts/delete_daytona_sandboxes.py --label "ci_run=$CI_RUN"

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pxi-harbor-jobs
          path: jobs/
          retention-days: 30

  ci-required:
    name: PXI Regression Evals CI Required
    needs:
      - changes
      - regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
