name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - helm/Chart.yaml

jobs:
  chart-version:
    name: Check the chart version changed
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
    - name: Check out the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Compare the chart version with the previous commit
      id: diff
      run: |
        previous=$(git show HEAD~1:helm/Chart.yaml | sed -n 's/^version: *//p')
        current=$(sed -n 's/^version: *//p' helm/Chart.yaml)
        echo "previous=$previous current=$current"
        if [ "$previous" != "$current" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  push-helm:
    name: Push Helm
    needs: chart-version
    if: needs.chart-version.outputs.changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      REGISTRY: arizephoenix
    steps:
    - name: Check out the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Log in to Docker Hub
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      with:
        version: 'latest'
    - name: Add Helm repositories
      run: |
        helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
        helm repo update
    - name: Package Helm chart
      run: |
        helm dependency build helm/
        helm package ./helm
    - name: Push Helm chart to Docker Hub
      run: |
        # Push the chart to Docker Hub as an OCI artifact
        helm push phoenix-helm-*.tgz oci://registry-1.docker.io/${{ env.REGISTRY }}
    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        repository: ${{ env.REGISTRY }}/phoenix-helm
        readme-filepath: ./helm/README.md 
