name: Build every Phoenix variant for one platform
description: >-
  Build each requested variant once for a single platform and upload OCI image
  archives. Independent publishing jobs consume the same archives, so a registry
  outage cannot block another registry's uploads.

inputs:
  variants:
    description: Space-separated variants to build — any of root, nonroot, debug.
    required: true
  platform:
    description: Target platform in Docker form, e.g. linux/amd64.
    required: true
  context:
    description: Application source directory.
    default: .
  preview-context:
    description: Trusted preview launcher directory; empty for regular images.
    default: ""
  seed-context:
    description: Preview seed directory.
    default: ""
  enable-cache:
    description: Allow the shared WASM cache; disabled for PR builds.
    default: "true"
  revision:
    description: Source commit recorded in image labels.
    default: ""
  dockerhub-username:
    description: Docker Hub user for authenticated base-image pulls.
    required: true
  dockerhub-password:
    description: Docker Hub token for authenticated base-image pulls.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve platform slug
      id: resolve
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        VARIANTS: ${{ inputs.variants }}
      run: |
        set -euo pipefail
        [ -n "${VARIANTS// /}" ] || { echo "no variants requested" >&2; exit 1; }
        for variant in $VARIANTS; do
          case "$variant" in
            root|nonroot|debug) ;;
            *) echo "unknown variant: $variant" >&2; exit 1 ;;
          esac
        done
        echo "platform-slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log in to Docker Hub
      continue-on-error: true
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Extract image labels
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        labels: org.opencontainers.image.revision=${{ inputs.revision || github.sha }}

    # The WASM fetch is the only download here with no registry-protocol
    # retry beneath it, and the release asset drops connections. Building
    # that stage alone parks its layer in the Actions cache so the builds
    # below restore it instead of refetching. Scoped by platform because the
    # stage never reads the variant. ~78MB per scope; exporting the builder
    # stages too would be ~1.3GB per leg and would not fit the repository's
    # shared 10GB budget.
    #
    # This is the only step that touches the Actions cache. Once it runs, the
    # layer is in the local builder, which is what the variant builds below
    # consume — they need no cache-from of their own.
    - name: Warm the WASM layer cache
      if: inputs.enable-cache == 'true'
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        platforms: ${{ inputs.platform }}
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile
        target: wasm-runtime
        provenance: false
        sbom: false
        outputs: type=cacheonly
        cache-from: type=gha,scope=wasm-${{ steps.resolve.outputs.platform-slug }}
        # ignore-error: a cache export must never fail a publish. The layer is
        # already local by then; the export only serves the next run.
        cache-to: type=gha,scope=wasm-${{ steps.resolve.outputs.platform-slug }},mode=max,ignore-error=true

    # Sequential on purpose: the first variant builds the frontend, backend and
    # WASM stages, and the rest reuse them from the local builder, leaving only
    # the final FROM and its COPYs. Never exits non-zero — a variant that fails
    # must not withhold the digests of the ones that succeeded, so failures are
    # recorded and reported after the upload.
    - name: Build each variant as an OCI archive
      id: build
      shell: bash
      env:
        VARIANTS: ${{ inputs.variants }}
        PLATFORM: ${{ inputs.platform }}
        BUILD_CONTEXT: ${{ inputs.context }}
        PREVIEW_CONTEXT: ${{ inputs.preview-context }}
        SEED_CONTEXT: ${{ inputs.seed-context }}
        BAKE_FILE: ${{ github.action_path }}/docker-bake.hcl
        LABELS: ${{ steps.meta.outputs.labels }}
      run: |
        set -uo pipefail

        build_target=application
        if [ -n "$PREVIEW_CONTEXT" ]; then
          build_target=preview
        fi
        label_args=()
        while IFS= read -r label; do
          [ -n "$label" ] && label_args+=(--set "${build_target}.labels.${label}")
        done <<< "$LABELS"

        out="${RUNNER_TEMP}/images"
        platform_slug="${PLATFORM//\//-}"
        failed=""
        for variant in $VARIANTS; do
          case "$variant" in
            root)    base=gcr.io/distroless/python3-debian13 ;;
            nonroot) base=gcr.io/distroless/python3-debian13:nonroot ;;
            debug)   base=gcr.io/distroless/python3-debian13:debug ;;
          esac

          echo "::group::build ${variant} (${PLATFORM})"
          variant_dir="${out}/${variant}/${platform_slug}"
          mkdir -p "$variant_dir"
          meta="${RUNNER_TEMP}/metadata-${variant}.json"
          if BASE_IMAGE="$base" ARCHIVE_PATH="${variant_dir}/image.tar" docker buildx bake \
               --file "$BAKE_FILE" \
               --provenance mode=max \
               --sbom true \
               "${label_args[@]}" \
               --metadata-file "$meta" \
               "$build_target"
          then
            digest=$(jq -r --arg target "$build_target" '.[$target]["containerimage.digest"]' "$meta")
            if [ -z "$digest" ] || [ "$digest" = null ]; then
              echo "::error::${variant}: build reported success but no digest"
              failed="${failed} ${variant}"
            else
              printf '%s\n' "$digest" > "${variant_dir}/digest"
              echo "${variant}: ${digest}"
            fi
          else
            echo "::error::${variant}: build failed on ${PLATFORM}"
            failed="${failed} ${variant}"
          fi
          if [ ! -f "${variant_dir}/digest" ]; then
            rm -f "${variant_dir}/image.tar"
          fi
          echo "::endgroup::"
        done

        echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

    - name: Upload root image
      if: contains(format(' {0} ', inputs.variants), ' root ')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: image-root-${{ steps.resolve.outputs.platform-slug }}
        path: ${{ runner.temp }}/images/root/
        if-no-files-found: warn
        compression-level: 0
        retention-days: 1

    - name: Upload nonroot image
      if: contains(format(' {0} ', inputs.variants), ' nonroot ')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: image-nonroot-${{ steps.resolve.outputs.platform-slug }}
        path: ${{ runner.temp }}/images/nonroot/
        if-no-files-found: warn
        compression-level: 0
        retention-days: 1

    - name: Upload debug image
      if: contains(format(' {0} ', inputs.variants), ' debug ')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: image-debug-${{ steps.resolve.outputs.platform-slug }}
        path: ${{ runner.temp }}/images/debug/
        if-no-files-found: warn
        compression-level: 0
        retention-days: 1

    - name: Report failed variants
      shell: bash
      env:
        FAILED: ${{ steps.build.outputs.failed }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        [ -z "$FAILED" ] && exit 0
        echo "::error::failed on ${PLATFORM}:${FAILED// /, }"
        exit 1
