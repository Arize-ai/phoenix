name: Resolve a release tag to a commit on the release branch
description: >-
  Resolve a release tag to its commit and fail unless that commit is reachable
  from the release branch (main unless overridden) and its manifest version
  matches the tag. Release jobs publish
  whatever they check out, so this refuses a tag that was moved onto a commit
  that never landed on that branch. It is defense in depth, not the access control: the
  workflow that runs it comes from the ref the release was dispatched from,
  so it only guards a release dispatched from a trusted ref. Restricting who
  can create or move release tags, and which branches may deploy to the
  publishing environments, is done in repository settings. Returns the
  commit SHA so callers check out a pinned revision rather than a movable tag.

inputs:
  tag:
    description: Tag name to resolve, without the refs/tags/ prefix.
    required: true
  package-name:
    description: Package name used in the release tag prefix.
    required: true
  package-path:
    description: Package key in .release-please-manifest.json (e.g. . for Phoenix).
    required: true
  branch:
    description: >-
      Branch the tagged commit must be reachable from. Defaults to main
      rather than the event's default branch because not every event carries
      a repository payload.
    required: false
    default: main

outputs:
  revision:
    description: >-
      Full SHA of the commit the tag points at, verified to be on the
      branch.
    value: ${{ steps.resolve.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Resolve tag and verify it is on the branch
      id: resolve
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # ls-remote accepts patterns: reject malformed refs rather than allowing
        # a wildcard input to resolve a different release tag.
        if ! git check-ref-format "refs/tags/${TAG}"; then
          echo "::error::Invalid release tag: ${TAG}"
          exit 1
        fi
        if [ -z "$BRANCH" ]; then
          echo "::error::No branch to verify tag ${TAG} against"
          exit 1
        fi
        # ls-remote lists the peeled `^{}` line after an annotated tag's own
        # line, so the last line is the commit for both tag types.
        if ! REVISION=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n1 | cut -f1); then
          echo "::error::Could not resolve tag ${TAG} from origin"
          exit 1
        fi
        if [ -z "$REVISION" ]; then
          echo "::error::Tag ${TAG} does not exist"
          exit 1
        fi
        # The compare API needs no local history (release jobs use shallow
        # checkouts). identical/behind: every commit at the tag is on the
        # branch. ahead/diverged: at least one is not. per_page=1 trims the
        # commit and file lists; status covers the full range.
        if ! STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BRANCH}...${REVISION}?per_page=1" --jq .status); then
          echo "::error::Could not verify tag ${TAG} (${REVISION}) against ${BRANCH}"
          exit 1
        fi
        case "$STATUS" in
          identical|behind) ;;
          *)
            echo "::error::Tag ${TAG} (${REVISION}) is ${STATUS} relative to ${BRANCH}. Release tags must point at a commit that is already on ${BRANCH}."
            exit 1
            ;;
        esac
        # Read the manifest at the immutable revision, not the dispatch commit
        # or the tag name: ancestry alone does not prove this is the named version.
        if ! VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${REVISION}" \
          -H 'Accept: application/vnd.github.raw+json' \
          | jq -er --arg path "$PACKAGE_PATH" '.[$path] | select(type == "string" and length > 0)'); then
          echo "::error::Could not read manifest version for ${PACKAGE_PATH} at ${REVISION}"
          exit 1
        fi
        if [ -z "$PACKAGE_NAME" ] || [ "$TAG" != "${PACKAGE_NAME}-v${VERSION}" ]; then
          echo "::error::Tag ${TAG} does not match manifest release ${PACKAGE_NAME}-v${VERSION} at ${REVISION}"
          exit 1
        fi
        echo "Tag ${TAG} -> ${REVISION} (on ${BRANCH})"
        echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
