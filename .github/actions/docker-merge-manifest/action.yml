name: Merge per-platform digests into one manifest list
description: >-
  Collect the digests pushed by every platform build of a variant and assemble
  them into a single multi-platform manifest list under the given tags. Fails
  if any expected digest is missing, so a half-built manifest is never tagged.

inputs:
  variant:
    description: Image variant whose digests to collect — must match the build job.
    required: true
  tags:
    description: Newline-separated list of fully qualified tags to apply.
    required: true
  expected-digests:
    description: Number of platform digests required before tagging.
    required: true
  dockerhub-username:
    required: true
  dockerhub-password:
    required: true

runs:
  using: composite
  steps:
    # One artifact per platform, each holding a directory per variant it built.
    # Merged, they form <variant>/<digest> across every platform.
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: digests-*
        merge-multiple: true
        path: ${{ runner.temp }}/digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Log in to Docker Hub
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Log in to GHCR
      if: contains(inputs.tags, 'ghcr.io/')
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Create manifest list and push
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        EXPECTED_DIGESTS: ${{ inputs.expected-digests }}
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        # nullglob so a variant that failed on every platform — and therefore
        # has no directory at all — reports found 0 rather than erroring out.
        shopt -s nullglob
        cd "${RUNNER_TEMP}/digests"

        digests=()
        for digest_file in "${VARIANT}"/*; do
          [ -f "$digest_file" ] || continue
          digests+=("sha256:$(basename "$digest_file")")
        done
        if [ "${#digests[@]}" -ne "$EXPECTED_DIGESTS" ]; then
          echo "expected $EXPECTED_DIGESTS platform digests, found ${#digests[@]}" >&2
          exit 1
        fi

        repositories=()
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          repositories+=("${tag%:*}")
        done <<< "$TAGS"
        if [ "${#repositories[@]}" -eq 0 ]; then
          echo "no tags supplied" >&2
          exit 1
        fi

        while IFS= read -r repository; do
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${repository}@${digest}")
          done
          tag_args=()
          while IFS= read -r tag; do
            [ "${tag%:*}" = "$repository" ] || continue
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=true "${tag_args[@]}" "${sources[@]}"
        done < <(printf '%s\n' "${repositories[@]}" | sort -u)

    - name: Verify published platforms
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        EXPECTED_DIGESTS: ${{ inputs.expected-digests }}
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          raw=$(docker buildx imagetools inspect --raw "$tag")
          platforms=$(jq -r '[.manifests // [] | .[] | select(.platform.os != null and .platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' <<< "$raw")
          expected="linux/amd64,linux/arm64"
          if [ "$EXPECTED_DIGESTS" = 1 ]; then
            expected="linux/amd64"
          fi
          echo "$tag platforms: ${platforms:-<none>}"
          if [ "$platforms" != "$expected" ]; then
            echo "expected $expected in $tag, found $platforms" >&2
            exit 1
          fi
        done <<< "$TAGS"
