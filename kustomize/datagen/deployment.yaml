apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-datagen
  labels:
    app: phoenix-datagen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-datagen
  template:
    metadata:
      labels:
        app: phoenix-datagen
    spec:
      containers:
        - name: datagen
          image: arizephoenix/phoenix:version-20.4.0
          # The image ENTRYPOINT is the Python interpreter; args replaces the
          # image CMD while keeping that ENTRYPOINT.
          args:
            - -m
            - phoenix.server.main
            - datagen
          env:
            - name: PHOENIX_COLLECTOR_ENDPOINT
              value: http://phoenix:6006
