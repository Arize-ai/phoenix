apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: phoenix
spec:
  template:
    spec:
      containers:
      - name: phoenix
        env:
        - name: PHOENIX_ENABLE_AUTH
          value: "true"
        # Enabling auth requires a secret. Create it before applying this overlay:
        #   kubectl create secret generic phoenix-secret \
        #     --from-literal=secret-key="$(openssl rand -hex 32)"
        - name: PHOENIX_SECRET
          valueFrom:
            secretKeyRef:
              name: phoenix-secret
              key: secret-key
