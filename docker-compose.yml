services:
  phoenix:
    build:
      dockerfile: ./Dockerfile
      context: .
    depends_on:
      - db
    ports:
      - 6006:6006
      - 4317:4317
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
  datagen:
    build:
      dockerfile: ./Dockerfile
      context: .
    command: phoenix datagen
    profiles: ["datagen"]
    depends_on:
      - phoenix
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-datagen-default}
      - PHOENIX_DATAGEN_RATE=${PHOENIX_DATAGEN_RATE:-12}
      - PHOENIX_DATAGEN_EPSILON=${PHOENIX_DATAGEN_EPSILON:-0.02}
      - PHOENIX_DATAGEN_SEED=${PHOENIX_DATAGEN_SEED:-0}
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432
    volumes:
      - database_data:/var/lib/postgresql/data
volumes:
  database_data:
    driver: local
