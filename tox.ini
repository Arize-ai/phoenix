[testenv:integration_tests]
description = Run integration tests
pass_env =
  CI_TEST_DB_BACKEND
changedir = tests/integration
setenv =
  PHOENIX_MASK_INTERNAL_SERVER_ERRORS = false
commands_pre =
  uv pip install --strict -U -r {toxinidir}/requirements/integration-tests.txt
  uv pip install --strict --reinstall-package arize-phoenix-evals {toxinidir}/packages/phoenix-evals
  uv pip install --no-sources --strict --reinstall-package arize-phoenix {toxinidir}
  python -c "import sysconfig, re, pathlib; vf=pathlib.Path(sysconfig.get_path('purelib'))/'phoenix'/'version.py'; m=re.search(r'\"(\d+)\.',vf.read_text()); vf.write_text(f'__version__ = \"{int(m.group(1))+1}.0.0\"\n')"  # Return the next major version in response headers so all client methods work; otherwise, some may be version-gated. Avoids importing phoenix (which triggers heavy deps like pandas/numpy).
  uv pip install --strict --reinstall-package arize-phoenix-client {toxinidir}/packages/phoenix-client
commands =
  uv pip list -v
  pytest {posargs} .

[testenv:unit_tests]
description = Run unit tests
changedir = tests
# uv installs without bytecode by default, which leaves every xdist worker to
# compile each module it imports on first use.
setenv =
  PHOENIX_MASK_INTERNAL_SERVER_ERRORS = false
  UV_COMPILE_BYTECODE = 1
  PYTHONUNBUFFERED = 1
  STARTUP_WALL_LOG = {envtmpdir}/startup-wall.log
  PHOENIX_TEST_TRACKING = false
commands_pre =
  uv pip install --strict -U -r {toxinidir}/requirements/unit-tests.txt
  uv pip install --strict --reinstall-package arize-phoenix-evals {toxinidir}/packages/phoenix-evals
  uv pip install --no-sources --strict --reinstall-package arize-phoenix {toxinidir}
commands =
  uv pip list -v
  python -c "import os, platform, subprocess, sys, time; print('cpu_count', os.cpu_count(), platform.machine(), platform.python_version()); cpuinfo = open('/proc/cpuinfo').read() if os.path.exists('/proc/cpuinfo') else ''; print('model', cpuinfo.split('model name')[1].split(chr(10))[0] if 'model name' in cpuinfo else 'n/a'); t0 = time.perf_counter(); r = subprocess.run([sys.executable, '-X', 'importtime', '-c', 'import phoenix.server.app'], capture_output=True, text=True); print('wall for import phoenix.server.app in a fresh process: %.2fs' % (time.perf_counter() - t0)); rows = [l.split('|') for l in r.stderr.splitlines() if l.startswith('import time:') and 'cumulative' not in l]; rows = [(int(a.split(':')[1]), int(b), c) for a, b, c in rows]; print('importtime: top 40 by cumulative microseconds'); [print('%10d %s' % (cum, name)) for _, cum, name in sorted(rows, key=lambda t: -t[1])[:40]]; print('importtime: top 25 by self microseconds'); [print('%10d %s' % (own, name.strip())) for own, _, name in sorted(rows, key=lambda t: -t[0])[:25]]"
  python -c "import os, subprocess, sys, time; aff = getattr(os, 'sched_getaffinity', None); print('affinity', len(aff(0)) if aff else 'n/a'); print('cgroup cpu.max', open('/sys/fs/cgroup/cpu.max').read().strip() if os.path.exists('/sys/fs/cgroup/cpu.max') else 'n/a'); cpuinfo = open('/proc/cpuinfo').read() if os.path.exists('/proc/cpuinfo') else ''; print('smt', sorted(set(l.strip() for l in cpuinfo.splitlines() if l.startswith(('siblings', 'cpu cores'))))); code = 'sum(i*i for i in range(20000000))'; [print('parallel %2d x cpu loop: %.2fs' % (n, (lambda t0, ps: ([p.wait() for p in ps], time.perf_counter() - t0)[1])(time.perf_counter(), [subprocess.Popen([sys.executable, '-c', code]) for _ in range(n)]))) for n in (1, 2, 4, 8, 16, 32)]"
  pytest {posargs} unit/
commands_post =
  python -c "import os; p = os.environ['STARTUP_WALL_LOG']; print('startup-wall log:'); print(open(p).read() if os.path.exists(p) else 'missing')"

[testenv:unit_tests_local_evals]
description = Run unit tests with phoenix-evals installed from local source
changedir = tests
commands_pre =
  uv pip install --strict -U -r {toxinidir}/requirements/unit-tests.txt
  uv pip install --no-sources --strict --reinstall-package arize-phoenix --reinstall-package arize-phoenix-evals ../. arize-phoenix-evals@../packages/phoenix-evals
commands =
  uv pip list -v
  pytest {posargs} unit/
