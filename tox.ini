[testenv:phoenix_evals]
description = Run tests for the arize-phoenix-evals package
changedir = packages/phoenix-evals/
commands_pre =
  uv pip install --strict -U -r {toxinidir}/requirements/packages/phoenix-evals.txt
  uv pip install --strict --reinstall-package arize-phoenix-executors {toxinidir}/packages/phoenix-executors
  uv pip install --strict --reinstall-package arize-phoenix-evals .[test]
commands =
  uv pip list -v
  mypy .
  pytest {posargs} .

[testenv:phoenix_executors]
description = Run tests for the arize-phoenix-executors package
changedir = packages/phoenix-executors/
commands_pre =
  uv pip install --strict -U -r {toxinidir}/requirements/ci.txt
  uv pip install --strict --reinstall-package arize-phoenix-executors .[test]
commands =
  uv pip list -v
  {envbindir}/pyright .
  {envbindir}/mypy --strict .
  pytest -ra --ignore=tests/mixed_version {posargs:.}

[testenv:phoenix_executors_mixed_version]
description = Run arize-phoenix-executors against a pre-consolidation arize-phoenix-evals from PyPI
changedir = packages/phoenix-executors/
commands_pre =
# --no-sources is what earns this environment its keep: [tool.uv.sources] maps
# arize-phoenix-evals to the workspace, so without it uv installs the local source and the version
# skew these tests exist to exercise never occurs — they would pass vacuously. Root arize-phoenix
# is deliberately absent: its evals floor is rewritten on every evals publish and would conflict
# with the pin.
  uv pip install --no-sources --strict -U -r {toxinidir}/requirements/packages/phoenix-executors-mixed-version.txt
  uv pip install --strict --reinstall-package arize-phoenix-executors .
commands =
  uv pip list -v
  pytest -ra {posargs} tests/mixed_version

[testenv:phoenix_otel]
description = Run tests for the arize-phoenix-otel package
changedir = packages/phoenix-otel/
commands_pre =
