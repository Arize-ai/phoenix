schema_version = "1.3"
multi_step_reward_strategy = "mean"

[task]
name = "arize/word-count"
description = "Build a small word-count CLI in three steps: count words, add a --top flag, then document it."
keywords = ["multi-step", "python", "cli"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["multi-step"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"

[[steps]]
name = "write_script"
min_reward = 1.0

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "add_top_flag"

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "write_readme"

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
timeout_sec = 60.0
