<svg viewBox="-6 0 1212 438" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How the Phoenix plugin maps Harbor to Phoenix"><style>:root{--paper:#0e0e0e;--node:#1d1d1d;--ink:#f2f2f2;--muted:#b0b0b0;--soft:#8d8d8d;--rule:rgba(255,255,255,.14);--accent:#00adee;--accent-tint:rgba(0,173,238,.14);--accent-zone:rgba(0,173,238,.05);--accent-line:rgba(0,173,238,.6);--store:rgba(255,255,255,.06);--ext-line:rgba(255,255,255,.3);--fs:system-ui,-apple-system,"Segoe UI",sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--paper)}.bgmask,.mask{fill:var(--paper)}
.box{stroke-width:1}.box.n{fill:var(--node);stroke:var(--soft)}.box.f{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.box.s{fill:var(--store);stroke:var(--muted)}
.zone{fill:var(--accent-zone);stroke:var(--accent-line);stroke-dasharray:4 4}
.wire{fill:none;stroke:var(--muted);stroke-width:1.2}.wire.wire-a{stroke:var(--accent)}.guide{fill:none;stroke:var(--soft)}.hair{stroke:var(--rule);stroke-width:.8}
.mk{fill:var(--muted)}.mk-a{fill:var(--accent)}
text{fill:var(--ink)}.name{font:600 17px var(--fs)}.mname{font:500 16px var(--fm)}.head{font:600 14px var(--fs)}
.sub{font:400 13px var(--fm);fill:var(--muted)}.code{font:400 13px var(--fm)}.code.c{fill:var(--soft)}
.tag{font:500 12px var(--fm);letter-spacing:.14em;fill:var(--soft)}.tag.a,.alab.a,.acc{fill:var(--accent)}
.alab{font:400 12px var(--fm);letter-spacing:.06em;fill:var(--muted)}
.name{font-size:22px}.sub{font-size:16px}.tag{font-size:14px}.mname{font-size:21px}</style><rect class="bg" x="-6" y="0" width="1212" height="438"/><defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-a" points="0 0, 8 3, 0 6"/></marker></defs><text class="tag" x="0" y="18">HARBOR</text><text class="tag a" x="0" y="274">PHOENIX</text><rect class="box n" x="0" y="172" width="1200" height="60" rx="8"/><text class="mname acc" x="600" y="210" text-anchor="middle">--plugin arize-phoenix</text><g><rect class="box n" x="0" y="34" width="216" height="96" rx="6"/><text class="name" x="20" y="76">Tasks</text><text class="sub" x="20" y="106">a folder per task</text><path class="wire" d="M108 130 V168" marker-end="url(#a)"/><path class="wire wire-a" d="M108 232 V286" marker-end="url(#b)"/><rect class="box f" x="0" y="290" width="216" height="96" rx="6"/><text class="name" x="20" y="332">Dataset</text><text class="sub" x="20" y="362">versioned examples</text></g><g><rect class="box n" x="246" y="34" width="216" height="96" rx="6"/><text class="name" x="266" y="76">Agent configs</text><text class="sub" x="266" y="106">agent + model</text><path class="wire" d="M354 130 V168" marker-end="url(#a)"/><path class="wire wire-a" d="M354 232 V286" marker-end="url(#b)"/><rect class="box f" x="246" y="290" width="216" height="96" rx="6"/><text class="name" x="266" y="332">Experiments</text><text class="sub" x="266" y="362">one per config</text></g><g><rect class="box n" x="492" y="34" width="216" height="96" rx="6"/><text class="name" x="512" y="76">Trials</text><text class="sub" x="512" y="106">one sandbox each</text><path class="wire" d="M600 130 V168" marker-end="url(#a)"/><path class="wire wire-a" d="M600 232 V286" marker-end="url(#b)"/><rect class="box f" x="492" y="290" width="216" height="96" rx="6"/><text class="name" x="512" y="332">Experiment runs</text><text class="sub" x="512" y="362">one per attempt</text></g><g><rect class="box n" x="738" y="34" width="216" height="96" rx="6"/><text class="name" x="758" y="76">Rewards</text><text class="sub" x="758" y="106">reward.json</text><path class="wire" d="M846 130 V168" marker-end="url(#a)"/><path class="wire wire-a" d="M846 232 V286" marker-end="url(#b)"/><rect class="box f" x="738" y="290" width="216" height="96" rx="6"/><text class="name" x="758" y="332">Annotations</text><text class="sub" x="758" y="362">plus infra_ok</text></g><g><rect class="box n" x="984" y="34" width="216" height="96" rx="6"/><text class="name" x="1004" y="76">Trajectories</text><text class="sub" x="1004" y="106">ATIF steps</text><path class="wire" d="M1092 130 V168" marker-end="url(#a)"/><path class="wire wire-a" d="M1092 232 V286" marker-end="url(#b)"/><rect class="box f" x="984" y="290" width="216" height="96" rx="6"/><text class="name" x="1004" y="332">Traces</text><text class="sub" x="1004" y="362">linked to each run</text></g><g><path class="guide" d="M4 398 V406 H458 V398"/><text class="tag" x="231" y="428" text-anchor="middle">AT JOB START</text></g><g><path class="guide" d="M496 398 V406 H1196 V398"/><text class="tag" x="846" y="428" text-anchor="middle">AS EACH TRIAL ENDS</text></g></svg>
