schema_version: '1.1'
name: mcp-neg-elixir-phoenix
runs: 3
tags:
- mcp
- phoenix-error-analysis
- negative
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Skill
  - Read
  prompt: In Elixir Phoenix, show a minimal GET /health route returning ok. This concerns the
    web framework, not an LLM observability service.
graders:
- name: outcome
  type: llm
  focus: last_message
  weight: 0.5
  criteria: 'Grade one claim: The response shows an Elixir Phoenix health route and a response
    that returns ok. PASS if true; FAIL if absent, false or the response is empty.'
- name: no-load_skill
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__load_skill
  min: 0
  max: 0
  arm: both
- name: no-execute
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__execute
  min: 0
  max: 0
  arm: both
- name: no-search
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__search
  min: 0
  max: 0
  arm: both
- name: no-get_schema
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__get_schema
  min: 0
  max: 0
  arm: both
- name: no-list_tools
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__list_tools
  min: 0
  max: 0
  arm: both
- name: no-tags
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__tags
  min: 0
  max: 0
  arm: both
- name: no-load_skill_reference
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__load_skill_reference
  min: 0
  max: 0
  arm: both
