schema_version: '1.1'
name: mcp-open-before-axial
runs: 3
tags:
- mcp
- phoenix-error-analysis
- positive
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Skill
  - Read
  prompt: We want to understand what is going wrong in Phoenix agent traffic. We have no reviewed
    notes yet. Do not fetch data or write annotations in this planning step. Should we first create
    failure categories or first inspect examples? Explain the first phase.
graders:
- name: outcome
  type: llm
  focus: last_message
  weight: 0.5
  criteria: 'Grade one claim: The response begins with open coding grounded in sampled entities
    and notes, deferring categories until notes exist. PASS if true; FAIL if absent, false or
    the response is empty.'
- name: skill-fired
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__load_skill
  input_match: '"skill_name"\s*:\s*"phoenix-error-analysis"'
  arm: with-only
- name: no-data-access
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__execute
  min: 0
  max: 0
  arm: both
