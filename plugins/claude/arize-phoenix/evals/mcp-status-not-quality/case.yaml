schema_version: '1.1'
name: mcp-status-not-quality
runs: 3
tags:
- mcp
- phoenix-error-analysis
- positive
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Skill
  - Read
  prompt: Help plan an investigation of wrong answers in Phoenix. All recorded spans have status
    OK, but a tool output says no such column and the assistant claims there were no matching
    customers. Explain what to inspect; do not fetch data or write anything yet.
graders:
- name: outcome
  type: llm
  focus: last_message
  weight: 0.5
  criteria: 'Grade one claim: The response identifies the tool error payload and the unsupported
    final answer as review evidence despite successful span statuses. PASS if true; FAIL if absent,
    false or the response is empty.'
- name: skill-fired
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__load_skill
  input_match: '"skill_name"\s*:\s*"phoenix-error-analysis"'
  arm: with-only
- name: no-data-access
  type: tool_used
  tool: mcp__plugin_arize-phoenix_phoenix__execute
  min: 0
  max: 0
  arm: both
